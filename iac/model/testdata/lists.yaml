      operationId: PairsService_DeletePair
      responses:
        '200': {description: ok, content: {application/json: {schema: {type: object}}}}
  /labels:
    post:
      tags: [Labels Service]
      operationId: LabelsService_CreateLabel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: CreateLabelRequest
              type: object
              required: [key]
              properties:
                key: {type: string, minLength: 1, x-coralogix-presence: true}
