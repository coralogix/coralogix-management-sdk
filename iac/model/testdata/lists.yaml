      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Evaluation'}}}}
    get:
      tags: [Evaluations Service]
      operationId: EvaluationsService_ListEvaluations
      parameters:
        - {in: query, name: pageOffset, required: false, schema: {type: integer, format: int32}}
        - {in: query, name: pageSize, required: false, schema: {type: integer, format: int32}}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/ListEvaluationsResponse'}}}}
  /evaluations/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Evaluations Service]
      operationId: EvaluationsService_GetEvaluation
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Evaluation'}}}}
    put:
      tags: [Evaluations Service]
      operationId: EvaluationsService_ReplaceEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: ReplaceEvaluationRequest
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, x-coralogix-presence: true}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Evaluation'}}}}
    delete:
      tags: [Evaluations Service]
      operationId: EvaluationsService_DeleteEvaluation
      responses:
        '200': {description: ok, content: {application/json: {schema: {type: object}}}}
  /pairs:
    post:
      tags: [Pairs Service]
      operationId: PairsService_CreatePair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: CreatePairRequest
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, x-coralogix-presence: true}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Pair'}}}}
    get:
      tags: [Pairs Service]
      operationId: PairsService_ListPairs
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/ListPairsResponse'}}}}
  /pairs/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Pairs Service]
