        '200': {description: ok, content: {application/json: {schema: {type: object}}}}
components:
  schemas:
    ConnectorType:
      type: string
      enum: [CONNECTOR_TYPE_UNSPECIFIED, CONNECTOR_TYPE_SLACK]
    Connector:
      type: object
      required: [id, name]
      properties:
        id: {type: string, readOnly: true, x-coralogix-presence: true}
        name: {type: string, minLength: 1, x-coralogix-presence: true}
    ListConnectorsResponse:
      type: object
      properties:
        connectors:
          type: array
          maxItems: 800
          minItems: 0
          items: {$ref: '#/components/schemas/Connector'}
    GlobalRouter:
      type: object
      required: [id, name]
      properties:
        id: {type: string, readOnly: true, x-coralogix-presence: true}
        name: {type: string, minLength: 1, x-coralogix-presence: true}
    ListGlobalRoutersResponse:
      type: object
      properties:
        routers:
          type: array
          items:
            allOf: [{$ref: '#/components/schemas/GlobalRouter'}]
            description: A router.
    Preset:
      type: object
      required: [id, name]
      properties:
        id: {type: string, readOnly: true, x-coralogix-presence: true}
        name: {type: string, minLength: 1, x-coralogix-presence: true}
    PresetSummary:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        connectorType: {$ref: '#/components/schemas/ConnectorType'}
    ListPresetSummariesResponse:
      type: object
      properties:
        presetSummaries:
          type: array
          items: {$ref: '#/components/schemas/PresetSummary'}
    ViewFolder:
      type: object
      required: [id, name]
      properties:
        id: {type: string, readOnly: true, x-coralogix-presence: true}
        name: {type: string, minLength: 1, x-coralogix-presence: true}
    ListViewFoldersResponse:
      type: object
      properties:
        folders:
          type: array
          items: {$ref: '#/components/schemas/ViewFolder'}
    Evaluation:
      type: object
      required: [id, name]
      properties:
        id: {type: string, readOnly: true, x-coralogix-presence: true}
        name: {type: string, minLength: 1, x-coralogix-presence: true}
    ListEvaluationsResponse:
      type: object
      properties:
        evaluations:
          type: array
          items: {$ref: '#/components/schemas/Evaluation'}
        totalCount: {type: integer, format: int32}
    Pair:
      type: object
      required: [id, name]
      properties:
        id: {type: string, readOnly: true, x-coralogix-presence: true}
        name: {type: string, minLength: 1, x-coralogix-presence: true}
    ListPairsResponse:
      type: object
      properties:
        pairs:
          type: array
          items: {$ref: '#/components/schemas/Pair'}
        archived:
          type: array
          items: {$ref: '#/components/schemas/Pair'}
        names:
          type: array
          items: {type: string}
    Label:
      type: object
      required: [id, key]
      properties:
        id: {type: string, readOnly: true, x-coralogix-presence: true}
        key: {type: string, minLength: 1, x-coralogix-presence: true}
    LabelSummary:
      type: object
      properties:
        id: {type: string}
        key: {type: string}
    ListLabelsResponse:
      type: object
      properties:
        labels:
          type: array
          items: {$ref: '#/components/schemas/LabelSummary'}
