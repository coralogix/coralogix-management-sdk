              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, x-coralogix-presence: true}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Preset'}}}}
  /presets:summariesList:
    get:
      tags: [Presets Service]
      operationId: PresetsService_ListPresetSummaries
      parameters:
        - {in: query, name: entity_type, required: false, schema: {type: string}}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/ListPresetSummariesResponse'}}}}
  /presets/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Presets Service]
      operationId: PresetsService_GetPreset
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Preset'}}}}
    put:
      tags: [Presets Service]
      operationId: PresetsService_ReplacePreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: ReplacePresetRequest
