      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Preset'}}}}
    delete:
      tags: [Presets Service]
      operationId: PresetsService_DeletePreset
      responses:
        '200': {description: ok, content: {application/json: {schema: {type: object}}}}
  /folders:
    post:
      tags: [Folders Service]
      operationId: FoldersService_CreateViewFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: CreateViewFolderRequest
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, x-coralogix-presence: true}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/ViewFolder'}}}}
    get:
      tags: [Folders Service]
      operationId: FoldersService_ListViewFolders
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/ListViewFoldersResponse'}}}}
  /folders/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Folders Service]
      operationId: FoldersService_GetViewFolder
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/ViewFolder'}}}}
    put:
      tags: [Folders Service]
      operationId: FoldersService_ReplaceViewFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: ReplaceViewFolderRequest
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, x-coralogix-presence: true}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/ViewFolder'}}}}
    delete:
      tags: [Folders Service]
      operationId: FoldersService_DeleteViewFolder
      responses:
        '200': {description: ok, content: {application/json: {schema: {type: object}}}}
  /evaluations:
    post:
      tags: [Evaluations Service]
      operationId: EvaluationsService_CreateEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: CreateEvaluationRequest
              type: object
