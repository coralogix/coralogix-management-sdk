# Resources with a List, in the shapes of the API. Each resource has the lifecycle of a new
# resource with a full-replace Update. Only the List differs.
# - Connector: a GET on the Create path with filter parameters only. The items are the resource.
# - GlobalRouter: as Connector, with items in the form allOf: [$ref].
# - Preset: Create is a custom method, so the List is not on the Create path. Its items are a
#   summary component.
# - ViewFolder: a GET on the Create path with no parameters.
# - Evaluation: a List that pages with an offset and a size, next to a count.
# - Pair: a List response with two arrays of objects.
# - Label: a List of summaries that have no name.
openapi: 3.1.0
info: {title: lists, version: 1.0.0}
paths:
  /connectors:
    post:
      tags: [Connectors Service]
      operationId: ConnectorsService_CreateConnector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: CreateConnectorRequest
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, x-coralogix-presence: true}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Connector'}}}}
    get:
      tags: [Connectors Service]
      operationId: ConnectorsService_ListConnectors
      parameters:
        - in: query
          name: connector_type
          required: false
          schema:
            allOf: [{$ref: '#/components/schemas/ConnectorType'}]
            x-coralogix-presence: true
        - in: query
          name: supported_by_entity_type
          required: false
          schema: {type: string}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/ListConnectorsResponse'}}}}
  /connectors/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Connectors Service]
      operationId: ConnectorsService_GetConnector
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Connector'}}}}
    put:
      tags: [Connectors Service]
      operationId: ConnectorsService_ReplaceConnector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: ReplaceConnectorRequest
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, x-coralogix-presence: true}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Connector'}}}}
    delete:
      tags: [Connectors Service]
      operationId: ConnectorsService_DeleteConnector
      responses:
        '200': {description: ok, content: {application/json: {schema: {type: object}}}}
  /routers:
    post:
      tags: [Global Routers Service]
      operationId: GlobalRoutersService_CreateGlobalRouter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: CreateGlobalRouterRequest
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, x-coralogix-presence: true}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/GlobalRouter'}}}}
    get:
      tags: [Global Routers Service]
      operationId: GlobalRoutersService_ListGlobalRouters
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/ListGlobalRoutersResponse'}}}}
  /routers/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Global Routers Service]
      operationId: GlobalRoutersService_GetGlobalRouter
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/GlobalRouter'}}}}
    put:
      tags: [Global Routers Service]
      operationId: GlobalRoutersService_ReplaceGlobalRouter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: ReplaceGlobalRouterRequest
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, x-coralogix-presence: true}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/GlobalRouter'}}}}
    delete:
      tags: [Global Routers Service]
      operationId: GlobalRoutersService_DeleteGlobalRouter
      responses:
        '200': {description: ok, content: {application/json: {schema: {type: object}}}}
  /presets:createCustom:
    post:
      tags: [Presets Service]
      operationId: PresetsService_CreatePreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
