name: "[Go SDK] Code Check"
permissions:
  contents: read

on:
  workflow_dispatch:  
  pull_request:
    branches: [ master ]
    paths:
      - 'go/**'
      - '.github/workflows/go-code-check.yml'

jobs:
  format_test_linux:
    name: "[Go SDK - Linux] Format, Lint, Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Check formatting and build
        run: | 
          go mod tidy
          gofmt -l .
          make build
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: go
  run_examples:
    name: "[Go SDK - Linux] Run SCIM Users Example"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Run Examples
        env:
          CORALOGIX_TEAM_API_KEY: ${{ secrets.CORALOGIX_TEAM_API_KEY }}
          CORALOGIX_USER_API_KEY: ${{ secrets.CORALOGIX_USER_API_KEY }}
          CORALOGIX_REGION: ${{ secrets.CORALOGIX_REGION }}
        run: make test
  run_openapi_examples:
    name: "[Go SDK - Linux] Run OpenAPI Examples"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Run OpenAPI Examples
        env:
          AWS_TEST_ROLE: ${{ secrets.AWS_TEST_ROLE }}
          CORALOGIX_API_KEY: ${{ secrets.CORALOGIX_TEAM_API_KEY }}
          CORALOGIX_REGION: ${{ secrets.CORALOGIX_REGION }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          METRICS_BUCKET: ${{ secrets.METRICS_BUCKET }}
          LOGS_BUCKET: ${{ secrets.LOGS_BUCKET }}
        run: make test-openapi
  run_openapi_compat:
    name: "[Go SDK - Linux] OpenAPI Forward-Compat Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install openapi-generator-cli
        run: npm install -g @openapitools/openapi-generator-cli
      - name: Run OpenAPI compat fixtures
        run: bash go/scripts/test_openapi_compat.sh
      - name: Run forward-compat unit tests
        run: go test ./go/openapi/forwardcompat/...
