{
  "openapi": "3.1.0",
  "info": {
    "title": "",
    "version": "1.0.0"
  },
  "paths": {
    "/dashboards/folders/v1": {
      "get": {
        "description": "List all dashboard folders accessible.\n\nRequires the following permissions:\n- `team-dashboards:Read`",
        "operationId": "DashboardFoldersService_ListDashboardFolders",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListDashboardFoldersResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "List dashboard folders",
        "tags": [
          "Dashboard folders service"
        ],
        "x-coralogixPermissions": [
          "team-dashboards:Read"
        ]
      },
      "put": {
        "description": "Replaces an existing dashboard folder.\n\nRequires the following permissions:\n- `team-dashboards:Update`",
        "operationId": "DashboardFoldersService_ReplaceDashboardFolder",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "Request to replace an existing dashboard folder.",
                "properties": {
                  "folder": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/DashboardFolder"
                      }
                    ],
                    "description": "The folder."
                  },
                  "requestId": {
                    "description": "Idempotency key for the replace folder request, used to prevent duplicate updates.",
                    "maxLength": 128,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string",
                    "x-coralogix-presence": true
                  }
                },
                "title": "Replace dashboard folder request data structure",
                "type": "object"
              }
            }
          }
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReplaceDashboardFolderResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Replace a dashboard folder",
        "tags": [
          "Dashboard folders service"
        ],
        "x-coralogixPermissions": [
          "team-dashboards:Update"
        ]
      },
      "post": {
        "description": "Creates a new dashboard folder.\n\nRequires the following permissions:\n- `team-dashboards:Update`",
        "operationId": "DashboardFoldersService_CreateDashboardFolder",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "Request to create a new dashboard folder.",
                "properties": {
                  "folder": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/DashboardFolder"
                      }
                    ],
                    "description": "The folder."
                  },
                  "requestId": {
                    "description": "The request id.",
                    "maxLength": 128,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string",
                    "x-coralogix-presence": true
                  }
                },
                "title": "Create dashboard folder request data structure",
                "type": "object"
              }
            }
          }
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CreateDashboardFolderResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Create a dashboard folder",
        "tags": [
          "Dashboard folders service"
        ],
        "x-coralogixPermissions": [
          "team-dashboards:Update"
        ]
      }
    },
    "/dashboards/folders/v1/{folder_id}": {
      "get": {
        "description": "Returns a dashboard folder data.\n\nRequires the following permissions:\n- `team-dashboards:Read`",
        "operationId": "DashboardFoldersService_GetDashboardFolder",
        "parameters": [
          {
            "description": "Optional client-supplied request identifier used to correlate the get folder request.",
            "in": "query",
            "name": "request_id",
            "required": false,
            "schema": {
              "description": "Optional client-supplied request identifier used to correlate the get folder request.",
              "maxLength": 128,
              "minLength": 1,
              "pattern": "^[\\s\\S]*$",
              "type": "string",
              "x-coralogix-presence": true
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/GetDashboardFolderResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Get a dashboard folder",
        "tags": [
          "Dashboard folders service"
        ],
        "x-coralogixPermissions": [
          "team-dashboards:Read"
        ]
      },
      "delete": {
        "description": "Deletes the dashboard folder with the specified ID.\n\nRequires the following permissions:\n- `team-dashboards:Update`",
        "operationId": "DashboardFoldersService_DeleteDashboardFolder",
        "parameters": [
          {
            "description": "Idempotency key for the delete folder request, used to prevent duplicate operations.",
            "in": "query",
            "name": "request_id",
            "required": false,
            "schema": {
              "description": "Idempotency key for the delete folder request, used to prevent duplicate operations.",
              "maxLength": 128,
              "minLength": 1,
              "pattern": "^[\\s\\S]*$",
              "type": "string",
              "x-coralogix-presence": true
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DeleteDashboardFolderResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Delete a dashboard folder",
        "tags": [
          "Dashboard folders service"
        ],
        "x-coralogixPermissions": [
          "team-dashboards:Update"
        ]
      },
      "parameters": [
        {
          "name": "folder_id",
          "in": "path",
          "description": "The folder id.",
          "required": true,
          "schema": {
            "description": "The folder id.",
            "maxLength": 36,
            "minLength": 36,
            "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
            "type": "string",
            "x-coralogix-presence": true
          }
        }
      ]
    }
  },
  "components": {
    "schemas": {
      "CreateDashboardFolderResponse": {
        "title": "Create dashboard folder response data structure",
        "type": "object",
        "properties": {
          "folderId": {
            "description": "The folder id.",
            "maxLength": 36,
            "minLength": 36,
            "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
            "type": "string",
            "x-coralogix-presence": true
          }
        },
        "description": "Response returned after successfully creating a dashboard folder.",
        "externalDocs": {
          "description": "Find out more Dashboards in our documentation.",
          "url": "https://coralogix.com/docs/user-guides/custom-dashboards/getting-started/"
        }
      },
      "DashboardFolder": {
        "type": "object",
        "properties": {
          "id": {
            "description": "Unique identifier. A UUID.",
            "maxLength": 36,
            "minLength": 36,
            "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
            "type": "string",
            "x-coralogix-presence": true
          },
          "name": {
            "description": "Display name.",
            "maxLength": 100,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "x-coralogix-presence": true
          },
          "parentId": {
            "description": "The parent id. A UUID that must differ from this folder's own id.",
            "maxLength": 36,
            "minLength": 36,
            "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
            "type": "string",
            "x-coralogix-presence": true
          }
        },
        "description": "Dashboard folder."
      },
      "DeleteDashboardFolderResponse": {
        "title": "Delete dashboard folder response data structure",
        "type": "object",
        "additionalProperties": false,
        "description": "Response returned after successfully deleting a dashboard folder.",
        "externalDocs": {
          "description": "Find out more Dashboards in our documentation.",
          "url": "https://coralogix.com/docs/user-guides/custom-dashboards/getting-started/"
        }
      },
      "Error": {
        "type": "object",
        "properties": {
          "code": {
            "maximum": 599,
            "minimum": 100,
            "type": "integer",
            "description": "HTTP status code of the error (for example 400, 404, 500).",
            "format": "int32"
          },
          "message": {
            "maxLength": 4096,
            "minLength": 0,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "Human-readable description of the error."
          }
        },
        "description": "Standard error response body returned for a failed request."
      },
      "FilterPathAndValues": {
        "title": "FilterPathAndValues",
        "required": [
          "path"
        ],
        "type": "object",
        "oneOf": [
          {
            "required": [
              "multipleValues"
            ],
            "type": "object"
          },
          {
            "required": [
              "filters"
            ],
            "type": "object"
          }
        ],
        "properties": {
          "filters": {
            "allOf": [
              {
                "$ref": "#/components/schemas/Filters"
              }
            ],
            "description": "The filters."
          },
          "multipleValues": {
            "$ref": "#/components/schemas/MultipleValues"
          },
          "path": {
            "examples": [
              "test"
            ],
            "minLength": 0,
            "type": "string",
            "x-coralogix-presence": true
          }
        },
        "description": "This data structure represents a filter path and values"
      },
      "Filters": {
        "title": "Filters",
        "required": [
          "pathAndValues"
        ],
        "type": "object",
        "properties": {
          "operator": {
            "allOf": [
              {
                "$ref": "#/components/schemas/v3.FilterOperator"
              }
            ],
            "examples": [
              "FILTER_OPERATOR_OR"
            ]
          },
          "pathAndValues": {
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/FilterPathAndValues"
            }
          }
        },
        "description": "This data structure represents a filter"
      },
      "GetDashboardFolderResponse": {
        "title": "Get dashboard folder response data structure",
        "type": "object",
        "properties": {
          "folder": {
            "allOf": [
              {
                "$ref": "#/components/schemas/DashboardFolder"
              }
            ],
            "description": "The folder."
          }
        },
        "description": "Response containing the details of a dashboard folder.",
        "externalDocs": {
          "description": "Find out more Dashboards in our documentation.",
          "url": "https://coralogix.com/docs/user-guides/custom-dashboards/getting-started/"
        }
      },
      "ListDashboardFoldersResponse": {
        "title": "List dashboard folders response data structure",
        "type": "object",
        "properties": {
          "folder": {
            "maxItems": 10000,
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/DashboardFolder"
            },
            "description": "The folder."
          }
        },
        "description": "Response containing a list of dashboard folders.",
        "externalDocs": {
          "description": "Find out more Dashboards in our documentation.",
          "url": "https://coralogix.com/docs/user-guides/custom-dashboards/getting-started/"
        }
      },
      "MultipleValues": {
        "type": "object",
        "properties": {
          "matcher": {
            "$ref": "#/components/schemas/events.v3.FilterMatcher"
          },
          "values": {
            "minItems": 0,
            "type": "array",
            "items": {
              "minLength": 0,
              "type": "string"
            }
          }
        }
      },
      "ReplaceDashboardFolderResponse": {
        "title": "Replace dashboard folder response data structure",
        "type": "object",
        "additionalProperties": false,
        "description": "Response returned after successfully replacing a dashboard folder.",
        "externalDocs": {
          "description": "Find out more Dashboards in our documentation.",
          "url": "https://coralogix.com/docs/user-guides/custom-dashboards/getting-started/"
        }
      },
      "events.v3.FilterMatcher": {
        "enum": [
          "FILTER_MATCHER_TEXT_OR_UNSPECIFIED",
          "FILTER_MATCHER_REGEXP"
        ],
        "type": "string"
      },
      "v3.FilterOperator": {
        "enum": [
          "FILTER_OPERATOR_AND_OR_UNSPECIFIED",
          "FILTER_OPERATOR_OR"
        ],
        "type": "string",
        "description": "Filter operator."
      }
    }
  }
}