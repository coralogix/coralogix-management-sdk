          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "MultipleValues": {
        "type": "object",
        "properties": {
          "matcher": {
            "$ref": "#/components/schemas/events.v3.FilterMatcher"
          },
          "values": {
            "minItems": 0,
            "type": "array",
            "items": {
              "minLength": 0,
              "type": "string"
            }
          }
        }
      },
      "Owner": {
        "type": "object",
        "oneOf": [
          {
            "required": [
              "userId"
            ],
            "type": "object"
          },
          {
            "required": [
              "teamId"
            ],
            "type": "object"
          },
          {
            "required": [
              "organisationId"
            ],
            "type": "object"
          },
          {
            "type": "object",
            "not": {
              "anyOf": [
                {
                  "required": [
                    "userId"
                  ],
                  "type": "object"
                },
                {
                  "required": [
                    "teamId"
                  ],
                  "type": "object"
                },
                {
                  "required": [
                    "organisationId"
                  ],
                  "type": "object"
                }
              ]
            }
          }
        ],
        "properties": {
          "organisationId": {
            "minLength": 0,
