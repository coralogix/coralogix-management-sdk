  "components": {
    "schemas": {
      "ApiKeyOwner": {
        "title": "API Key Owner",
        "type": "object",
        "properties": {
          "user": {
            "$ref": "#/components/schemas/ApiKeyUserOwner"
          }
        },
        "description": "This data structure represents the owner of an API key.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "ApiKeySummary": {
        "title": "API Key Summary",
        "type": "object",
        "properties": {
          "apiKey": {
            "$ref": "#/components/schemas/v3.ApiKey"
          },
          "permissions": {
            "minItems": 0,
            "type": "array",
            "items": {
              "minLength": 0,
              "type": "string",
              "description": "List of permissions.",
              "examples": [
                "logs:read"
              ]
            },
            "description": "List of permissions."
          },
          "presets": {
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/PermissionsPreset"
            },
            "description": "List of permission presets."
          }
        },
        "description": "This data structure represents summary about an API key including its permissions.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "ApiKeyUserOwner": {
        "title": "API Key User Owner",
        "type": "object",
        "properties": {
          "userEmail": {
            "minLength": 0,
            "type": "string",
            "description": "The user email.",
            "examples": [
              "test@example.com"
            ]
          },
          "userId": {
            "minLength": 0,
            "type": "string",
            "description": "The user id.",
            "examples": [
              "user_123"
            ]
          }
        },
        "description": "This data structure represents the user owner of an API key.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "CreateApiKeyRequest.KeyPermissions": {
        "title": "Key Permissions",
        "type": "object",
        "properties": {
          "permissions": {
            "minItems": 0,
            "type": "array",
            "items": {
              "minLength": 0,
              "type": "string",
              "description": "List of permissions.",
              "examples": [
                "read_logs"
              ]
            },
            "description": "List of permissions."
          },
          "presets": {
            "minItems": 0,
            "type": "array",
            "items": {
              "minLength": 0,
              "type": "string",
              "description": "List of permission presets.",
              "examples": [
                "my_preset"
              ]
            },
            "description": "List of permission presets."
          }
        },
        "description": "This data structure allows to specify loose permissions and permission presets for an API key.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "CreateApiKeyResponse": {
        "title": "Create Api Key Response",
        "type": "object",
        "properties": {
          "keyId": {
            "minLength": 0,
            "type": "string",
            "description": "Key identifier.",
            "examples": [
              "my_key_id"
            ]
          },
          "name": {
            "minLength": 0,
            "type": "string",
            "description": "Display name.",
            "examples": [
              "my_api_key"
            ]
          },
          "value": {
            "minLength": 0,
            "type": "string",
            "description": "The value.",
            "examples": [
              "my_api_key_value"
            ]
          }
        },
        "description": "This data structure is the response obtained when creating an API key.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "DeleteApiKeyResponse": {
        "type": "object",
        "additionalProperties": false,
        "description": "Response returned after successfully deleting an API key."
      },
      "Error": {
        "type": "object",
        "properties": {
          "code": {
            "maximum": 599,
            "minimum": 100,
            "type": "integer",
            "description": "HTTP status code of the error (for example 400, 404, 500).",
            "format": "int32"
          },
          "message": {
            "maxLength": 4096,
            "minLength": 0,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "Human-readable description of the error."
          }
        },
        "description": "Standard error response body returned for a failed request."
      },
      "FilterPathAndValues": {
        "title": "FilterPathAndValues",
        "required": [
          "path"
        ],
        "type": "object",
        "oneOf": [
          {
            "required": [
              "multipleValues"
            ],
            "type": "object"
          },
          {
            "required": [
              "filters"
            ],
            "type": "object"
          }
        ],
        "properties": {
          "filters": {
            "allOf": [
              {
                "$ref": "#/components/schemas/Filters"
              }
            ],
            "description": "The filters."
          },
          "multipleValues": {
            "$ref": "#/components/schemas/MultipleValues"
          },
          "path": {
            "examples": [
              "test"
            ],
            "minLength": 0,
            "type": "string",
            "x-coralogix-presence": true
          }
        },
        "description": "This data structure represents a filter path and values"
      },
      "Filters": {
        "title": "Filters",
        "required": [
          "pathAndValues"
        ],
        "type": "object",
        "properties": {
          "operator": {
            "allOf": [
              {
                "$ref": "#/components/schemas/v3.FilterOperator"
              }
            ],
            "examples": [
              "FILTER_OPERATOR_OR"
            ]
          },
          "pathAndValues": {
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/FilterPathAndValues"
            }
          }
        },
        "description": "This data structure represents a filter"
      },
      "GetApiKeyResponse": {
        "title": "Get Api Key Response",
        "type": "object",
        "properties": {
          "keyInfo": {
            "$ref": "#/components/schemas/KeyInfo"
          }
        },
        "description": "This data structure is the response obtained when retrieving an API key.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "GetApiKeysResponse": {
        "title": "Get Api Keys Response",
        "type": "object",
        "properties": {
          "keys": {
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/KeyInfo"
            },
            "description": "The keys."
          }
        },
        "description": "This data structure is the response obtained when retrieving all API keys.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
