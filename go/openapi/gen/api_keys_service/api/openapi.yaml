      "GetSendDataApiKeysResponse": {
        "title": "Get Api Key Response",
        "type": "object",
        "properties": {
          "keys": {
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/KeyInfo"
            },
            "description": "The keys."
          }
        },
        "description": "This data structure is the response obtained when retrieving an API key.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "GetTeamMembersApiKeysResponse": {
        "title": "Get Team Members API Keys Response",
        "type": "object",
        "properties": {
          "keys": {
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ApiKeySummary"
            },
            "description": "The keys."
          }
        },
        "description": "This data structure is the response obtained when retrieving team members API keys.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "KeyInfo": {
        "title": "Key Info",
        "type": "object",
        "properties": {
          "accessPolicy": {
            "description": "JSON string representing the access policy for this API key. Defines granular permissions for users and groups.",
            "examples": [
              "{\"version\":\"2025-01-01\",\"default\":{\"permissions\":{\"data-ingest-api-keys:ReadAccessPolicy\":\"grant\",\"data-ingest-api-keys:Manage\":\"deny\",\"data-ingest-api-keys:UpdateAccessPolicy\":\"deny\",\"data-ingest-api-keys:ReadConfig\":\"grant\"}},\"rules\":[]}"
            ],
            "minLength": 0,
            "type": "string",
            "x-coralogix-presence": true
          },
          "active": {
            "type": "boolean",
            "description": "Whether this resource is active.",
            "examples": [
              true
            ]
          },
          "hashed": {
            "type": "boolean",
            "description": "Whether the value is stored as a one-way hash.",
            "examples": [
              true
            ]
          },
          "id": {
            "minLength": 0,
            "type": "string",
            "description": "Unique identifier."
          },
          "keyPermissions": {
            "$ref": "#/components/schemas/KeyInfo.KeyPermissions"
          },
          "name": {
            "minLength": 0,
            "type": "string",
            "description": "Display name.",
            "examples": [
              "my_api_key"
            ]
          },
          "owner": {
            "allOf": [
              {
                "$ref": "#/components/schemas/Owner"
              }
            ],
            "examples": [
              "a_user_id"
            ]
          },
          "value": {
            "description": "The value.",
            "minLength": 0,
            "type": "string",
            "x-coralogix-presence": true
          }
        },
        "description": "This data structure represents the information associated with an API key.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "KeyInfo.KeyPermissions": {
        "title": "Key Permissions",
        "type": "object",
        "properties": {
          "permissions": {
            "minItems": 0,
            "type": "array",
            "items": {
              "minLength": 0,
              "type": "string",
              "description": "Permissions."
            },
            "description": "Permissions."
          },
          "presets": {
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/PresetInfo"
