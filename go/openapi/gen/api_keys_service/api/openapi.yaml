      "put": {
        "description": "Updates the specified API key.",
        "operationId": "ApiKeysService_UpdateApiKey",
        "parameters": [
          {
            "$ref": "#/components/parameters/key_id"
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "This data structure is used to update an API key.",
                "properties": {
                  "accessPolicy": {
                    "description": "JSON string representing the access policy for this API key. Defines granular permissions for users and groups. To delete an existing policy, pass an empty string.",
                    "examples": [
                      "{\"version\":\"2025-01-01\",\"default\":{\"permissions\":{\"data-ingest-api-keys:ReadAccessPolicy\":\"grant\",\"data-ingest-api-keys:Manage\":\"deny\",\"data-ingest-api-keys:UpdateAccessPolicy\":\"deny\",\"data-ingest-api-keys:ReadConfig\":\"grant\"}},\"rules\":[]}"
                    ],
                    "minLength": 0,
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "isActive": {
                    "description": "Whether the API key is active. Set to false to deactivate without deleting.",
                    "examples": [
                      true
                    ],
                    "type": "boolean",
                    "x-coralogix-presence": true
                  },
                  "newName": {
                    "description": "New display name for the API key.",
                    "examples": [
                      "my_new_name"
                    ],
                    "minLength": 0,
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "permissions": {
                    "$ref": "#/components/schemas/UpdateApiKeyRequest.Permissions"
                  },
                  "presets": {
                    "$ref": "#/components/schemas/Presets"
                  }
                },
                "title": "Update Api Key Request",
                "type": "object"
              }
            }
          }
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UpdateApiKeyResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
