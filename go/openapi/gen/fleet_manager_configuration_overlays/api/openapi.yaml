      "patch": {
        "description": "Updates the fields listed in update_mask; other fields are unchanged. A listed field that is omitted from the body is cleared or reset to its default. Changing custom.configuration, custom.targets, or parentVersionId creates a new version. Returns 400 for an archived overlay.",
        "operationId": "ConfigurationOverlayService_UpdateConfigurationOverlay",
        "parameters": [
          {
            "description": "Comma-separated fields to update: name, description, tags, priorityOrder, parentVersionId, custom, custom.configuration, custom.targets. A listed field that is omitted from the body is cleared (name, description, tags, custom.targets) or reset to its default (priorityOrder 0); custom.configuration cannot be cleared. Unknown fields and * return 400.",
            "in": "query",
            "name": "update_mask",
            "required": true,
            "schema": {
              "description": "Comma-separated fields to update: name, description, tags, priorityOrder, parentVersionId, custom, custom.configuration, custom.targets. A listed field that is omitted from the body is cleared (name, description, tags, custom.targets) or reset to its default (priorityOrder 0); custom.configuration cannot be cleared. Unknown fields and * return 400.",
              "maxLength": 512,
              "minLength": 1,
              "pattern": "^[A-Za-z_][A-Za-z0-9_.]*(,[A-Za-z_][A-Za-z0-9_.]*)*$",
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "Configuration overlay field values for an update. Only fields listed in update_mask are applied.",
                "properties": {
                  "custom": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/CustomConfigurationOverlayUpdate"
                      }
                    ],
                    "description": "Custom overlay fields to update. Rejected for preset overlays."
                  },
                  "description": {
                    "description": "Human-readable description.",
                    "maxLength": 4096,
                    "minLength": 0,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "name": {
