        "summary": "Create configuration overlay",
        "description": "Creates a raw YAML configuration overlay. Its first version is inactive unless active is true. Names must be unique among unarchived overlays.",
        "operationId": "ConfigurationOverlayService_CreateConfigurationOverlay",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "Request to create a raw YAML configuration overlay.",
                "type": "object",
                "properties": {
                  "overlay": {
                    "description": "Configuration overlay to create.",
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/ConfigurationOverlayCreate"
                      }
                    ]
                  },
                  "targets": {
                    "description": "Remote configurations the overlay applies to, as a set: duplicates are rejected. A version needs at least one target to be activated.",
                    "type": "array",
                    "items": {
                      "$ref": "#/components/schemas/ConfigurationOverlayTargetCreate"
                    },
                    "minItems": 0,
                    "maxItems": 256,
                    "uniqueItems": true
                  }
                },
                "required": [
                  "overlay"
                ]
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CreateConfigurationOverlayResponse"
                },
                "example": {
                  "overlay": {
                    "active": false,
                    "archived": false,
                    "description": "Raises the Collector log level for selected remote configurations.",
                    "id": "01975ed4-9c1a-7b3f-8d4e-426614174000",
