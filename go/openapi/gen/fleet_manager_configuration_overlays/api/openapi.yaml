            "name": "include_archived",
            "required": false,
            "schema": {
              "description": "When true, include archived overlays, each with its latest version.",
              "type": "boolean",
              "x-coralogix-presence": true
            }
          },
          {
            "description": "Maximum number of overlays to return. Defaults to 100 and cannot exceed 256.",
            "in": "query",
            "name": "page_size",
            "required": false,
            "schema": {
              "description": "Maximum number of overlays to return. Defaults to 100 and cannot exceed 256.",
              "examples": [
                100
              ],
              "format": "int32",
              "maximum": 256,
              "minimum": 1,
              "type": "integer",
              "x-coralogix-presence": true
            }
          },
          {
            "description": "Opaque token returned by a previous list response. Send it with the same include_archived and view values as that request.",
            "in": "query",
            "name": "page_token",
            "required": false,
            "schema": {
              "description": "Opaque token returned by a previous list response. Send it with the same include_archived and view values as that request.",
              "examples": [
                "AZdtCKSZq3sAAAAAAAAAAQ"
              ],
              "maxLength": 64,
              "minLength": 1,
              "pattern": "^[A-Za-z0-9_-]+$",
              "type": "string",
              "x-coralogix-presence": true
            }
          },
          {
            "description": "Response view. BASIC returns overlay metadata and active status without version fields, payload, targets, or schedules. FULL returns the complete overlay. Omitted or unspecified keeps the full response.",
            "in": "query",
            "name": "view",
            "required": false,
            "schema": {
              "$ref": "#/components/schemas/ConfigurationOverlayView",
              "description": "Response view. BASIC returns overlay metadata and active status without version fields, payload, targets, or schedules. FULL returns the complete overlay. Omitted or unspecified keeps the full response."
