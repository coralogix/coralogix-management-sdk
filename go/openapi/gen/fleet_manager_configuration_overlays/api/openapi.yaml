        "parameters": [
          {
            "description": "When true, include archived overlays and archived versions.",
            "in": "query",
            "name": "include_archived",
            "required": false,
            "schema": {
              "description": "When true, include archived overlays and archived versions.",
              "type": "boolean",
              "x-coralogix-presence": true
            }
          },
          {
            "description": "Maximum number of overlays to return. Defaults to 100 and cannot exceed 256.",
            "in": "query",
            "name": "page_size",
            "required": false,
            "schema": {
              "description": "Maximum number of overlays to return. Defaults to 100 and cannot exceed 256.",
              "format": "int32",
              "maximum": 256,
              "minimum": 1,
              "type": "integer",
              "x-coralogix-presence": true
            }
          },
          {
            "description": "Opaque token returned by a previous list response.",
            "in": "query",
            "name": "page_token",
            "required": false,
            "schema": {
              "description": "Opaque token returned by a previous list response.",
              "maxLength": 64,
              "minLength": 1,
              "pattern": "^[A-Za-z0-9_-]+$",
              "type": "string",
              "x-coralogix-presence": true
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "example": {
