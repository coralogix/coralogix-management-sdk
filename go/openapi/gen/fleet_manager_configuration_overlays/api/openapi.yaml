      "post": {
        "description": "Creates a custom configuration overlay from a Collector YAML fragment and its target remote configurations. Each target must belong to an active configuration family. The overlay is inactive unless `active` is `true`; an active overlay needs at least one target. When `active` is `true` and `schedules` is empty, the overlay applies right away and stays applied until it is deactivated; with schedules, it applies only during their windows. A successful response confirms the overlay is saved; check Fleet Management for agent application status.",
        "operationId": "ConfigurationOverlayService_CreateConfigurationOverlay",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "Payload used to create a custom configuration overlay.",
                "properties": {
                  "active": {
                    "default": false,
                    "description": "Set true to apply the overlay to its targets when it is created. Needs at least one target. Defaults to false (inactive).",
                    "type": "boolean",
                    "x-coralogix-presence": true
                  },
                  "custom": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/CustomConfigurationOverlayCreate"
                      }
                    ],
                    "description": "Custom overlay: a Collector YAML fragment and the remote configurations it is merged into."
                  },
                  "description": {
                    "description": "Description of the overlay's purpose.",
                    "examples": [
                      "Raises the Collector log level for selected remote configurations."
                    ],
                    "maxLength": 4096,
                    "minLength": 0,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "name": {
                    "description": "Display name, unique among unarchived overlays.",
                    "examples": [
                      "Debug logging overlay"
                    ],
                    "maxLength": 256,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "priorityOrder": {
                    "default": 0,
                    "description": "Merge precedence when several active overlays target the same remote configuration. Overlays merge in ascending order, so higher values win on conflicting keys; on a tie, the newer overlay wins.",
                    "examples": [
                      100
                    ],
                    "format": "int32",
                    "maximum": 2147483647,
                    "minimum": -2147483648,
                    "type": "integer",
                    "x-coralogix-presence": true
                  },
                  "schedules": {
                    "description": "Activation schedules. Windows must not overlap; a window may start when another ends.",
                    "items": {
                      "$ref": "#/components/schemas/ConfigurationOverlayScheduleCreate"
                    },
                    "maxItems": 10,
                    "minItems": 0,
                    "type": "array",
                    "uniqueItems": true,
                    "x-coralogix-collection": "set"
                  },
                  "tags": {
                    "description": "Tags for organizing the overlay. Tags do not select targets.",
                    "examples": [
                      [
                        "production"
                      ]
                    ],
                    "items": {
                      "description": "Tags for organizing the overlay. Tags do not select targets.",
                      "maxLength": 256,
                      "minLength": 0,
                      "pattern": "^[\\s\\S]*$",
                      "type": "string"
                    },
                    "maxItems": 64,
                    "minItems": 0,
                    "type": "array"
                  }
                },
                "required": [
                  "name",
                  "custom"
                ],
                "type": "object"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "example": {
                  "active": false,
                  "archived": false,
                  "custom": {
                    "configuration": "service:\n  telemetry:\n    logs:\n      level: debug\n",
                    "targets": []
                  },
                  "description": "Raises the Collector log level for selected remote configurations.",
                  "id": "01975ed4-9c1a-7b3f-8d4e-426614174000",
