      "patch": {
        "description": "Updates the fields listed in `update_mask`; a listed field that is omitted from the body is cleared or reset to its default. A change to the content of `custom.configuration` or `custom.targets` creates a new version that carries over the schedules; other fields, including `schedules`, change without a new version. To activate the overlay, send `{\"active\":true}` with `update_mask=active`. An archived overlay can't be updated. Activation needs a target, and every schedule needs a future window. A version-creating change is rejected while a scheduled window is applying; edit the overlay after the window ends, or deactivate it first.",
        "operationId": "ConfigurationOverlayService_UpdateConfigurationOverlay",
        "parameters": [
          {
            "description": "Comma-separated fields to update: name, description, tags, priorityOrder, active, custom, custom.configuration, custom.targets, schedules. custom replaces the configuration and the targets together; custom.configuration or custom.targets changes only that field. A listed field that is omitted from the body is cleared (description, tags, custom.targets, schedules) or reset to its default (priorityOrder 0, active false); name, custom, and custom.configuration cannot be cleared. Custom fields are rejected for preset overlays. Unknown fields and * return 400.",
            "in": "query",
            "name": "update_mask",
            "required": true,
            "schema": {
              "description": "Comma-separated fields to update: name, description, tags, priorityOrder, active, custom, custom.configuration, custom.targets, schedules. custom replaces the configuration and the targets together; custom.configuration or custom.targets changes only that field. A listed field that is omitted from the body is cleared (description, tags, custom.targets, schedules) or reset to its default (priorityOrder 0, active false); name, custom, and custom.configuration cannot be cleared. Custom fields are rejected for preset overlays. Unknown fields and * return 400.",
              "examples": [
                "active"
              ],
              "maxLength": 512,
              "minLength": 1,
              "pattern": "^[A-Za-z_][A-Za-z0-9_.]*(,[A-Za-z_][A-Za-z0-9_.]*)*$",
              "type": "string",
              "x-coralogix-presence": true
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "Configuration overlay field values for an update. Only fields listed in update_mask are applied.",
                "properties": {
                  "active": {
                    "default": false,
                    "description": "Set true to activate or false to deactivate the overlay. Include active in update_mask to apply this value; omitting its value when listed resets it to false. With schedules, activation enables them, and deactivation pauses them and ends a running window.",
                    "type": "boolean",
                    "x-coralogix-presence": true
                  },
                  "custom": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/CustomConfigurationOverlayUpdate"
                      }
                    ],
                    "description": "Custom overlay fields to update. Rejected for preset overlays."
                  },
                  "description": {
                    "description": "Description of the overlay's purpose.",
                    "examples": [
                      "Raises the Collector log level for selected remote configurations."
                    ],
                    "maxLength": 4096,
                    "minLength": 0,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "name": {
                    "description": "Display name, unique among unarchived overlays.",
                    "examples": [
                      "Debug logging overlay"
                    ],
                    "maxLength": 256,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "priorityOrder": {
                    "default": 0,
                    "description": "Merge precedence when several active overlays target the same remote configuration. Overlays merge in ascending order, so higher values win on conflicting keys; on a tie, the newer overlay wins.",
                    "examples": [
                      100
                    ],
                    "format": "int32",
                    "maximum": 2147483647,
                    "minimum": -2147483648,
                    "type": "integer",
                    "x-coralogix-presence": true
                  },
                  "schedules": {
                    "description": "Replaces the schedules of the latest version without creating a version. When the same request changes custom content, the list moves to the new version with new ids. Windows must not overlap; a window may start when another ends. Schedules are matched by startAt, duration, recurrence, and timeZone: a match keeps its id, and other schedules are removed. An empty list on an active overlay applies it continuously, right away.",
                    "items": {
                      "$ref": "#/components/schemas/ConfigurationOverlayScheduleReplace"
                    },
                    "maxItems": 10,
                    "minItems": 0,
                    "type": "array",
                    "uniqueItems": true,
                    "x-coralogix-collection": "set"
                  },
                  "tags": {
                    "description": "Tags for organizing the overlay. Tags do not select targets. Replaces all tags.",
                    "examples": [
                      [
                        "production"
                      ]
                    ],
                    "items": {
                      "description": "Tags for organizing the overlay. Tags do not select targets. Replaces all tags.",
                      "maxLength": 256,
                      "minLength": 0,
                      "pattern": "^[\\s\\S]*$",
                      "type": "string"
                    },
                    "maxItems": 64,
                    "minItems": 0,
                    "type": "array"
                  }
                },
                "type": "object"
              }
            }
          }
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "example": {
                  "active": true,
                  "archived": false,
                  "custom": {
                    "configuration": "service:\n  telemetry:\n    logs:\n      level: debug\n",
                    "targets": [
                      {
                        "createdAt": "2026-09-28T10:05:00.000Z",
