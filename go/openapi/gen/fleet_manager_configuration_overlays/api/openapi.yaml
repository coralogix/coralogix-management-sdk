      "patch": {
        "tags": [
          "Fleet Manager Configuration Overlays"
        ],
        "summary": "Update configuration overlay",
        "description": "Updates the supplied fields; omitted fields are unchanged. Payload, parentVersionId, or target changes create a new version. Set active to activate or deactivate the latest version. Returns 400 for an archived overlay.",
        "operationId": "ConfigurationOverlayService_UpdateConfigurationOverlay",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "Request to update a configuration overlay.",
                "type": "object",
                "properties": {
                  "overlay": {
                    "externalDocs": {
                      "url": ""
                    },
                    "description": "Fields used to update a configuration overlay. Omitted fields are unchanged.",
                    "type": "object",
                    "properties": {
                      "active": {
                        "description": "When true, activates the latest version after the update; when false, deactivates it. Omit to keep the current state. Activating without targets returns 400.",
                        "type": "boolean"
                      },
                      "description": {
                        "description": "Human-readable description. Omit to keep it; send an empty string to clear it.",
                        "type": "string",
                        "pattern": "^[\\s\\S]*$",
                        "minLength": 0,
                        "maxLength": 4096
                      },
                      "name": {
                        "description": "Display name, unique among unarchived overlays. Omit to keep it; send an empty string to clear it.",
                        "type": "string",
                        "pattern": "^[\\s\\S]*$",
                        "minLength": 0,
                        "maxLength": 256
                      },
                      "parentVersionId": {
                        "description": "Records the parent of the new version. Creates a new version but does not copy content from the parent.",
                        "type": "string",
                        "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$",
                        "minLength": 36,
                        "maxLength": 36
                      },
                      "priorityOrder": {
                        "description": "Merge precedence on a shared remote configuration: higher values win, and the newer overlay wins a tie. Defaults to 0.",
                        "type": "integer",
                        "format": "int32",
                        "minimum": -2147483648,
                        "maximum": 2147483647
                      },
                      "raw": {
                        "externalDocs": {
                          "url": ""
                        },
                        "description": "Raw OpenTelemetry Collector YAML overlay payload.",
                        "type": "object",
                        "properties": {
                          "configuration": {
                            "description": "OpenTelemetry Collector YAML fragment merged into each targeted remote configuration. Stored and returned in normalized form (sorted keys, no comments). Must not configure the OpAMP extension.",
                            "type": "string",
                            "pattern": "^[\\s\\S]*$",
                            "minLength": 1,
                            "maxLength": 1048576
                          }
                        },
                        "required": [
                          "configuration"
                        ]
                      },
                      "tags": {
                        "externalDocs": {
                          "url": ""
                        },
                        "description": "Replacement tags for a configuration overlay.",
                        "type": "object",
                        "properties": {
                          "values": {
                            "description": "Tags attached to the configuration overlay. An empty list clears tags.",
                            "type": "array",
                            "items": {
                              "description": "Tags attached to the configuration overlay. An empty list clears tags.",
                              "type": "string",
                              "pattern": "^[\\s\\S]*$",
                              "minLength": 0,
                              "maxLength": 256
                            },
                            "minItems": 0,
                            "maxItems": 64
                          }
                        },
                        "required": [
                          "values"
                        ]
                      }
                    }
                  },
                  "targetReplacement": {
                    "description": "Replaces the targets. Reordering alone changes nothing; an empty list removes all targets, or returns 400 on an active overlay.",
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/ConfigurationOverlayTargetsReplace"
                      }
                    ]
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UpdateConfigurationOverlayResponse"
                },
                "example": {
                  "overlay": {
                    "active": true,
                    "archived": false,
                    "description": "Updated overlay description.",
                    "id": "01975ed4-9c1a-7b3f-8d4e-426614174000",
                    "name": "Debug logging overlay",
                    "priorityOrder": 100,
                    "tags": [
                      "production"
                    ],
                    "versions": [
                      {
                        "active": true,
                        "archived": false,
                        "createdAt": "2026-09-28T10:05:00Z",
                        "id": "01975ed5-2a10-7c44-9b1e-5d2c8a7f3002",
                        "overlayHash": "b5f7c570911aabc9ec165e379267fdaedf4426d9ca22d27773ce01b8be91fb4b",
                        "parentVersionId": "01975ed4-9c1a-7b3f-8d4e-426614174001",
                        "raw": {
                          "configuration": "service:\n  telemetry:\n    logs:\n      level: debug\n"
                        },
                        "targets": [
                          {
                            "createdAt": "2026-09-28T10:05:00Z",
                            "id": "01975ed5-2a10-7c44-9b1e-5d2c8a7f3003",
                            "overlayConfigurationFamilyId": "01975ed5-2a11-7a01-8b02-0c0d0e0f1011",
                            "overlayRemoteConfigurationId": "01975ed5-2a11-7a01-8b02-0c0d0e0f1012",
