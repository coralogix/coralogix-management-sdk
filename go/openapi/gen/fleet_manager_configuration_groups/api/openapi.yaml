  "paths": {
    "/fleet-management/configuration-groups/v1": {
      "post": {
        "description": "Creates a fleet-manager configuration group.",
        "operationId": "ConfigurationGroupService_CreateConfigurationGroup",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "Payload used to create a fleet-manager configuration group.",
                "properties": {
                  "description": {
                    "description": "Human-readable description.",
                    "maxLength": 4096,
                    "minLength": 0,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "family": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/ConfigurationFamilyCreate"
                      }
                    ],
                    "description": "Initial configuration family to create with this group."
                  },
                  "name": {
                    "description": "Display name.",
                    "maxLength": 256,
                    "minLength": 0,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "priorityOrder": {
                    "default": 0,
                    "description": "Selection precedence. Higher values win on ties and 0 is the default.",
                    "format": "int32",
                    "maximum": 2147483647,
                    "minimum": -2147483648,
                    "type": "integer",
                    "x-coralogix-presence": true
                  },
                  "tags": {
                    "description": "Tags attached to the configuration group.",
                    "items": {
                      "description": "Tags attached to the configuration group.",
                      "maxLength": 256,
                      "minLength": 0,
                      "pattern": "^[\\s\\S]*$",
                      "type": "string"
                    },
                    "maxItems": 64,
                    "minItems": 0,
                    "type": "array"
                  }
                },
                "required": [
                  "family"
                ],
                "type": "object"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "example": {
                  "description": "Collector configuration group for production.",
                  "id": "01975ed4-9c1a-7b3f-8d4e-426614174000",
                  "name": "Production collectors",
                  "priorityOrder": 100,
                  "tags": [
                    "production"
                  ]
                },
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/ConfigurationGroup"
                    }
                  ],
                  "description": "Created configuration group."
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "409": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Configuration group already exists"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Create configuration group",
        "tags": [
          "Fleet Manager Configuration Groups"
        ],
        "x-stability": "preview"
      }
    },
