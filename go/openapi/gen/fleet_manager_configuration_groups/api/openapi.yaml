        "type": "object",
        "oneOf": [
          {
            "required": [
              "raw"
            ],
            "type": "object"
          },
          {
            "required": [
              "preset"
            ],
            "type": "object"
          }
        ],
        "properties": {
          "active": {
            "description": "Whether this family is active.",
            "type": "boolean",
            "x-coralogix-presence": true
          },
          "description": {
            "description": "Human-readable description.",
            "maxLength": 4096,
            "minLength": 0,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "x-coralogix-presence": true
          },
          "preset": {
            "allOf": [
              {
                "$ref": "#/components/schemas/PresetConfigurationFamilyCreate"
              }
            ],
            "description": "Configuration template settings; Coralogix generates the remote configurations from them."
          },
          "raw": {
            "allOf": [
              {
                "$ref": "#/components/schemas/RawConfigurationFamilyCreate"
              }
            ],
            "description": "Configuration family defined directly by its remote configurations, each with an OTel Collector configuration and an agent selector."
          }
        },
        "description": "Initial configuration family to create."
      },
      "ConfigurationFamilySource": {
        "required": [
          "configurationOverlay"
        ],
        "type": "object",
        "properties": {
          "configurationOverlay": {
            "allOf": [
              {
                "$ref": "#/components/schemas/ConfigurationOverlaySource"
              }
            ],
            "description": "Configuration overlay that produced this family version."
          }
        },
        "description": "An immutable input that produced a configuration family version."
      },
      "ConfigurationFamilyUpdate": {
        "type": "object",
        "oneOf": [
          {
            "required": [
              "raw"
            ],
            "type": "object"
          },
          {
            "required": [
              "preset"
            ],
            "type": "object"
          },
          {
            "type": "object",
            "not": {
              "anyOf": [
                {
                  "required": [
                    "raw"
                  ],
                  "type": "object"
                },
                {
                  "required": [
                    "preset"
                  ],
                  "type": "object"
                }
              ]
            }
          }
        ],
        "properties": {
          "active": {
            "description": "Whether this family is active.",
            "type": "boolean",
            "x-coralogix-presence": true
          },
          "description": {
            "description": "Human-readable description.",
            "maxLength": 4096,
            "minLength": 0,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "x-coralogix-presence": true
          },
          "preset": {
            "allOf": [
