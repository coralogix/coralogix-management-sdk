      "patch": {
        "description": "Updates the fields listed in update_mask; other fields are unchanged. Changing family.raw or family.preset creates a new configuration family version only when the content changes.",
        "operationId": "ConfigurationGroupService_UpdateConfigurationGroup",
        "parameters": [
          {
            "description": "Comma-separated fields to update: name, description, tags, priorityOrder, family.description, family.active, family.raw, family.preset. A listed field that is omitted from the body is cleared (name, description, tags, family.description) or reset to its default (priorityOrder 0, family.active false); family.raw and family.preset replace the family content as a whole and cannot be cleared. Paths inside family.raw or family.preset, a bare family, unknown paths, and * return 400.",
            "in": "query",
            "name": "update_mask",
            "required": true,
            "schema": {
              "description": "Comma-separated fields to update: name, description, tags, priorityOrder, family.description, family.active, family.raw, family.preset. A listed field that is omitted from the body is cleared (name, description, tags, family.description) or reset to its default (priorityOrder 0, family.active false); family.raw and family.preset replace the family content as a whole and cannot be cleared. Paths inside family.raw or family.preset, a bare family, unknown paths, and * return 400.",
              "maxLength": 512,
              "minLength": 1,
              "pattern": "^[A-Za-z_][A-Za-z0-9_.]*(,[A-Za-z_][A-Za-z0-9_.]*)*$",
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "Configuration group field values for an update. Only fields listed in update_mask are applied.",
                "properties": {
                  "description": {
                    "description": "Human-readable description.",
                    "maxLength": 4096,
                    "minLength": 0,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "family": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/ConfigurationFamilyUpdate"
                      }
                    ],
                    "description": "Latest configuration family field values."
                  },
                  "name": {
                    "description": "Display name.",
                    "maxLength": 256,
                    "minLength": 0,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "priorityOrder": {
                    "default": 0,
                    "description": "Selection precedence. Higher values win on ties and 0 is the default.",
                    "format": "int32",
                    "maximum": 2147483647,
                    "minimum": -2147483648,
                    "type": "integer",
                    "x-coralogix-presence": true
                  },
                  "tags": {
                    "description": "Tags attached to the configuration group.",
                    "items": {
                      "description": "Tags attached to the configuration group.",
                      "maxLength": 256,
                      "minLength": 0,
                      "pattern": "^[\\s\\S]*$",
                      "type": "string"
                    },
                    "maxItems": 64,
                    "minItems": 0,
                    "type": "array"
                  }
                },
                "type": "object"
              }
            }
          }
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "example": {
                  "description": "Updated collector configuration group.",
                  "id": "01975ed4-9c1a-7b3f-8d4e-426614174000",
                  "name": "Production collectors",
                  "priorityOrder": 100,
                  "tags": [
                    "production"
                  ]
                },
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/ConfigurationGroup"
                    }
                  ],
                  "description": "Updated configuration group."
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "404": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Configuration group not found"
          },
          "409": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Configuration group name already exists"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Update configuration group",
        "tags": [
          "Fleet Manager Configuration Groups"
        ],
        "x-stability": "preview"
      },
      "parameters": [
        {
          "$ref": "#/components/parameters/id"
        }
      ]
    },
