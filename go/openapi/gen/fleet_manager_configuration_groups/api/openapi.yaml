            "minLength": 0,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "x-coralogix-presence": true
          },
          "family": {
            "allOf": [
              {
                "$ref": "#/components/schemas/ConfigurationFamily"
              }
            ],
            "description": "Latest configuration family of the group."
          },
          "id": {
            "maxLength": 36,
            "minLength": 36,
            "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$",
            "type": "string",
            "description": "Configuration group UUID v7."
          },
          "name": {
