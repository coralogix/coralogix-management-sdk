        },
        "description": "Fleet-manager configuration group."
      },
      "ConfigurationOverlaySource": {
        "required": [
          "overlayId",
          "overlayVersionId"
        ],
        "type": "object",
        "properties": {
          "overlayId": {
            "maxLength": 36,
            "minLength": 36,
            "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$",
            "type": "string",
            "description": "Configuration overlay UUID v7."
          },
          "overlayName": {
