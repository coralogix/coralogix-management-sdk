  "components": {
    "schemas": {
      "AgentSelectorRequest": {
        "type": "object",
        "properties": {
          "attributes": {
            "type": "object",
            "additionalProperties": {
              "maxLength": 4096,
              "minLength": 0,
              "pattern": "^[\\s\\S]*$",
              "type": "string"
            },
            "description": "Flat agent attributes to match. If collectorVersion is set, service.version must match it or is added automatically."
          }
        },
        "description": "Agent selector used in requests."
      },
      "AgentSelectorResponse": {
        "type": "object",
        "properties": {
          "attributes": {
            "type": "object",
            "additionalProperties": {
              "maxLength": 4096,
              "minLength": 0,
              "pattern": "^[\\s\\S]*$",
              "type": "string"
            },
            "description": "Flat agent attributes matched by the selector."
          }
        },
        "description": "Agent selector returned in responses."
      },
      "ArchiveConfigurationGroupResponse": {
        "type": "object",
        "additionalProperties": false,
        "description": "Empty response returned after archiving a fleet-manager configuration group."
      },
      "ChartName": {
        "title": "Fleet-manager chart name",
        "enum": [
          "CHART_NAME_UNSPECIFIED",
          "CHART_NAME_OTEL_INTEGRATION",
          "CHART_NAME_OPENTELEMETRY_COLLECTOR",
          "CHART_NAME_OTEL_LINUX_STANDALONE",
          "CHART_NAME_OTEL_WINDOWS_STANDALONE",
          "CHART_NAME_OTEL_MACOS_STANDALONE",
          "CHART_NAME_OTEL_ECS_EC2"
        ],
        "type": "string",
        "description": "Helm chart name for fleet-manager configuration families."
      },
      "ConfigurationFamily": {
        "required": [
          "id",
          "version"
        ],
        "type": "object",
        "oneOf": [
          {
            "required": [
              "raw"
            ],
            "type": "object"
          },
          {
            "required": [
              "preset"
            ],
            "type": "object"
          },
          {
            "type": "object",
            "not": {
              "anyOf": [
                {
                  "required": [
                    "raw"
                  ],
                  "type": "object"
                },
                {
                  "required": [
                    "preset"
                  ],
                  "type": "object"
                }
              ]
            }
          }
        ],
        "properties": {
          "active": {
            "description": "Whether this family is active.",
            "type": "boolean",
            "x-coralogix-presence": true
          },
          "basedOnConfigurationFamilyId": {
            "description": "Configuration family UUID v7 this family is based on.",
            "maxLength": 36,
            "minLength": 36,
            "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$",
            "type": "string",
            "x-coralogix-presence": true
          },
          "collectorVersion": {
            "description": "Collector semantic version this configuration family targets, without a leading v prefix.",
            "maxLength": 256,
            "minLength": 5,
            "pattern": "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\\+([0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*))?$",
            "type": "string",
            "x-coralogix-presence": true
          },
          "description": {
            "description": "Human-readable description.",
            "maxLength": 4096,
            "minLength": 0,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "x-coralogix-presence": true
          },
          "id": {
            "maxLength": 36,
            "minLength": 36,
            "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$",
            "type": "string",
            "description": "Configuration family UUID v7."
          },
          "lastActivatedAt": {
            "maxLength": 64,
            "minLength": 0,
            "type": "string",
            "description": "Time when this family was last activated.",
            "format": "date-time"
          },
          "preset": {
            "allOf": [
              {
                "$ref": "#/components/schemas/PresetConfigurationFamily"
              }
            ],
            "description": "Configuration template settings; present when the family has a chartName and observability features."
          },
          "raw": {
            "allOf": [
              {
                "$ref": "#/components/schemas/RawConfigurationFamily"
              }
            ],
            "description": "Inputs of a configuration family defined directly by its remote configurations; present when the family has no chartName."
          },
          "sources": {
            "maxItems": 128,
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ConfigurationFamilySource"
            },
            "description": "Immutable inputs that produced this configuration family version."
          },
          "version": {
            "maxLength": 256,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "Monotonic version number of this configuration family within its group."
          }
        },
        "description": "Configuration family returned by Fleet Manager."
      },
