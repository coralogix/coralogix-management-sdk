  "components": {
    "schemas": {
      "AllowParameters": {
        "required": [
          "rule",
          "keepBlockedLogs"
        ],
        "type": "object",
        "properties": {
          "keepBlockedLogs": {
            "description": "Whether the logs that the rule blocks are kept as low-priority logs instead of being dropped.",
            "type": "boolean",
            "x-coralogix-presence": true
          },
          "rule": {
            "description": "The regular expression. Logs that do not match it are blocked. Must not be empty.",
            "minLength": 1,
            "type": "string",
            "x-coralogix-presence": true
          }
        },
        "description": "Allow parameters. Blocks every log that does not match the regular expression."
      },
      "ApplicationNameConstraint": {
        "type": "object",
        "properties": {
          "value": {
            "description": "The value.",
            "minLength": 0,
            "type": "string",
            "x-coralogix-presence": true
          }
        },
        "description": "Application name constraint."
      },
      "BlockParameters": {
        "required": [
          "rule",
          "keepBlockedLogs"
        ],
        "type": "object",
        "properties": {
          "keepBlockedLogs": {
            "description": "Whether the logs that the rule blocks are kept as low-priority logs instead of being dropped.",
            "type": "boolean",
            "x-coralogix-presence": true
          },
          "rule": {
            "description": "The regular expression. Logs that match it are blocked. Must not be empty.",
            "minLength": 1,
            "type": "string",
            "x-coralogix-presence": true
          }
        },
        "description": "Block parameters. Blocks every log that matches the regular expression."
      },
      "BulkDeleteRuleGroupResponse": {
        "type": "object",
        "additionalProperties": false,
        "description": "Response returned after deleting all parsing rule groups."
      },
      "Counts": {
        "type": "object",
        "properties": {
          "groups": {
            "description": "List of groups.",
            "format": "int32",
            "type": "integer",
            "x-coralogix-presence": true
          },
          "parsingThemes": {
            "description": "The parsing themes.",
            "format": "int32",
            "type": "integer",
            "x-coralogix-presence": true
          },
          "rules": {
            "description": "List of rules.",
            "format": "int32",
            "type": "integer",
            "x-coralogix-presence": true
          }
        },
        "description": "Counts."
      },
      "CreateRuleGroupRequest.CreateRuleSubgroup": {
        "required": [
          "rules",
          "order"
        ],
        "type": "object",
        "properties": {
          "enabled": {
            "default": true,
            "description": "Whether the subgroup is enabled. Defaults to true.",
            "type": "boolean",
            "x-coralogix-presence": true
          },
          "order": {
            "description": "Position of the subgroup in the group, starting at 1.",
            "format": "int64",
            "minimum": 1,
            "type": "integer",
            "x-coralogix-presence": true
          },
          "rules": {
            "minItems": 1,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/CreateRuleGroupRequest.CreateRuleSubgroup.CreateRule"
            },
            "description": "The rules of the subgroup. At least one."
          }
        },
        "description": "A rule subgroup. The service sets its id, and sets a new one on every update of the group."
      },
      "CreateRuleGroupRequest.CreateRuleSubgroup.CreateRule": {
        "required": [
          "name",
          "sourceField",
          "parameters",
          "order"
        ],
        "type": "object",
        "properties": {
          "description": {
            "description": "Human-readable description. Defaults to an empty string.",
            "minLength": 0,
            "type": "string",
            "x-coralogix-presence": true
          },
          "enabled": {
            "default": true,
            "description": "Whether the rule is enabled. Defaults to true.",
            "type": "boolean",
            "x-coralogix-presence": true
          },
          "name": {
            "description": "Display name. Must not be empty.",
            "minLength": 1,
            "type": "string",
            "x-coralogix-presence": true
          },
          "order": {
            "description": "Position of the rule in its subgroup, starting at 1.",
            "format": "int64",
            "minimum": 1,
            "type": "integer",
            "x-coralogix-presence": true
          },
          "parameters": {
            "$ref": "#/components/schemas/RuleParameters"
          },
          "sourceField": {
            "description": "The field the rule reads: `text`, a `text.<field>` path, or one of `applicationName`, `subsystemName`, `computerName`, `category`, `className`, `methodName`, `threadId`, and `severity`. A rule that deletes its source field must read a `text.<field>` path.",
            "minLength": 1,
            "type": "string",
            "x-coralogix-presence": true
          }
        },
        "description": "A parsing rule. The service sets its id, and sets a new one on every update of the group."
      },
      "CreateRuleGroupResponse": {
        "type": "object",
        "properties": {
          "ruleGroup": {
            "$ref": "#/components/schemas/RuleGroup"
          }
        },
        "description": "Response returned after successfully creating a parsing rule group."
      },
      "DeleteRuleGroupResponse": {
        "type": "object",
        "additionalProperties": false,
        "description": "Response returned after successfully deleting a parsing rule group."
      },
      "DestinationField": {
        "enum": [
          "DESTINATION_FIELD_CATEGORY_OR_UNSPECIFIED",
          "DESTINATION_FIELD_CLASSNAME",
          "DESTINATION_FIELD_METHODNAME",
          "DESTINATION_FIELD_THREADID",
          "DESTINATION_FIELD_SEVERITY",
          "DESTINATION_FIELD_TEXT"
        ],
        "type": "string",
        "description": "Destination field. The zero value `DESTINATION_FIELD_CATEGORY_OR_UNSPECIFIED` means the category field."
      },
      "Error": {
        "type": "object",
        "properties": {
          "code": {
            "maximum": 599,
            "minimum": 100,
            "type": "integer",
            "description": "HTTP status code of the error (for example 400, 404, 500).",
            "format": "int32"
          },
          "message": {
            "maxLength": 4096,
            "minLength": 0,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "Human-readable description of the error."
          }
        },
        "description": "Standard error response body returned for a failed request."
      },
      "ExtractParameters": {
        "required": [
          "rule"
        ],
        "type": "object",
        "properties": {
          "rule": {
            "description": "The regular expression, with named capture groups, applied to the source field. Must not be empty.",
            "minLength": 1,
            "type": "string",
            "x-coralogix-presence": true
          }
        },
        "description": "Extract parameters. The named capture groups of the regular expression become fields of the log."
      },
      "ExtractTimestampParameters": {
        "required": [
          "format"
        ],
        "type": "object",
