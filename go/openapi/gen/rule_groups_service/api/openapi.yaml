    "/parsing-rules/mapping/v1": {
      "post": {
        "description": "Returns the model mapping for a parsing rule group.",
        "operationId": "RuleGroupsService_GetRuleGroupModelMapping",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "Request for retrieving the model mapping for a parsing rule group.",
                "properties": {
                  "creator": {
                    "description": "Creator.",
                    "minLength": 0,
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "description": {
                    "description": "Human-readable description.",
                    "minLength": 0,
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "enabled": {
                    "description": "Whether this resource is enabled.",
                    "type": "boolean",
                    "x-coralogix-presence": true
                  },
                  "hidden": {
                    "description": "Whether to hide this rule group from the standard view.",
                    "type": "boolean",
                    "x-coralogix-presence": true
                  },
                  "name": {
                    "description": "Display name.",
                    "minLength": 0,
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "order": {
                    "description": "Sort order.",
                    "format": "int64",
                    "minimum": 0,
                    "type": "integer",
                    "x-coralogix-presence": true
                  },
                  "ruleMatchers": {
                    "description": "List of rule matchers that determine which logs this group applies to.",
