              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Create Rule Group",
        "tags": [
          "Rule Groups Service"
        ]
      },
