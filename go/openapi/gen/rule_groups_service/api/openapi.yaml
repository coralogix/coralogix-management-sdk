      "post": {
        "description": "Creates a new parsing rule group.",
        "operationId": "RuleGroupsService_CreateRuleGroup",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "Request to create a new parsing rule group. Update takes the same body and replaces the whole group: a field that the request omits takes its default.",
                "properties": {
                  "creator": {
                    "description": "Free-form name of the creator. The service stores it as sent. Defaults to an empty string.",
                    "minLength": 0,
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "description": {
                    "description": "Human-readable description. Defaults to an empty string.",
                    "minLength": 0,
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "enabled": {
                    "default": true,
                    "description": "Whether the group is enabled. Defaults to true.",
                    "type": "boolean",
                    "x-coralogix-presence": true
                  },
                  "hidden": {
                    "default": false,
                    "description": "A free-form flag for clients, for example to hide the group in a UI. The service stores and returns it and does not act on it. Defaults to false.",
                    "type": "boolean",
                    "x-coralogix-presence": true
                  },
                  "name": {
                    "description": "Display name. Must not be empty.",
                    "minLength": 1,
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "order": {
                    "default": 1,
                    "description": "Position of the group among the rule groups of the company. Defaults to 1. 0 places the group last. Groups can share an order: the service does not shift the other groups.",
                    "format": "int64",
                    "minimum": 0,
                    "type": "integer",
                    "x-coralogix-presence": true
                  },
                  "ruleMatchers": {
                    "description": "The rule matchers.",
                    "items": {
                      "$ref": "#/components/schemas/RuleMatcher"
                    },
                    "minItems": 0,
                    "type": "array"
                  },
                  "ruleSubgroups": {
                    "description": "The rule subgroups. At least one.",
                    "items": {
                      "$ref": "#/components/schemas/CreateRuleGroupRequest.CreateRuleSubgroup"
                    },
                    "minItems": 1,
                    "type": "array"
                  },
                  "teamId": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/v1.TeamId"
                      }
                    ],
                    "description": "Ignored. The service takes the team from the credentials of the request."
                  }
                },
                "required": [
                  "name",
                  "ruleSubgroups"
                ],
                "type": "object"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CreateRuleGroupResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
