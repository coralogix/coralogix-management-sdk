{
  "openapi": "3.1.0",
  "info": {
    "title": "",
    "version": "1.0.0"
  },
  "paths": {
    "/alerts/alerts/v3": {
      "get": {
        "description": "Returns all alert definitions for the team.\n\nRequires the following permissions:\n- `alerts:ReadConfig`",
        "operationId": "AlertDefsService_ListAlertDefs",
        "parameters": [
          {
            "description": "Filter to apply to the list of alert definitions",
            "in": "query",
            "name": "query_filter",
            "required": false,
            "schema": {
              "description": "Filter configuration for alert defs",
              "properties": {
                "enabledFilter": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/AlertDefEnabledFilter"
                    }
                  ],
                  "description": "Filter by AlertDef enabled status"
                },
                "entityLabelsFilter": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/AlertDefEntityLabelsFilter"
                    }
                  ],
                  "description": "Filter by AlertDef entity labels"
                },
                "idFilter": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/AlertDefIdFilter"
                    }
                  ],
                  "description": "Filter by alert definition IDs to include or exclude"
                },
                "lastTriggeredTimeRangeFilter": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/AlertDefLastTriggeredTimeFilter"
                    }
                  ],
                  "description": "Filters all alerts that were triggered at the given time range"
                },
                "modifiedTimeRangeFilter": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/AlertDefModifiedTimeFilter"
                    }
                  ],
                  "description": "Filters all alerts that were modified at the given time range"
                },
                "nameFilter": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/AlertDefNameFilter"
                    }
                  ],
                  "description": "Filter by name"
                },
                "priorityFilter": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/AlertDefPriorityFilter"
                    }
                  ],
                  "description": "Filter by AlertDef priority"
                },
                "statusFilter": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/AlertDefStatusFilter"
                    }
                  ],
                  "description": "Filter by alert definition status"
                },
                "typeFilter": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/AlertDefTypeFilter"
                    }
                  ],
                  "description": "Filter by AlertDef type"
                },
                "typeSpecificFilter": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/AlertDefTypeSpecificFilter"
                    }
                  ],
                  "description": "Filter by fields specific to alert type definitions"
                }
              },
              "title": "AlertDef query filter",
              "type": "object"
            }
          },
          {
            "description": "Pagination settings for the list of alert definitions",
            "in": "query",
            "name": "pagination",
            "required": false,
            "schema": {
              "properties": {
                "pageSize": {
                  "description": "Page size.",
                  "format": "int64",
                  "maximum": 1000,
                  "minimum": 0,
                  "type": "integer"
                },
                "pageToken": {
                  "description": "The page token.",
                  "maxLength": 4096,
                  "minLength": 1,
                  "pattern": "^[\\s\\S]*$",
                  "type": "string"
                }
              },
              "type": "object"
            }
          },
          {
            "description": "Ordering settings for the list of alert definitions",
            "in": "query",
            "name": "order_bys",
            "required": false,
            "schema": {
              "description": "List of fields to order alert definitions by",
              "properties": {
                "orderBys": {
                  "description": "Order by fields for alert definitions",
                  "items": {
                    "description": "A data structure that specifies the field and direction for ordering alert definitions",
                    "properties": {
                      "direction": {
                        "allOf": [
                          {
                            "$ref": "#/components/schemas/AlertDefOrderByDirection"
                          }
                        ],
                        "description": "Direction for ordering",
                        "examples": [
                          "ALERT_DEF_ORDER_BY_DIRECTION_DESC"
                        ]
                      },
                      "fieldName": {
                        "allOf": [
                          {
                            "$ref": "#/components/schemas/AlertDefOrderByFields"
                          }
                        ],
                        "description": "Field name to order by",
                        "examples": [
                          "ALERT_DEF_ORDER_BY_FIELDS_UPDATED_TIME"
                        ]
                      }
                    },
                    "title": "Alert definition order by",
                    "type": "object"
                  },
                  "maxItems": 20,
                  "minItems": 1,
                  "type": "array"
                }
              },
              "title": "Alert definition order by list",
              "type": "object"
            }
          },
          {
            "description": "When true, populate the response's per-alert access map with the caller's access decision and each alert's raw access policy. Defaults to false.",
            "in": "query",
            "name": "include_access_permissions",
            "required": false,
            "schema": {
              "description": "When true, populate the response's per-alert access map with the caller's access decision and each alert's raw access policy. Defaults to false.",
              "type": "boolean",
              "x-coralogix-presence": true
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListAlertDefsResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Get a list of all accessible alert definitions",
        "tags": [
          "Alert definitions service"
        ],
        "x-coralogixPermissions": [
          "alerts:ReadConfig"
        ]
      },
      "put": {
        "description": "Updates an existing alert definition.\n\nRequires the following permissions:\n- `alerts:UpdateConfig`",
        "operationId": "AlertDefsService_ReplaceAlertDef",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "A request to replace an existing alert definition",
                "properties": {
                  "accessPolicy": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/AccessPolicyAction"
                      }
                    ],
                    "description": "Change to the alert's access policy: upsert a raw policy, or delete (remove) the existing one. Optional; if omitted, the existing policy is left unchanged. Changing the access policy requires the alerts:UpdateAccessPolicy permission."
                  },
                  "alertDefProperties": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/AlertDefProperties"
                      }
                    ],
                    "description": "The properties of the alert definition"
                  },
                  "id": {
                    "description": "Alert definition ID",
                    "examples": [
                      "123e4567-e89b-12d3-a456-426614174000"
                    ],
                    "maxLength": 36,
                    "minLength": 0,
                    "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
                    "type": "string"
                  }
                },
                "title": "Replace alert definition request",
                "type": "object"
              }
            }
          }
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReplaceAlertDefResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Replace an alert definition",
        "tags": [
          "Alert definitions service"
        ],
        "x-coralogixPermissions": [
          "alerts:UpdateConfig"
        ]
      },
      "post": {
        "description": "Creates a new alert definition.\n\nRequires the following permissions:\n- `alerts:UpdateConfig`",
        "operationId": "AlertDefsService_CreateAlertDef",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "A request to create a new alert definition",
                "properties": {
                  "accessPolicy": {
                    "description": "The access policy for the alert as a raw JSON string. Optional; requires the alerts:UpdateAccessPolicy permission to set. If omitted, the alert is created without an access policy.",
                    "maxLength": 65536,
                    "minLength": 0,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "alertDefProperties": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/AlertDefProperties"
                      }
                    ],
                    "description": "The properties of the alert definition"
                  }
                },
                "title": "Create alert definition request",
                "type": "object"
              }
            }
          }
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CreateAlertDefResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Create an alert",
        "tags": [
          "Alert definitions service"
        ],
        "x-coralogixPermissions": [
          "alerts:UpdateConfig"
        ]
      }
    },
    "/alerts/alerts/v3/all/counts": {
      "get": {
        "description": "Returns counts for different filter options based on the provided filters\n\nRequires the following permissions:\n- `alerts:ReadConfig`",
        "operationId": "AlertDefsService_FilterOptionCounts",
        "parameters": [
          {
            "description": "The filter to apply when counting options",
            "in": "query",
            "name": "query_filter",
            "required": false,
            "schema": {
              "description": "Filter configuration for counting filter options",
              "properties": {
                "enabledFilter": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/FilterOptionCountsEnabledFilter"
                    }
                  ],
                  "description": "Filter by alert definition enabled status"
                },
                "entityLabelsFilter": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/FilterOptionCountsEntityLabelsFilter"
                    }
                  ],
                  "description": "Filter by alert definition entity labels"
                },
                "nameFilter": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/FilterOptionCountsNameFilter"
                    }
                  ],
                  "description": "Filter by alert definition names"
                },
                "priorityFilter": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/FilterOptionCountsPriorityFilter"
                    }
                  ],
                  "description": "Filter by alert definition priorities"
                },
                "statusFilter": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/FilterOptionCountsStatusFilter"
                    }
                  ],
                  "description": "Filter by alert definition status"
                },
                "typeFilter": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/FilterOptionCountsTypeFilter"
                    }
                  ],
                  "description": "Filter by alert definition types"
                }
              },
              "title": "Filter option counts filter",
              "type": "object"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/FilterOptionCountsResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Get counts for filter options",
        "tags": [
          "Alert definitions service"
        ],
        "x-coralogixPermissions": [
          "alerts:ReadConfig"
        ]
      }
    },
    "/alerts/alerts/v3/all/create": {
      "post": {
        "description": "Creates multiple alert definitions in a single request. The operation is best-effort - definitions that fail to be created are reported in the response and do not prevent creation of the others. Limited to 100 alert definitions per request.\n\nRequires the following permissions:\n- `alerts:UpdateConfig`",
        "operationId": "AlertDefsService_BulkCreateAlertDefs",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "A request to create multiple alert definitions",
                "properties": {
                  "alertDefsToCreate": {
                    "description": "List of alert definitions to create. Limited to 100 alert definitions per request.",
                    "items": {
                      "$ref": "#/components/schemas/AlertDefToCreate"
                    },
                    "maxItems": 100,
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": [
                  "alertDefsToCreate"
                ],
                "title": "Bulk create alert definitions request",
                "type": "object"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "example": {
                  "alertDefs": [
                    {
                      "alertDefProperties": {
                        "description": "Fires when the error rate exceeds the threshold.",
                        "enabled": true,
                        "name": "High error rate",
                        "priority": "ALERT_DEF_PRIORITY_P2",
                        "type": "ALERT_DEF_TYPE_LOGS_THRESHOLD"
                      },
                      "alertVersionId": "223e4567-e89b-12d3-a456-426614174000",
                      "createdTime": "2026-07-01T08:30:00.000Z",
                      "id": "123e4567-e89b-12d3-a456-426614174000",
                      "updatedTime": "2026-07-01T08:30:00.000Z"
                    }
                  ],
                  "failedToCreateAlertDefs": [
                    {
                      "index": 1,
                      "reason": "Alert definition name must not be empty."
                    }
                  ]
                },
                "schema": {
                  "$ref": "#/components/schemas/BulkCreateAlertDefsResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Bulk create alert definitions",
        "tags": [
          "Alert definitions service"
        ],
        "x-coralogixPermissions": [
          "alerts:UpdateConfig"
        ]
      }
    },
    "/alerts/alerts/v3/all/delete": {
      "post": {
        "description": "Delete multiple alert definitions by their IDs. The operation is atomic - either all alerts are deleted or none are. Limited to 100 alert definitions per request.\n\nRequires the following permissions:\n- `alerts:UpdateConfig`",
        "operationId": "AlertDefsService_BulkDeleteAlertDefs",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "A request to delete multiple alert defintions by their IDs",
                "properties": {
                  "ids": {
                    "description": "List of alert definition IDs to delete.",
                    "examples": [
                      [
                        "123e4567-e89b-12d3-a456-426614174000"
                      ]
                    ],
                    "items": {
                      "description": "List of alert definition IDs to delete.",
                      "maxLength": 36,
                      "minLength": 1,
                      "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
                      "type": "string"
                    },
                    "maxItems": 100,
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "title": "Bulk delete alert definitions request",
                "type": "object"
              }
            }
          }
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BulkDeleteAlertDefsResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Bulk delete alert definitions",
        "tags": [
          "Alert definitions service"
        ],
        "x-coralogixPermissions": [
          "alerts:UpdateConfig"
        ]
      }
    },
    "/alerts/alerts/v3/all/download": {
      "get": {
        "description": "Download alert definitions in base64-encoded byte format. When ids are provided, only those alert definitions are downloaded; otherwise all accessible alert definitions are downloaded.\n\nRequires the following permissions:\n- `alerts:ReadConfig`",
        "operationId": "AlertDefsService_DownloadAlerts",
        "parameters": [
          {
            "description": "Optional list of alert definition IDs to download. When empty, all accessible alert definitions are downloaded. IDs that are not found or not accessible are omitted from the download and reported in the response notFoundIds (no error is returned for them).",
            "in": "query",
            "name": "ids",
            "required": false,
            "schema": {
              "description": "Optional list of alert definition IDs to download. When empty, all accessible alert definitions are downloaded. IDs that are not found or not accessible are omitted from the download and reported in the response notFoundIds (no error is returned for them).",
              "examples": [
                [
                  "123e4567-e89b-12d3-a456-426614174000"
                ]
              ],
              "items": {
                "description": "Optional list of alert definition IDs to download. When empty, all accessible alert definitions are downloaded. IDs that are not found or not accessible are omitted from the download and reported in the response notFoundIds (no error is returned for them).",
                "maxLength": 36,
                "minLength": 0,
                "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
                "type": "string"
              },
              "maxItems": 1000,
              "minItems": 0,
              "type": "array"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DownloadAlertsResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Download alerts",
        "tags": [
          "Alert definitions service"
        ],
        "x-coralogixPermissions": [
          "alerts:ReadConfig"
        ]
      }
    },
    "/alerts/alerts/v3/all/replace": {
      "put": {
        "description": "Replaces multiple alert definitions in a single request. Each entry updates the existing alert definition with the matching ID; alert definitions not referenced in the request are left unchanged. The operation is best-effort - entries that fail are reported in the response and do not prevent other entries from being applied. Limited to 100 alert definitions per request.\n\nRequires the following permissions:\n- `alerts:UpdateConfig`",
        "operationId": "AlertDefsService_BulkReplaceAlertDefs",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "A request to bulk replace multiple alert definitions",
                "properties": {
                  "alertDefsToReplace": {
                    "description": "List of alert definitions to replace. Limited to 100 alert definitions per request.",
                    "items": {
                      "$ref": "#/components/schemas/AlertDefToReplace"
                    },
                    "maxItems": 100,
                    "minItems": 0,
                    "type": "array"
                  }
                },
                "title": "Bulk replace alert definitions request",
                "type": "object"
              }
            }
          }
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BulkReplaceAlertDefsResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Bulk replace alert definitions",
        "tags": [
          "Alert definitions service"
        ],
        "x-coralogixPermissions": [
          "alerts:UpdateConfig"
        ]
      }
    },
    "/alerts/alerts/v3/version-ids/{alert_version_id}": {
      "get": {
        "description": "Returns the alert definition with the specified version ID.\n\nRequires the following permissions:\n- `alerts:ReadConfig`",
        "operationId": "AlertDefsService_GetAlertDefByVersionId",
        "parameters": [
          {
            "description": "Alert version ID",
            "in": "path",
            "name": "alert_version_id",
            "required": true,
            "schema": {
              "description": "Alert version ID",
              "examples": [
                "123e4567-e89b-12d3-a456-426614174000"
              ],
              "maxLength": 36,
              "minLength": 0,
              "pattern": "^[\\s\\S]*$",
              "type": "string"
            }
          },
          {
            "description": "When true, populate the response's access field with the caller's access decision and the alert's raw access policy. Defaults to false.",
