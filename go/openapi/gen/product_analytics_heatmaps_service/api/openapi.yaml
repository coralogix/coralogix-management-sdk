          },
          "values": {
            "description": "Values to match. At least one is required.",
            "items": {
              "maxLength": 1024,
              "minLength": 1,
              "pattern": "^[\\s\\S]*$",
              "type": "string",
              "description": "Values to match. At least one is required."
            },
            "maxItems": 100,
            "minItems": 1,
            "type": "array",
            "x-coralogix-collection": "set"
          }
        },
        "description": "String matching condition."
      },
