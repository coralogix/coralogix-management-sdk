        "type": "object",
        "properties": {
          "condition": {
            "allOf": [
              {
                "$ref": "#/components/schemas/StringCondition"
              }
            ],
            "description": "Condition the field must match."
          },
          "field": {
            "allOf": [
              {
                "$ref": "#/components/schemas/StringFilterField"
              }
            ],
            "description": "String field to filter on. STRING_FILTER_FIELD_UNSPECIFIED is rejected.",
            "examples": [
              "STRING_FILTER_FIELD_PLATFORM"
            ]
          }
        },
        "description": "Filter on a string field."
      },
      "StringFilterField": {
        "enum": [
          "STRING_FILTER_FIELD_UNSPECIFIED",
          "STRING_FILTER_FIELD_URL_SCHEMA",
          "STRING_FILTER_FIELD_URL_SUBDOMAIN",
          "STRING_FILTER_FIELD_URL_DOMAIN",
          "STRING_FILTER_FIELD_URL_HOST",
          "STRING_FILTER_FIELD_URL_PATH",
          "STRING_FILTER_FIELD_URL_TEMPLATE",
          "STRING_FILTER_FIELD_REFERRER_SCHEMA",
          "STRING_FILTER_FIELD_REFERRER_SUBDOMAIN",
          "STRING_FILTER_FIELD_REFERRER_DOMAIN",
          "STRING_FILTER_FIELD_REFERRER_HOST",
          "STRING_FILTER_FIELD_REFERRER_PATH",
          "STRING_FILTER_FIELD_REFERRER_URL",
          "STRING_FILTER_FIELD_SESSION_ID",
          "STRING_FILTER_FIELD_USER_ID",
          "STRING_FILTER_FIELD_USER_EMAIL",
          "STRING_FILTER_FIELD_USER_NAME",
          "STRING_FILTER_FIELD_CX_USER_ID",
          "STRING_FILTER_FIELD_ACCOUNT_ID",
          "STRING_FILTER_FIELD_ACCOUNT_NAME",
          "STRING_FILTER_FIELD_VIEW_ID",
          "STRING_FILTER_FIELD_PLATFORM",
          "STRING_FILTER_FIELD_ENVIRONMENT",
          "STRING_FILTER_FIELD_APP_VERSION",
          "STRING_FILTER_FIELD_CX_SDK_VERSION",
          "STRING_FILTER_FIELD_BROWSER_NAME",
          "STRING_FILTER_FIELD_BROWSER_VERSION",
          "STRING_FILTER_FIELD_BROWSER_MAJOR_VERSION",
          "STRING_FILTER_FIELD_OS",
          "STRING_FILTER_FIELD_OS_MAJOR_VERSION",
          "STRING_FILTER_FIELD_OS_VERSION",
          "STRING_FILTER_FIELD_DEVICE_TYPE",
          "STRING_FILTER_FIELD_DEVICE_NAME",
          "STRING_FILTER_FIELD_DEVICE_BRAND",
          "STRING_FILTER_FIELD_DEVICE_MODEL",
          "STRING_FILTER_FIELD_DEVICE_ARCHITECTURE",
          "STRING_FILTER_FIELD_COUNTRY_NAME",
          "STRING_FILTER_FIELD_CITY_NAME",
          "STRING_FILTER_FIELD_CONTINENT_NAME",
          "STRING_FILTER_FIELD_IP",
          "STRING_FILTER_FIELD_USER_AGENT",
          "STRING_FILTER_FIELD_APP_NAME",
          "STRING_FILTER_FIELD_CLICKS_ELEMENT_FINGERPRINT"
        ],
        "type": "string",
        "description": "Session attribute with string values, for stringFilter."
      },
      "ViewFilter": {
        "type": "object",
        "oneOf": [
          {
            "required": [
              "stringFilter"
            ],
            "type": "object"
          },
          {
            "required": [
              "numericFilter"
            ],
            "type": "object"
          },
          {
            "required": [
              "boolFilter"
            ],
            "type": "object"
          }
        ],
        "properties": {
          "boolFilter": {
            "allOf": [
              {
                "$ref": "#/components/schemas/BoolFilter"
              }
            ],
            "description": "A boolean field with the value it must have."
          },
          "numericFilter": {
            "allOf": [
              {
                "$ref": "#/components/schemas/NumericFilter"
              }
            ],
            "description": "A numeric field with the condition it must match."
          },
          "stringFilter": {
            "allOf": [
              {
                "$ref": "#/components/schemas/StringFilter"
              }
            ],
            "description": "A string field with the condition it must match."
          }
        },
        "description": "A session filter. Each kind takes only the fields of its type: string fields in stringFilter, numeric fields in numericFilter, boolean fields in boolFilter."
      },
      "ViewTimeRange": {
        "type": "object",
        "oneOf": [
          {
            "required": [
              "fixed"
            ],
            "type": "object"
          },
          {
            "required": [
              "relativeMinutes"
            ],
            "type": "object"
          },
          {
            "required": [
              "calendar"
            ],
            "type": "object"
          }
        ],
        "properties": {
          "calendar": {
            "allOf": [
              {
                "$ref": "#/components/schemas/CalendarWindow"
              }
            ],
            "description": "Named calendar window, resolved in the viewer's timezone. CALENDAR_WINDOW_UNSPECIFIED is rejected."
          },
          "fixed": {
            "allOf": [
              {
                "$ref": "#/components/schemas/FixedTimeRange"
              }
            ],
            "description": "Absolute time range between two timestamps."
          },
          "relativeMinutes": {
            "maxLength": 20,
            "minLength": 1,
            "pattern": "^[1-9][0-9]{0,18}$",
