        },
        "summary": "Delete heatmap",
        "tags": [
          "Product Analytics Heatmaps Service"
        ],
        "x-coralogixPermissions": [
          "product-analytics:Manage"
        ]
      },
      "patch": {
        "description": "Updates the fields listed in update_mask. Other fields are unchanged. A listed field that is omitted from the body is cleared or reset to its default. The last write wins, and version increases by 1. Returns the stored heatmap. Returns 412 (FAILED_PRECONDITION) with \"Product Analytics is not enabled for this team. A team admin can enable it in Coralogix.\" when Product Analytics is off for the team.\n\nRequires the following permissions:\n- `product-analytics:Manage`",
        "operationId": "HeatmapsService_UpdateSavedHeatmap",
        "parameters": [
          {
            "description": "Comma-separated JSON paths of the fields to update: viewName, name, filters, snapshotId, timeRange, mode, actionNameFilter. snake_case names are also accepted. A listed field that is omitted from the body is cleared or reset to its default: filters becomes empty, snapshotId is removed, and actionNameFilter resets to ACTION_NAME_FILTER_ALL_CLICKS; name, viewName, timeRange, and mode cannot be cleared: listing one without a value returns 400. Nested, unknown, immutable, and server-generated paths, and *, return 400. A listed field is replaced as a whole, a oneOf arm included.",
            "in": "query",
            "name": "update_mask",
            "required": true,
            "schema": {
              "description": "Comma-separated JSON paths of the fields to update: viewName, name, filters, snapshotId, timeRange, mode, actionNameFilter. snake_case names are also accepted. A listed field that is omitted from the body is cleared or reset to its default: filters becomes empty, snapshotId is removed, and actionNameFilter resets to ACTION_NAME_FILTER_ALL_CLICKS; name, viewName, timeRange, and mode cannot be cleared: listing one without a value returns 400. Nested, unknown, immutable, and server-generated paths, and *, return 400. A listed field is replaced as a whole, a oneOf arm included.",
              "maxLength": 512,
              "minLength": 1,
              "pattern": "^[A-Za-z_][A-Za-z0-9_]*(,[A-Za-z_][A-Za-z0-9_]*)*$",
              "type": "string",
              "x-coralogix-presence": true
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "Heatmap field values for an update. Only fields listed in update_mask are applied.",
                "properties": {
                  "actionNameFilter": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/ActionNameFilter"
                      }
                    ],
                    "default": "ACTION_NAME_FILTER_ALL_CLICKS",
                    "description": "Which clicks the heatmap includes. Clearing it or sending ACTION_NAME_FILTER_UNSPECIFIED resets it to ACTION_NAME_FILTER_ALL_CLICKS."
                  },
                  "filters": {
                    "description": "Session filters of the heatmap. Replaces the whole list.",
                    "items": {
                      "$ref": "#/components/schemas/ViewFilter"
                    },
                    "maxItems": 100,
                    "minItems": 0,
                    "type": "array",
                    "x-coralogix-collection": "set"
                  },
                  "mode": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/HeatmapMode"
                      }
                    ],
                    "description": "Kind of heatmap visualization shown for the page view. Cannot be cleared. HEATMAP_MODE_UNSPECIFIED is rejected."
                  },
                  "name": {
                    "description": "Display name of the heatmap. Must not be empty. Cannot be cleared.",
                    "maxLength": 1024,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string"
                  },
                  "snapshotId": {
                    "description": "ID of the page snapshot the heatmap is drawn on. Clearing it removes the snapshot.",
                    "maxLength": 256,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "timeRange": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/ViewTimeRange"
                      }
                    ],
                    "description": "Time range of the heatmap. Cannot be cleared."
                  },
                  "viewName": {
                    "description": "Name of the page view the heatmap covers. Cannot be cleared.",
                    "maxLength": 1024,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            }
          }
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "example": {
                  "actionNameFilter": "ACTION_NAME_FILTER_ALL_CLICKS",
                  "appName": "web-shop",
                  "createdAt": "2026-11-16T10:00:00.000Z",
                  "filters": [],
                  "id": "43",
                  "mode": "HEATMAP_MODE_CLICK_MAP",
                  "name": "Checkout clicks",
                  "owner": "dana@example.com",
                  "snapshotId": "5f0c6a2e-1b7d-4c3a-9e8f-2a1b3c4d5e6f",
                  "timeRange": {
                    "calendar": "CALENDAR_WINDOW_TODAY"
                  },
                  "updatedAt": "2026-11-16T11:00:00.000Z",
                  "version": 2,
                  "viewName": "/checkout"
                },
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/SavedHeatmap"
                    }
                  ],
                  "description": "The updated heatmap."
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "404": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Heatmap not found"
          },
          "412": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Product Analytics is not enabled for this team"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Update heatmap",
        "tags": [
          "Product Analytics Heatmaps Service"
        ],
        "x-coralogixPermissions": [
          "product-analytics:Manage"
        ]
      },
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "description": "Heatmap ID, a decimal number.",
          "required": true,
          "schema": {
            "maxLength": 19,
            "minLength": 1,
            "pattern": "^[1-9][0-9]{0,18}$",
            "type": "string",
            "description": "Heatmap ID, a decimal number."
          }
        }
      ]
    }
  },
  "components": {
    "schemas": {
      "ActionNameFilter": {
        "enum": [
          "ACTION_NAME_FILTER_UNSPECIFIED",
          "ACTION_NAME_FILTER_ALL_CLICKS",
          "ACTION_NAME_FILTER_NAMED_ONLY",
          "ACTION_NAME_FILTER_UNNAMED_ONLY"
        ],
        "type": "string",
        "description": "Which clicks a heatmap includes. ALL_CLICKS includes every click, NAMED_ONLY only named actions, UNNAMED_ONLY only unnamed ones."
      },
      "BoolFilter": {
        "required": [
          "field",
          "value"
        ],
        "type": "object",
        "properties": {
          "field": {
            "allOf": [
              {
                "$ref": "#/components/schemas/BoolFilterField"
              }
            ],
            "description": "Boolean field to filter on. BOOL_FILTER_FIELD_UNSPECIFIED is rejected.",
            "examples": [
              "BOOL_FILTER_FIELD_HAS_SESSION_REPLAY"
            ]
          },
          "value": {
            "description": "Value the field must have.",
            "type": "boolean",
            "x-coralogix-presence": true
          }
        },
        "description": "Filter on a boolean field."
      },
      "BoolFilterField": {
        "enum": [
          "BOOL_FILTER_FIELD_UNSPECIFIED",
          "BOOL_FILTER_FIELD_HAS_SESSION_REPLAY",
          "BOOL_FILTER_FIELD_HAS_SCREENSHOT",
          "BOOL_FILTER_FIELD_IS_RAGE_CLICK",
          "BOOL_FILTER_FIELD_IS_DEAD_CLICK"
        ],
        "type": "string",
        "description": "Session attribute with boolean values, for boolFilter."
      },
      "CalendarWindow": {
        "enum": [
          "CALENDAR_WINDOW_UNSPECIFIED",
          "CALENDAR_WINDOW_TODAY",
          "CALENDAR_WINDOW_YESTERDAY"
        ],
        "type": "string",
        "description": "Named calendar window. TODAY runs from local midnight to now, YESTERDAY covers the whole previous local day."
      },
      "DeleteSavedHeatmapResponse": {
        "type": "object",
        "additionalProperties": false,
        "description": "Confirmation that the heatmap was deleted."
      },
      "Error": {
        "type": "object",
        "properties": {
          "code": {
            "maximum": 599,
            "minimum": 100,
            "type": "integer",
            "description": "HTTP status code of the error (for example 400, 404, 500).",
            "format": "int32"
          },
          "message": {
            "maxLength": 4096,
            "minLength": 0,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "Human-readable description of the error."
          }
        },
        "description": "Standard error response body returned for a failed request."
      },
      "FilterPathAndValues": {
        "title": "FilterPathAndValues",
        "required": [
          "path"
        ],
        "type": "object",
        "oneOf": [
          {
            "required": [
              "multipleValues"
            ],
            "type": "object"
          },
          {
            "required": [
              "filters"
            ],
            "type": "object"
          }
        ],
        "properties": {
          "filters": {
            "allOf": [
              {
                "$ref": "#/components/schemas/Filters"
              }
            ],
            "description": "The filters."
          },
          "multipleValues": {
            "$ref": "#/components/schemas/MultipleValues"
          },
          "path": {
            "examples": [
              "test"
            ],
            "minLength": 0,
            "type": "string",
            "x-coralogix-presence": true
          }
        },
        "description": "This data structure represents a filter path and values"
      },
      "Filters": {
        "title": "Filters",
        "required": [
          "pathAndValues"
        ],
        "type": "object",
        "properties": {
          "operator": {
            "allOf": [
              {
                "$ref": "#/components/schemas/v3.FilterOperator"
              }
            ],
            "examples": [
              "FILTER_OPERATOR_OR"
            ]
          },
          "pathAndValues": {
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/FilterPathAndValues"
            }
          }
        },
        "description": "This data structure represents a filter"
      },
      "FixedTimeRange": {
        "required": [
          "fromTimestampMs",
          "toTimestampMs"
        ],
        "type": "object",
        "properties": {
          "fromTimestampMs": {
            "maxLength": 20,
            "minLength": 1,
            "pattern": "^[1-9][0-9]{0,18}$",
            "type": "string",
            "description": "Start of the range, in Unix milliseconds. Inclusive: events at exactly this time are in the range.",
            "examples": [
              "1763251200000"
            ]
          },
          "toTimestampMs": {
            "maxLength": 20,
            "minLength": 1,
            "pattern": "^[1-9][0-9]{0,18}$",
            "type": "string",
            "description": "End of the range, in Unix milliseconds. Exclusive: events at exactly this time are not in the range, so consecutive ranges can share a boundary.",
            "examples": [
              "1763337600000"
            ]
          }
        },
        "description": "Absolute time range, from inclusive to exclusive."
      },
      "HeatmapMode": {
        "enum": [
          "HEATMAP_MODE_UNSPECIFIED",
          "HEATMAP_MODE_TOP_ELEMENTS",
          "HEATMAP_MODE_CLICK_MAP",
          "HEATMAP_MODE_SCROLL_MAP"
        ],
        "type": "string",
        "description": "Kind of heatmap visualization."
      },
      "ListSavedHeatmapsResponse": {
        "type": "object",
        "properties": {
          "heatmaps": {
            "maxItems": 500,
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/SavedHeatmap"
            },
            "description": "The heatmaps, ordered by updatedAt descending, then by id descending."
          },
          "nextPageToken": {
            "maxLength": 1024,
            "minLength": 0,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "Token for the next page, valid for 15 minutes. Empty on the last page."
          },
          "totalSize": {
            "maximum": 2147483647,
            "minimum": 0,
            "type": "integer",
            "description": "Exact number of heatmaps that match app_names, across all pages.",
            "format": "int32"
          }
        },
        "description": "A page of saved heatmaps."
      },
      "MultipleValues": {
        "type": "object",
        "properties": {
          "matcher": {
            "$ref": "#/components/schemas/events.v3.FilterMatcher"
          },
          "values": {
            "minItems": 0,
            "type": "array",
            "items": {
              "minLength": 0,
              "type": "string"
            }
          }
        }
      },
      "NumericCondition": {
        "type": "object",
        "oneOf": [
          {
            "required": [
              "min"
            ],
            "type": "object"
          },
          {
            "required": [
              "max"
            ],
            "type": "object"
          },
          {
            "required": [
              "range"
            ],
            "type": "object"
          }
        ],
        "properties": {
          "max": {
            "maxLength": 20,
            "minLength": 1,
            "pattern": "^-?[0-9]+$",
            "type": "string",
            "description": "Matches values less than or equal to max.",
            "examples": [
              "100"
            ]
          },
          "min": {
            "maxLength": 20,
            "minLength": 1,
            "pattern": "^-?[0-9]+$",
            "type": "string",
            "description": "Matches values greater than or equal to min.",
            "examples": [
              "1"
            ]
          },
          "range": {
            "allOf": [
              {
                "$ref": "#/components/schemas/NumericRange"
              }
            ],
            "description": "Matches values from lower to upper, both included."
          }
        },
        "description": "Numeric matching condition. Exactly one of min, max, or range is set."
      },
      "NumericFilter": {
        "required": [
          "field",
          "condition"
        ],
        "type": "object",
        "properties": {
          "condition": {
            "allOf": [
              {
                "$ref": "#/components/schemas/NumericCondition"
              }
            ],
            "description": "Condition the field must match."
          },
          "field": {
            "allOf": [
              {
                "$ref": "#/components/schemas/NumericFilterField"
              }
            ],
            "description": "Numeric field to filter on. NUMERIC_FILTER_FIELD_UNSPECIFIED is rejected.",
            "examples": [
              "NUMERIC_FILTER_FIELD_ERROR_COUNT"
            ]
          }
        },
        "description": "Filter on a numeric field."
      },
      "NumericFilterField": {
        "enum": [
          "NUMERIC_FILTER_FIELD_UNSPECIFIED",
          "NUMERIC_FILTER_FIELD_ERROR_COUNT",
          "NUMERIC_FILTER_FIELD_ACTION_COUNT",
          "NUMERIC_FILTER_FIELD_LONG_TASK_COUNT",
          "NUMERIC_FILTER_FIELD_CRASH_COUNT",
          "NUMERIC_FILTER_FIELD_RESOURCE_COUNT",
          "NUMERIC_FILTER_FIELD_SCROLL_DEPTH_PERCENTAGE",
          "NUMERIC_FILTER_FIELD_VIEWPORT_WIDTH",
          "NUMERIC_FILTER_FIELD_VIEWPORT_HEIGHT",
          "NUMERIC_FILTER_FIELD_RAGE_CLICK_COUNT",
          "NUMERIC_FILTER_FIELD_DEAD_CLICK_COUNT"
        ],
        "type": "string",
        "description": "Session attribute with numeric values, for numericFilter."
      },
      "NumericRange": {
        "required": [
          "lower",
          "upper"
        ],
        "type": "object",
        "properties": {
          "lower": {
            "description": "Lowest matching value, included. Must not be greater than upper.",
            "examples": [
              "1"
            ],
            "maxLength": 20,
            "minLength": 1,
            "pattern": "^-?[0-9]+$",
            "type": "string",
            "x-coralogix-presence": true
          },
          "upper": {
            "description": "Highest matching value, included.",
            "examples": [
              "100"
            ],
            "maxLength": 20,
            "minLength": 1,
            "pattern": "^-?[0-9]+$",
            "type": "string",
            "x-coralogix-presence": true
          }
        },
        "description": "Inclusive numeric range."
      },
      "SavedHeatmap": {
        "required": [
          "id",
          "appName",
          "name",
          "viewName",
          "timeRange",
          "mode",
          "actionNameFilter",
          "createdAt",
          "updatedAt",
          "version"
        ],
        "type": "object",
        "properties": {
          "actionNameFilter": {
            "allOf": [
              {
                "$ref": "#/components/schemas/ActionNameFilter"
              }
            ],
            "description": "Which clicks the heatmap includes.",
            "default": "ACTION_NAME_FILTER_ALL_CLICKS"
          },
          "appName": {
            "maxLength": 1024,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "RUM application the heatmap belongs to."
          },
          "createdAt": {
            "description": "When the heatmap was created. Set by the server.",
            "format": "date-time",
            "maxLength": 64,
            "minLength": 0,
            "readOnly": true,
            "type": "string",
            "x-coralogix-presence": true
          },
          "filters": {
            "description": "Session filters of the heatmap. Empty when not set.",
            "items": {
              "$ref": "#/components/schemas/ViewFilter"
            },
            "maxItems": 100,
            "minItems": 0,
            "type": "array",
            "x-coralogix-collection": "set"
          },
          "id": {
            "maxLength": 19,
            "minLength": 1,
            "pattern": "^[1-9][0-9]{0,18}$",
            "type": "string",
            "description": "Heatmap ID, a decimal number. Set by the server.",
            "readOnly": true
          },
          "mode": {
            "allOf": [
              {
                "$ref": "#/components/schemas/HeatmapMode"
              }
            ],
            "description": "Kind of heatmap visualization shown for the page view."
          },
          "name": {
            "maxLength": 1024,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "Display name of the heatmap. Does not have to be unique."
          },
          "owner": {
            "description": "User who created the heatmap. Set by the server. Absent for heatmaps saved before owners were recorded.",
            "maxLength": 1024,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "readOnly": true,
            "type": "string",
            "x-coralogix-presence": true
          },
          "snapshotId": {
            "description": "ID of the page snapshot the heatmap is drawn on. Absent when the heatmap has no snapshot.",
            "maxLength": 256,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "x-coralogix-presence": true
          },
          "timeRange": {
            "allOf": [
              {
                "$ref": "#/components/schemas/ViewTimeRange"
              }
            ],
            "description": "Time range of the heatmap."
          },
          "updatedAt": {
            "description": "When the heatmap was last updated, from the API or the Coralogix UI. Set by the server.",
            "format": "date-time",
            "maxLength": 64,
            "minLength": 0,
            "readOnly": true,
            "type": "string",
            "x-coralogix-presence": true
          },
          "version": {
            "maximum": 2147483647,
            "minimum": 1,
            "type": "integer",
            "description": "Version of the heatmap. Set by the server: 1 on create, increased by 1 on every update, including updates made in the Coralogix UI.",
            "format": "int32",
            "readOnly": true
          },
          "viewName": {
            "maxLength": 1024,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "Name of the page view the heatmap covers."
          }
        },
        "description": "A saved heatmap of a RUM application page."
      },
      "StringCondition": {
        "required": [
          "values",
          "operator"
        ],
        "type": "object",
        "properties": {
          "operator": {
            "allOf": [
              {
                "$ref": "#/components/schemas/StringConditionOperator"
              }
            ],
