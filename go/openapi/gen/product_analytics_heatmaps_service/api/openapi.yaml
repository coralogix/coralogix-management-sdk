{
  "openapi": "3.1.0",
  "info": {
    "title": "",
    "version": "1.0.0"
  },
  "paths": {
    "/product-analytics/heatmaps/v1": {
      "get": {
        "description": "Lists saved heatmaps, one page at a time, ordered by updatedAt descending, then by id descending. totalSize is the exact number of heatmaps that match app_names. Returns 412 (FAILED_PRECONDITION) with \"Product Analytics is not enabled for this team. A team admin can enable it in Coralogix.\" when Product Analytics is off for the team.\n\nRequires the following permissions:\n- `product-analytics:Read`",
        "operationId": "HeatmapsService_ListSavedHeatmaps",
        "parameters": [
          {
            "description": "Maximum number of heatmaps to return. 0 uses the default of 20. A value above 500 is lowered to 500. A negative value returns 400.",
            "in": "query",
            "name": "page_size",
            "required": false,
            "schema": {
              "description": "Maximum number of heatmaps to return. 0 uses the default of 20. A value above 500 is lowered to 500. A negative value returns 400.",
              "format": "int32",
              "maximum": 2147483647,
              "minimum": 0,
              "type": "integer"
            }
          },
          {
            "description": "The nextPageToken of the previous response. Empty for the first page. The token is opaque, valid for 15 minutes, and tied to the app_names of the request that returned it. A token that is expired, from another query, or malformed returns 400: \"pageToken belongs to a different query or has expired. Send the request again without pageToken.\"",
            "in": "query",
            "name": "page_token",
            "required": false,
            "schema": {
              "description": "The nextPageToken of the previous response. Empty for the first page. The token is opaque, valid for 15 minutes, and tied to the app_names of the request that returned it. A token that is expired, from another query, or malformed returns 400: \"pageToken belongs to a different query or has expired. Send the request again without pageToken.\"",
              "maxLength": 1024,
              "minLength": 0,
              "pattern": "^[\\s\\S]*$",
              "type": "string"
            }
          },
          {
            "description": "Returns only heatmaps of these RUM applications. Repeat the parameter for each application, for example app_names=web-shop&app_names=docs. Omit to return heatmaps of every application.",
            "in": "query",
            "name": "app_names",
            "required": false,
            "schema": {
              "description": "Returns only heatmaps of these RUM applications. Repeat the parameter for each application, for example app_names=web-shop&app_names=docs. Omit to return heatmaps of every application.",
              "items": {
                "description": "Returns only heatmaps of these RUM applications. Repeat the parameter for each application, for example app_names=web-shop&app_names=docs. Omit to return heatmaps of every application.",
                "maxLength": 1024,
                "minLength": 1,
                "pattern": "^[\\s\\S]*$",
                "type": "string"
              },
              "maxItems": 100,
              "minItems": 0,
              "type": "array"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "example": {
                  "heatmaps": [
                    {
                      "actionNameFilter": "ACTION_NAME_FILTER_ALL_CLICKS",
                      "appName": "web-shop",
                      "createdAt": "2026-11-16T10:00:00.000Z",
                      "filters": [],
                      "id": "43",
                      "mode": "HEATMAP_MODE_CLICK_MAP",
                      "name": "Checkout clicks",
                      "owner": "dana@example.com",
                      "snapshotId": "5f0c6a2e-1b7d-4c3a-9e8f-2a1b3c4d5e6f",
                      "timeRange": {
                        "calendar": "CALENDAR_WINDOW_TODAY"
                      },
                      "updatedAt": "2026-11-16T10:00:00.000Z",
                      "version": 1,
                      "viewName": "/checkout"
                    }
                  ],
                  "nextPageToken": "",
                  "totalSize": 1
                },
                "schema": {
                  "$ref": "#/components/schemas/ListSavedHeatmapsResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "412": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Product Analytics is not enabled for this team"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "List heatmaps",
        "tags": [
          "Product Analytics Heatmaps Service"
        ],
        "x-coralogixPermissions": [
          "product-analytics:Read"
        ]
      },
      "post": {
        "description": "Creates a saved heatmap and returns the stored heatmap, with version 1. Returns 412 (FAILED_PRECONDITION) with \"Product Analytics is not enabled for this team. A team admin can enable it in Coralogix.\" when Product Analytics is off for the team.\n\nRequires the following permissions:\n- `product-analytics:Manage`",
        "operationId": "HeatmapsService_CreateSavedHeatmap",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "Heatmap field values for a create.",
                "properties": {
                  "actionNameFilter": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/ActionNameFilter"
                      }
                    ],
                    "default": "ACTION_NAME_FILTER_ALL_CLICKS",
                    "description": "Which clicks the heatmap includes. Omitted or ACTION_NAME_FILTER_UNSPECIFIED uses ACTION_NAME_FILTER_ALL_CLICKS."
                  },
                  "appName": {
                    "description": "RUM application the heatmap belongs to. Cannot be changed after creation.",
                    "maxLength": 1024,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string"
                  },
                  "filters": {
                    "description": "Session filters of the heatmap.",
                    "items": {
                      "$ref": "#/components/schemas/ViewFilter"
                    },
                    "maxItems": 100,
                    "minItems": 0,
                    "type": "array",
                    "x-coralogix-collection": "set"
                  },
                  "mode": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/HeatmapMode"
                      }
                    ],
                    "description": "Kind of heatmap visualization shown for the page view. HEATMAP_MODE_UNSPECIFIED is rejected."
                  },
                  "name": {
                    "description": "Display name of the heatmap. Must not be empty. Does not have to be unique.",
                    "maxLength": 1024,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string"
                  },
                  "snapshotId": {
                    "description": "ID of the page snapshot the heatmap is drawn on. Omit it for a heatmap without a snapshot.",
                    "maxLength": 256,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "timeRange": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/ViewTimeRange"
                      }
                    ],
                    "description": "Time range of the heatmap."
                  },
                  "viewName": {
                    "description": "Name of the page view the heatmap covers.",
                    "maxLength": 1024,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string"
                  }
                },
                "required": [
                  "appName",
                  "name",
                  "viewName",
                  "timeRange",
                  "mode"
                ],
                "type": "object"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "example": {
                  "actionNameFilter": "ACTION_NAME_FILTER_ALL_CLICKS",
                  "appName": "web-shop",
                  "createdAt": "2026-11-16T10:00:00.000Z",
                  "filters": [],
                  "id": "43",
                  "mode": "HEATMAP_MODE_CLICK_MAP",
                  "name": "Checkout clicks",
                  "owner": "dana@example.com",
                  "snapshotId": "5f0c6a2e-1b7d-4c3a-9e8f-2a1b3c4d5e6f",
                  "timeRange": {
                    "calendar": "CALENDAR_WINDOW_TODAY"
                  },
                  "updatedAt": "2026-11-16T10:00:00.000Z",
                  "version": 1,
                  "viewName": "/checkout"
                },
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/SavedHeatmap"
                    }
                  ],
                  "description": "The created heatmap."
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "412": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Product Analytics is not enabled for this team"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Create heatmap",
        "tags": [
          "Product Analytics Heatmaps Service"
        ],
        "x-coralogixPermissions": [
          "product-analytics:Manage"
        ]
      }
    },
    "/product-analytics/heatmaps/v1/{id}": {
      "get": {
        "description": "Gets a saved heatmap by ID. Returns 412 (FAILED_PRECONDITION) with \"Product Analytics is not enabled for this team. A team admin can enable it in Coralogix.\" when Product Analytics is off for the team.\n\nRequires the following permissions:\n- `product-analytics:Read`",
        "operationId": "HeatmapsService_GetSavedHeatmap",
        "responses": {
