          "STRING_CONDITION_OPERATOR_NOT_CONTAINS",
          "STRING_CONDITION_OPERATOR_START_WITH",
          "STRING_CONDITION_OPERATOR_NOT_START_WITH",
          "STRING_CONDITION_OPERATOR_END_WITH",
          "STRING_CONDITION_OPERATOR_NOT_END_WITH"
        ],
        "type": "string",
        "description": "Operator of a string condition."
      },
      "StringFilter": {
        "required": [
          "field",
          "condition"
