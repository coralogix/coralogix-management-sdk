          "401": {
            "description": "Unauthorized request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "Internal server error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "deprecated": true
      },
      "post": {
        "tags": [
          "Teams Service"
        ],
        "summary": "Create team",
        "description": "Deprecated. Creates a team in the calling user's organization and returns its identifier.",
        "operationId": "TeamService_CreateTeamInOrg",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "Request to create a team in the calling user's organization.",
                "type": "object",
                "properties": {
                  "dailyQuota": {
                    "description": "Daily quota to assign to the new team, in quota units per day. Defaults to 0.01 when omitted.",
                    "type": "number",
                    "format": "double"
                  },
                  "teamAdminsEmail": {
                    "description": "Email addresses of the users to add to the new team as administrators.",
                    "type": "array",
                    "items": {
                      "description": "Email addresses of the users to add to the new team as administrators.",
                      "type": "string",
                      "pattern": "^[^@\\s]+@[^@\\s]+$",
                      "minLength": 1,
                      "maxLength": 320
                    },
                    "minItems": 0,
                    "maxItems": 100
                  },
                  "teamName": {
                    "description": "Display name of the team to create.",
                    "type": "string",
                    "pattern": "^[\\s\\S]*$",
                    "minLength": 1,
                    "maxLength": 255
                  }
                },
                "required": [
                  "teamName"
                ]
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CreateTeamInOrgResponse"
                },
                "example": {
                  "teamId": {
                    "id": 1002
                  }
                }
              }
            }
          },
          "400": {
            "description": "Bad Request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "A team with the same name already exists",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "Internal server error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "deprecated": true
      }
    },
