  "paths": {
    "/aaa/teams/v2": {
      "get": {
        "tags": [
          "Teams Service"
        ],
        "summary": "List teams",
        "description": "Deprecated. Returns every team in the calling user's organization, together with the organization's default team.",
        "operationId": "TeamService_ListTeams",
        "responses": {
          "200": {
            "description": "",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListTeamsResponse"
                },
                "example": {
                  "defaultTeam": {
                    "dailyQuota": 10,
                    "retention": 30,
                    "teamId": {
                      "id": 1001
                    },
                    "teamName": "Default"
                  },
                  "teams": [
                    {
                      "dailyQuota": 10,
                      "retention": 30,
                      "teamId": {
                        "id": 1001
                      },
                      "teamName": "Default"
                    },
                    {
                      "dailyQuota": 2.5,
                      "retention": 7,
                      "teamId": {
                        "id": 1002
                      },
                      "teamName": "Platform"
                    }
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Bad Request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
