            "description": "No rule group set with the given id"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Get Recording Rules",
        "tags": [
          "Recording Rules Service"
        ]
      },
      "put": {
        "description": "Replaces the groups of the set with the given id. An omitted name keeps the stored name. An id that does not exist answers 404.",
        "operationId": "RuleGroupSets_Update",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "A set of rule groups to update.",
                "properties": {
                  "groups": {
                    "description": "The rule groups of the set. The service rejects an empty list. Group names are unique within the set. The request replaces the stored groups: a stored group that the request omits is deleted, and a group with the name of a stored group keeps its id. The server does not keep the order of the groups.",
                    "items": {
                      "$ref": "#/components/schemas/InRuleGroup"
                    },
                    "maxItems": 1000,
                    "minItems": 1,
                    "type": "array",
                    "x-coralogix-collection": "set"
                  },
                  "name": {
                    "description": "The name of the set. Unique among the sets of the company. When omitted, the stored name stays.",
                    "maxLength": 255,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string",
                    "x-coralogix-presence": true
                  }
                },
                "required": [
                  "groups"
                ],
                "title": "Update Rule Group Set",
                "type": "object"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "404": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "No rule group set with the given id"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Update Recording Rules",
        "tags": [
          "Recording Rules Service"
        ]
      },
      "delete": {
        "description": "Deletes the set with the given id. An id that does not exist answers 404.",
        "operationId": "RuleGroupSets_Delete",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "404": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "No rule group set with the given id"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Delete Recording Rules",
        "tags": [
          "Recording Rules Service"
        ]
      },
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "description": "Unique identifier.",
          "required": true,
          "schema": {
            "maxLength": 128,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "Unique identifier."
          }
        }
      ]
    }
  },
  "components": {
    "schemas": {
      "CreateRuleGroupSetResult": {
        "title": "Create Rule Group Set Result",
        "required": [
          "id"
        ],
        "type": "object",
        "properties": {
          "id": {
            "maxLength": 128,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "Unique identifier."
          }
        },
        "description": "Result of creating a rule group set.",
        "externalDocs": {
          "description": "Find out more about recording rules",
          "url": "https://coralogix.com/docs/user-guides/data-transformation/metric-rules/recording-rules/"
        }
      },
      "Error": {
        "type": "object",
        "properties": {
          "code": {
            "maximum": 599,
            "minimum": 100,
            "type": "integer",
            "description": "HTTP status code of the error (for example 400, 404, 500).",
            "format": "int32"
          },
          "message": {
            "maxLength": 4096,
            "minLength": 0,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "Human-readable description of the error."
          }
        },
        "description": "Standard error response body returned for a failed request."
      },
      "FilterPathAndValues": {
        "title": "FilterPathAndValues",
        "required": [
          "path"
        ],
        "type": "object",
        "oneOf": [
          {
            "required": [
              "multipleValues"
            ],
            "type": "object"
          },
          {
            "required": [
              "filters"
            ],
            "type": "object"
          }
        ],
        "properties": {
          "filters": {
            "allOf": [
              {
                "$ref": "#/components/schemas/Filters"
              }
            ],
            "description": "The filters."
          },
          "multipleValues": {
            "$ref": "#/components/schemas/MultipleValues"
          },
          "path": {
            "examples": [
              "test"
            ],
            "minLength": 0,
            "type": "string",
            "x-coralogix-presence": true
          }
        },
        "description": "This data structure represents a filter path and values"
      },
      "Filters": {
        "title": "Filters",
        "required": [
          "pathAndValues"
        ],
        "type": "object",
        "properties": {
          "operator": {
            "allOf": [
              {
                "$ref": "#/components/schemas/v3.FilterOperator"
              }
            ],
            "examples": [
              "FILTER_OPERATOR_OR"
            ]
          },
          "pathAndValues": {
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/FilterPathAndValues"
            }
          }
        },
        "description": "This data structure represents a filter"
      },
      "InRule": {
        "title": "In Rule",
        "required": [
          "record",
          "expr"
        ],
        "type": "object",
        "properties": {
          "evaluationDelayMs": {
            "description": "The delay in milliseconds before evaluating the recording rule expression. Allows late-arriving data to be ingested before evaluation. An omitted delay stays omitted, and 0 is stored as 0.",
            "examples": [
              60000
            ],
            "format": "int64",
            "maximum": 1800000,
            "minimum": 0,
            "type": "integer",
            "x-coralogix-presence": true
          },
          "expr": {
            "maxLength": 10000,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "The PromQL expression to evaluate. Every evaluation cycle evaluates it at the current time and records the result as a new set of time series with the metric name of `record`."
          },
          "labels": {
            "type": "object",
            "additionalProperties": {
              "maxLength": 4096,
              "minLength": 0,
              "pattern": "^[\\s\\S]*$",
              "type": "string"
            },
            "description": "Labels to add or overwrite before storing the result. An omitted map is stored as an empty map."
          },
          "record": {
            "maxLength": 4096,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "The name of the time series to output to. Must be a valid metric name."
          }
        },
        "description": "A rule within a group that defines a recording rule expression.",
        "externalDocs": {
          "description": "Find out more about recording rules",
          "url": "https://coralogix.com/docs/user-guides/data-transformation/metric-rules/recording-rules/"
        }
      },
      "InRuleGroup": {
        "title": "In Rule Group",
        "required": [
          "name"
        ],
        "type": "object",
        "properties": {
          "id": {
            "description": "Unique identifier.",
            "maxLength": 128,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "x-coralogix-presence": true
          },
          "interval": {
            "default": 60,
            "description": "How often the rules of the group are evaluated, in seconds. At least 60. An omitted interval is stored as 60, also on an update.",
            "format": "int64",
            "maximum": 4294967295,
            "minimum": 60,
            "type": "integer",
            "x-coralogix-presence": true
          },
          "limit": {
            "default": "0",
            "description": "Limits the number of series that a rule of the group can produce. 0 means no limit. An omitted limit is stored as 0, also on an update.",
            "maxLength": 20,
            "minLength": 1,
            "pattern": "^[0-9]+$",
            "type": "string",
            "x-coralogix-presence": true
          },
          "name": {
            "maxLength": 255,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "The name of the group. Unique within the set."
          },
          "rules": {
            "maxItems": 1000,
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/InRule"
            },
            "description": "List of rules."
          },
          "version": {
            "description": "Version number.",
            "format": "int64",
            "maximum": 4294967295,
            "minimum": 0,
            "type": "integer",
            "x-coralogix-presence": true
          }
        },
        "description": "A group of recording rules.",
        "externalDocs": {
          "description": "Find out more about recording rules",
          "url": "https://coralogix.com/docs/user-guides/data-transformation/metric-rules/recording-rules/"
        }
      },
      "MultipleValues": {
        "type": "object",
        "properties": {
          "matcher": {
            "$ref": "#/components/schemas/events.v3.FilterMatcher"
          },
          "values": {
            "minItems": 0,
            "type": "array",
            "items": {
              "minLength": 0,
              "type": "string"
            }
          }
        }
      },
      "OutRule": {
        "title": "Out Rule",
        "required": [
          "record",
          "expr",
          "labels"
        ],
        "type": "object",
        "properties": {
          "evaluationDelayMs": {
            "description": "The delay in milliseconds before evaluating the recording rule expression. Allows late-arriving data to be ingested before evaluation. An omitted delay stays omitted, and 0 is stored as 0.",
            "format": "int64",
            "maximum": 1800000,
            "minimum": 0,
            "type": "integer",
            "x-coralogix-presence": true
          },
          "expr": {
            "maxLength": 10000,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "The PromQL expression to evaluate. Every evaluation cycle evaluates it at the current time and records the result as a new set of time series with the metric name of `record`."
          },
          "labels": {
            "type": "object",
            "additionalProperties": {
              "maxLength": 4096,
              "minLength": 0,
              "pattern": "^[\\s\\S]*$",
              "type": "string"
            },
            "description": "Labels to add or overwrite before storing the result. An omitted map is stored as an empty map."
          },
          "lastEvalDurationMs": {
            "description": "The last eval duration ms.",
            "maxLength": 20,
            "minLength": 1,
            "pattern": "^[0-9]+$",
            "type": "string",
            "x-coralogix-presence": true
          },
          "record": {
            "maxLength": 4096,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "The name of the time series to output to. Must be a valid metric name."
          }
        },
        "description": "A recording rule as returned by the API.",
        "externalDocs": {
          "description": "Find out more about recording rules",
          "url": "https://coralogix.com/docs/user-guides/data-transformation/metric-rules/recording-rules/"
        }
      },
      "OutRuleGroup": {
        "title": "Out Rule Group",
        "required": [
          "name",
          "interval",
          "limit",
          "rules",
          "version",
          "id"
        ],
        "type": "object",
        "properties": {
          "id": {
            "maxLength": 128,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "Unique identifier."
          },
          "interval": {
            "default": 60,
            "description": "How often the rules of the group are evaluated, in seconds. At least 60. An omitted interval is stored as 60, also on an update.",
            "format": "int64",
            "maximum": 4294967295,
            "minimum": 60,
            "type": "integer",
            "x-coralogix-presence": true
          },
          "lastEvalAt": {
            "description": "The last eval at.",
            "maxLength": 20,
            "minLength": 1,
            "pattern": "^[0-9]+$",
            "type": "string",
            "x-coralogix-presence": true
          },
          "limit": {
            "default": "0",
            "description": "Limits the number of series that a rule of the group can produce. 0 means no limit. An omitted limit is stored as 0, also on an update.",
            "maxLength": 20,
            "minLength": 1,
            "pattern": "^[0-9]+$",
            "type": "string",
            "x-coralogix-presence": true
          },
          "name": {
            "maxLength": 255,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "The name of the group. Unique within the set."
          },
          "rules": {
            "maxItems": 1000,
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/OutRule"
            },
            "description": "List of rules."
          },
          "version": {
            "maximum": 4294967295,
            "minimum": 0,
            "type": "integer",
            "description": "Version number.",
            "format": "int64"
          }
        },
        "description": "A group of recording rules as returned by the API.",
        "externalDocs": {
          "description": "Find out more about recording rules",
          "url": "https://coralogix.com/docs/user-guides/data-transformation/metric-rules/recording-rules/"
        }
      },
      "OutRuleGroupSet": {
        "title": "Out Rule Group Set",
        "required": [
          "id",
          "groups",
          "name"
        ],
        "type": "object",
        "properties": {
          "groups": {
            "description": "The rule groups of the set, in no particular order.",
            "items": {
              "$ref": "#/components/schemas/OutRuleGroup"
            },
            "maxItems": 1000,
            "minItems": 0,
            "type": "array",
            "x-coralogix-collection": "set"
          },
          "id": {
            "maxLength": 128,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "Unique identifier."
          },
          "name": {
            "maxLength": 255,
            "minLength": 1,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "The name of the set. Unique among the sets of the company."
          }
        },
        "description": "An output set of rule groups.",
        "externalDocs": {
          "description": "Find out more about recording rules",
          "url": "https://coralogix.com/docs/user-guides/data-transformation/metric-rules/recording-rules/"
        }
      },
      "RuleGroupSetListing": {
        "title": "Rule Group Set Listing",
        "required": [
          "sets"
        ],
        "type": "object",
        "properties": {
          "sets": {
            "maxItems": 1000,
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/OutRuleGroupSet"
            },
            "description": "The sets."
          }
        },
        "description": "A listing of rule group sets.",
        "externalDocs": {
          "description": "Find out more about recording rules",
          "url": "https://coralogix.com/docs/user-guides/data-transformation/metric-rules/recording-rules/"
        }
      },
      "events.v3.FilterMatcher": {
        "enum": [
          "FILTER_MATCHER_TEXT_OR_UNSPECIFIED",
          "FILTER_MATCHER_REGEXP"
        ],
        "type": "string"
      },
      "v3.FilterOperator": {
        "enum": [
          "FILTER_OPERATOR_AND_OR_UNSPECIFIED",
          "FILTER_OPERATOR_OR"
