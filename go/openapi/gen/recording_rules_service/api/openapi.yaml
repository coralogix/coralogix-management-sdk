  "paths": {
    "/recording-rules/recording-rules/v1": {
      "get": {
        "description": "Returns all recording rule groups for the team.",
        "operationId": "RuleGroupSets_List",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RuleGroupSetListing"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "List Recording Rules",
        "tags": [
          "Recording Rules Service"
        ]
      },
      "post": {
        "description": "Creates a set of recording rule groups and returns its id. A set name that another set has answers 400.",
        "operationId": "RuleGroupSets_Create",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "A set of rule groups to create.",
                "properties": {
                  "groups": {
                    "description": "The rule groups of the set. The service rejects an empty list. Group names are unique within the set. The server does not keep the order of the groups.",
                    "items": {
                      "$ref": "#/components/schemas/InRuleGroup"
                    },
                    "maxItems": 1000,
                    "minItems": 1,
                    "type": "array",
                    "x-coralogix-collection": "set"
                  },
                  "name": {
                    "description": "The name of the set. Unique among the sets of the company. When omitted, the server uses the id of the set.",
                    "maxLength": 255,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string",
                    "x-coralogix-presence": true
                  }
                },
                "required": [
                  "groups"
                ],
                "title": "Create Rule Group Set",
                "type": "object"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CreateRuleGroupSetResult"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Create Recording Rules",
        "tags": [
          "Recording Rules Service"
        ]
      }
    },
    "/recording-rules/recording-rules/v1/{id}": {
      "get": {
        "description": "Returns the set with the given id. An id that does not exist answers 404.",
        "operationId": "RuleGroupSets_Fetch",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OutRuleGroupSet"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
