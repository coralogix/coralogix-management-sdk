{
  "openapi": "3.1.0",
  "info": {
    "title": "",
    "version": "1.0.0"
  },
  "paths": {
    "/aaa/api-keys/v3": {
      "get": {
        "description": "Retrieve all API keys for team members.",
        "operationId": "ApiKeysAdminService_GetTeamMembersApiKeys",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/GetTeamMembersApiKeysResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Get Team Members API Keys",
        "tags": [
          "API Keys Admin Service"
        ]
      },
      "post": {
        "description": "Creates a new API key for the authenticated team.",
        "operationId": "ApiKeysService_CreateApiKey",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "This data structure is used to create an API key.",
                "properties": {
                  "accessPolicy": {
                    "description": "JSON string representing the access policy for this API key. Defines granular permissions for users and groups.",
                    "examples": [
                      "{\"version\":\"2025-01-01\",\"default\":{\"permissions\":{\"data-ingest-api-keys:ReadAccessPolicy\":\"grant\",\"data-ingest-api-keys:Manage\":\"deny\",\"data-ingest-api-keys:UpdateAccessPolicy\":\"deny\",\"data-ingest-api-keys:ReadConfig\":\"grant\"}},\"rules\":[]}"
                    ],
                    "minLength": 0,
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "hashed": {
                    "description": "Whether the value is stored as a one-way hash.",
                    "examples": [
                      true
                    ],
                    "type": "boolean"
                  },
                  "keyPermissions": {
                    "$ref": "#/components/schemas/CreateApiKeyRequest.KeyPermissions"
                  },
                  "name": {
                    "description": "Display name.",
                    "examples": [
                      "my_api_key"
                    ],
                    "minLength": 0,
                    "type": "string"
                  },
                  "owner": {
                    "$ref": "#/components/schemas/Owner"
                  }
                },
                "title": "Create Api Key Request",
                "type": "object"
              }
            }
          }
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CreateApiKeyResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Create API Key",
        "tags": [
          "API Keys Service"
        ]
      }
    },
    "/aaa/api-keys/v3/all/delete": {
      "post": {
        "description": "Delete specified API keys.",
        "operationId": "ApiKeysAdminService_DeleteApiKeys",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "This data structure is used to delete specified API keys.",
                "properties": {
                  "keyIds": {
                    "description": "List of API key IDs to delete.",
                    "items": {
                      "description": "List of API key IDs to delete.",
                      "examples": [
                        "key_abc123"
                      ],
                      "minLength": 0,
                      "type": "string"
                    },
                    "minItems": 0,
                    "type": "array"
                  }
                },
                "title": "Delete API Keys Request",
                "type": "object"
              }
            }
          }
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DeleteApiKeysResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Delete API Keys",
        "tags": [
          "API Keys Admin Service"
        ]
      }
    },
    "/aaa/api-keys/v3/all/status": {
      "post": {
        "description": "Activate or deactivate specified API keys.",
        "operationId": "ApiKeysAdminService_UpdateApiKeysStatus",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "This data structure is used to update the status of specified API keys.",
                "properties": {
                  "updates": {
                    "description": "The updates.",
                    "items": {
                      "$ref": "#/components/schemas/ApiKeyStatusUpdate"
                    },
                    "minItems": 0,
                    "type": "array"
                  }
                },
                "title": "Update API Keys Status Request",
                "type": "object"
              }
            }
          }
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UpdateApiKeysStatusResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Update API Keys Status",
        "tags": [
          "API Keys Admin Service"
        ]
      }
    }
  },
  "components": {
    "schemas": {
      "ApiKeyOwner": {
        "title": "API Key Owner",
        "type": "object",
        "properties": {
          "user": {
            "$ref": "#/components/schemas/ApiKeyUserOwner"
          }
        },
        "description": "This data structure represents the owner of an API key.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "ApiKeyStatusUpdate": {
        "title": "API Key Status Update",
        "type": "object",
        "properties": {
          "active": {
            "type": "boolean",
            "description": "Whether this resource is active.",
            "examples": [
              true
            ]
          },
          "keyId": {
            "minLength": 0,
            "type": "string",
            "description": "Key identifier.",
            "examples": [
              "key_abc123"
            ]
          }
        },
        "description": "This data structure represents the status update for a specific API key.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "ApiKeySummary": {
        "title": "API Key Summary",
        "type": "object",
        "properties": {
          "apiKey": {
            "$ref": "#/components/schemas/v3.ApiKey"
          },
          "permissions": {
            "minItems": 0,
            "type": "array",
            "items": {
              "minLength": 0,
              "type": "string",
              "description": "List of permissions.",
              "examples": [
                "logs:read"
              ]
            },
            "description": "List of permissions."
          },
          "presets": {
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/PermissionsPreset"
            },
            "description": "List of permission presets."
          }
        },
        "description": "This data structure represents summary about an API key including its permissions.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "ApiKeyUserOwner": {
        "title": "API Key User Owner",
        "type": "object",
        "properties": {
          "userEmail": {
            "minLength": 0,
            "type": "string",
            "description": "The user email.",
            "examples": [
              "test@example.com"
            ]
          },
          "userId": {
            "minLength": 0,
            "type": "string",
            "description": "The user id.",
            "examples": [
              "user_123"
            ]
          }
        },
        "description": "This data structure represents the user owner of an API key.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "CreateApiKeyRequest.KeyPermissions": {
        "title": "Key Permissions",
        "type": "object",
        "properties": {
          "permissions": {
            "minItems": 0,
            "type": "array",
            "items": {
              "minLength": 0,
              "type": "string",
              "description": "List of permissions.",
              "examples": [
                "read_logs"
              ]
            },
            "description": "List of permissions."
          },
          "presets": {
            "minItems": 0,
            "type": "array",
            "items": {
              "minLength": 0,
              "type": "string",
              "description": "List of permission presets.",
              "examples": [
                "my_preset"
              ]
            },
            "description": "List of permission presets."
          }
        },
        "description": "This data structure allows to specify loose permissions and permission presets for an API key.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "CreateApiKeyResponse": {
        "title": "Create Api Key Response",
        "type": "object",
        "properties": {
          "keyId": {
            "minLength": 0,
            "type": "string",
            "description": "Key identifier.",
            "examples": [
              "my_key_id"
            ]
          },
          "name": {
            "minLength": 0,
            "type": "string",
            "description": "Display name.",
            "examples": [
              "my_api_key"
            ]
          },
          "value": {
            "minLength": 0,
            "type": "string",
            "description": "The value.",
            "examples": [
              "my_api_key_value"
            ]
          }
        },
        "description": "This data structure is the response obtained when creating an API key.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "DeleteApiKeysResponse": {
        "title": "Delete API Keys Response",
        "type": "object",
        "additionalProperties": false,
        "description": "This data structure is the response obtained after deleting API keys.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "Error": {
        "type": "object",
        "properties": {
          "code": {
            "maximum": 599,
            "minimum": 100,
            "type": "integer",
            "description": "HTTP status code of the error (for example 400, 404, 500).",
            "format": "int32"
          },
          "message": {
            "maxLength": 4096,
            "minLength": 0,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "Human-readable description of the error."
          }
        },
        "description": "Standard error response body returned for a failed request."
      },
      "FilterPathAndValues": {
        "title": "FilterPathAndValues",
        "required": [
          "path"
        ],
        "type": "object",
        "oneOf": [
          {
            "required": [
              "multipleValues"
            ],
            "type": "object"
          },
          {
            "required": [
              "filters"
            ],
            "type": "object"
          }
        ],
        "properties": {
          "filters": {
            "allOf": [
              {
                "$ref": "#/components/schemas/Filters"
              }
            ],
            "description": "The filters."
          },
          "multipleValues": {
            "$ref": "#/components/schemas/MultipleValues"
          },
          "path": {
            "examples": [
              "test"
            ],
            "minLength": 0,
            "type": "string",
            "x-coralogix-presence": true
          }
        },
        "description": "This data structure represents a filter path and values"
      },
      "Filters": {
        "title": "Filters",
        "required": [
          "pathAndValues"
        ],
        "type": "object",
        "properties": {
          "operator": {
            "allOf": [
              {
                "$ref": "#/components/schemas/v3.FilterOperator"
              }
            ],
            "examples": [
              "FILTER_OPERATOR_OR"
            ]
          },
          "pathAndValues": {
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/FilterPathAndValues"
            }
          }
        },
        "description": "This data structure represents a filter"
      },
      "GetTeamMembersApiKeysResponse": {
        "title": "Get Team Members API Keys Response",
        "type": "object",
        "properties": {
          "keys": {
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ApiKeySummary"
            },
            "description": "The keys."
          }
        },
        "description": "This data structure is the response obtained when retrieving team members API keys.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "MultipleValues": {
        "type": "object",
        "properties": {
          "matcher": {
            "$ref": "#/components/schemas/events.v3.FilterMatcher"
          },
          "values": {
            "minItems": 0,
            "type": "array",
            "items": {
              "minLength": 0,
              "type": "string"
            }
          }
        }
      },
      "Owner": {
        "type": "object",
        "oneOf": [
          {
            "required": [
              "userId"
            ],
            "type": "object"
          },
          {
            "required": [
              "teamId"
            ],
            "type": "object"
          },
          {
            "required": [
              "organisationId"
            ],
            "type": "object"
          },
          {
            "type": "object",
            "not": {
              "anyOf": [
                {
                  "required": [
                    "userId"
                  ],
                  "type": "object"
                },
                {
                  "required": [
                    "teamId"
                  ],
                  "type": "object"
                },
                {
                  "required": [
                    "organisationId"
                  ],
                  "type": "object"
                }
              ]
            }
          }
        ],
        "properties": {
          "organisationId": {
            "minLength": 0,
            "type": "string",
            "description": "Organisation identifier of the API key owner."
          },
          "teamId": {
            "minimum": 0,
            "type": "integer",
            "description": "The team id.",
            "format": "int64"
          },
          "userId": {
            "minLength": 0,
            "type": "string",
            "description": "User identifier of the API key owner."
          }
        },
        "description": "Owner."
      },
      "PermissionsPreset": {
        "title": "Permissions Preset",
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "description": "Unique identifier.",
            "format": "int32",
            "examples": [
              1
            ]
          },
          "name": {
            "minLength": 0,
            "type": "string",
            "description": "Display name.",
            "examples": [
              "my_preset"
            ]
          },
          "permissions": {
            "minItems": 0,
            "type": "array",
            "items": {
              "minLength": 0,
              "type": "string",
              "description": "List of permissions.",
              "examples": [
                "logs:read"
              ]
            },
            "description": "List of permissions."
          }
        },
        "description": "This data structure represents a preset set of permissions on an API key.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "UpdateApiKeysStatusResponse": {
        "title": "Update API Keys Status Response",
        "type": "object",
        "additionalProperties": false,
        "description": "This data structure is the response obtained after updating API keys status.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "events.v3.FilterMatcher": {
        "enum": [
          "FILTER_MATCHER_TEXT_OR_UNSPECIFIED",
          "FILTER_MATCHER_REGEXP"
        ],
        "type": "string"
      },
      "v3.ApiKey": {
        "title": "API Key",
        "type": "object",
        "properties": {
          "createdAt": {
            "description": "The timestamp when the API key was created.",
            "format": "date-time",
            "minLength": 0,
            "type": "string",
            "x-coralogix-presence": true
          },
          "id": {
            "minLength": 0,
            "type": "string",
            "description": "Unique identifier.",
            "examples": [
              "key_abc123"
            ]
          },
          "isActive": {
            "type": "boolean",
            "description": "Whether this resource is active."
          },
          "keyName": {
            "minLength": 0,
            "type": "string",
            "description": "The key name.",
            "examples": [
              "my_api_key"
            ]
          },
          "lastActivated": {
            "description": "The timestamp when the API key was last activated.",
            "format": "date-time",
            "minLength": 0,
            "type": "string",
            "x-coralogix-presence": true
          },
          "owner": {
            "$ref": "#/components/schemas/ApiKeyOwner"
          }
        },
        "description": "This data structure represents an API key with its metadata.",
        "externalDocs": {
          "description": "Find out more about api keys",
          "url": "https://coralogix.com/docs/user-guides/account-management/api-keys/api-keys/"
        }
      },
      "v3.FilterOperator": {
        "enum": [
          "FILTER_OPERATOR_AND_OR_UNSPECIFIED",
          "FILTER_OPERATOR_OR"
        ],
        "type": "string",
        "description": "Filter operator."
      }
    }
  }
}