          "id": {
            "minLength": 0,
            "type": "string",
            "description": "Unique identifier.",
            "examples": [
              "60c82be2-413f-4b8e-8201-7f5c51e2ef2b"
            ]
          },
          "teamId": {
            "type": "integer",
            "description": "Team identifier.",
            "format": "int32",
            "examples": [
              1234
            ]
