        "externalDocs": {
          "url": ""
        }
      },
      "Error": {
        "type": "object",
        "properties": {
          "code": {
            "maximum": 599,
            "minimum": 100,
            "type": "integer",
            "description": "HTTP status code of the error (for example 400, 404, 500).",
            "format": "int32"
          },
          "message": {
            "maxLength": 4096,
            "minLength": 0,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "Human-readable description of the error."
          }
        },
        "description": "Standard error response body returned for a failed request."
      },
      "FilterPathAndValues": {
        "title": "FilterPathAndValues",
        "required": [
          "path"
        ],
        "type": "object",
        "oneOf": [
          {
            "required": [
              "multipleValues"
            ],
            "type": "object"
          },
          {
            "required": [
              "filters"
            ],
            "type": "object"
          }
        ],
        "properties": {
          "filters": {
            "allOf": [
              {
                "$ref": "#/components/schemas/Filters"
              }
            ],
            "description": "The filters."
          },
          "multipleValues": {
            "$ref": "#/components/schemas/MultipleValues"
          },
          "path": {
            "minLength": 0,
            "type": "string",
            "examples": [
              "test"
