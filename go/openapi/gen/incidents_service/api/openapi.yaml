{
  "openapi": "3.1.0",
  "info": {
    "title": "",
    "version": "1.0.0"
  },
  "paths": {
    "/incidents/aggregations/v1": {
      "get": {
        "description": "Retrieve aggregated incident data with support for grouping and filtering.\n\nRequires the following permissions:\n- `incidents:read`",
        "operationId": "IncidentsService_ListIncidentAggregations",
        "parameters": [
          {
            "description": "Filter for incidents",
            "in": "query",
            "name": "filter",
            "required": false,
            "schema": {
              "description": "Filter configuration for incidents",
              "properties": {
                "applicationName": {
                  "description": "Filter by application names",
                  "items": {
                    "description": "Filter by application names",
                    "maxLength": 256,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string"
                  },
                  "maxItems": 1000,
                  "minItems": 0,
                  "type": "array"
                },
                "assignee": {
                  "description": "Filter by assignee",
                  "items": {
                    "description": "Filter by assignee",
                    "maxLength": 300,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string"
                  },
                  "maxItems": 1000,
                  "minItems": 0,
                  "type": "array"
                },
                "contextualLabels": {
                  "additionalProperties": {
                    "$ref": "#/components/schemas/ContextualLabelValues"
                  },
                  "description": "Filter by contextual labels",
                  "type": "object"
                },
                "createdAtRange": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/v1.TimeRange"
                    }
                  ],
                  "description": "Filters all incidents created at the given time range"
                },
                "displayLabels": {
                  "additionalProperties": {
                    "$ref": "#/components/schemas/DisplayLabelValues"
                  },
                  "description": "Filter by display labels",
                  "type": "object"
                },
                "endTime": {
                  "deprecated": true,
                  "description": "Filters all incidents that were open in the given timeframe end time (deprecated, use incident_open_range instead)",
                  "format": "date-time",
                  "minLength": 0,
                  "type": "string"
                },
                "incidentDurationRange": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/v1.TimeRange"
                    }
                  ],
                  "description": "Filters all active) incidents with the given duration range"
                },
                "isMuted": {
                  "description": "Indicates if the incident is muted",
                  "type": "boolean"
                },
                "metaLabels": {
                  "description": "Filters all incidents with the given meta labels",
                  "items": {
                    "description": "Meta label.",
                    "properties": {
                      "key": {
                        "description": "The key.",
                        "examples": [
                          "key"
                        ],
                        "maxLength": 255,
                        "minLength": 1,
                        "pattern": "^[\\s\\S]*$",
                        "type": "string"
                      },
                      "value": {
                        "description": "The value.",
                        "examples": [
                          "value"
                        ],
                        "maxLength": 255,
                        "minLength": 1,
                        "pattern": "^[\\s\\S]*$",
                        "type": "string"
                      }
                    },
                    "title": "Incident meta label",
                    "type": "object"
                  },
                  "maxItems": 1000,
                  "minItems": 0,
                  "type": "array"
                },
                "metaLabelsOp": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/v1.FilterOperator"
                    }
                  ],
                  "description": "The operator for the meta labels filter"
                },
                "searchQuery": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/IncidentSearchQuery"
                    }
                  ],
                  "description": "Search query for incidents"
                },
                "severity": {
                  "description": "Filter by incident severity",
                  "items": {
                    "$ref": "#/components/schemas/IncidentSeverity"
                  },
                  "maxItems": 1000,
                  "minItems": 0,
                  "type": "array"
                },
                "startTime": {
                  "deprecated": true,
                  "description": "Filters all incidents that were open in the given timeframe start time (deprecated, use incident_open_range instead)",
                  "format": "date-time",
                  "minLength": 0,
                  "type": "string"
                },
                "state": {
                  "description": "Filter by incident state",
                  "items": {
                    "$ref": "#/components/schemas/IncidentState"
                  },
                  "maxItems": 1000,
                  "minItems": 0,
                  "type": "array"
                },
                "status": {
                  "description": "Filter by incident status",
                  "items": {
                    "$ref": "#/components/schemas/IncidentStatus"
                  },
                  "maxItems": 1000,
                  "minItems": 0,
                  "type": "array"
                },
                "subsystemName": {
                  "description": "Filter by subsystem names",
                  "items": {
                    "description": "Filter by subsystem names",
                    "maxLength": 256,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string"
                  },
                  "maxItems": 1000,
                  "minItems": 0,
                  "type": "array"
                }
              },
              "title": "Incident query filter",
              "type": "object"
            }
          },
          {
            "description": "Group by fields for aggregation",
            "in": "query",
            "name": "group_bys",
            "required": false,
            "schema": {
              "description": "Group by fields for aggregation",
              "items": {
                "oneOf": [
                  {
                    "required": [
                      "incidentField"
                    ],
                    "type": "object"
                  },
                  {
                    "required": [
                      "contextualLabel"
                    ],
                    "type": "object"
                  }
                ],
                "properties": {
                  "contextualLabel": {
                    "description": "The contextual label to group by.",
                    "maxLength": 256,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string"
                  },
                  "incidentField": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/IncidentFields"
                      }
                    ],
                    "description": "The field to group by",
                    "examples": [
                      "INCIDENTS_FIELDS_ID"
                    ]
                  },
                  "orderByDirection": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/v1.OrderByDirection"
                      }
                    ],
                    "description": "The order by direction.",
                    "examples": [
                      "ORDER_BY_DIRECTION_ASC"
                    ]
                  }
                },
                "title": "Incident group by",
                "type": "object"
              },
              "maxItems": 100,
              "minItems": 0,
              "type": "array"
            }
          },
          {
            "description": "Pagination parameters",
            "in": "query",
            "name": "pagination",
            "required": false,
            "schema": {
              "description": "Pagination parameters for list requests",
              "properties": {
                "pageSize": {
                  "description": "Number of items to return per page.",
                  "examples": [
                    10
                  ],
                  "format": "int64",
                  "maximum": 10000,
                  "minimum": 1,
                  "type": "integer"
                },
                "pageToken": {
                  "description": "Token for the next page of results",
                  "examples": [
                    "next_page_token"
                  ],
                  "maxLength": 4096,
                  "minLength": 1,
                  "pattern": "^[\\s\\S]*$",
                  "type": "string"
                }
              },
              "required": [
                "pageSize"
              ],
              "title": "Pagination request",
              "type": "object"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListIncidentAggregationsResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Get incident aggregations",
        "tags": [
          "Incidents service"
        ],
        "x-coralogixPermissions": [
          "incidents:read"
        ]
      }
    },
    "/incidents/events/v1": {
      "get": {
        "description": "List incident events with support for filtering, pagination, and ordering. This operation accepts a page size of at most 1000 (it defaults to 100 when pageSize is omitted) and rejects larger values, even though the shared pagination schema documents a maximum of 10000.\n\nRequires the following permissions:\n- `incidents:read`",
        "operationId": "IncidentsService_ListIncidentEvents",
        "parameters": [
          {
            "description": "Filter for incident events",
            "in": "query",
            "name": "filter",
            "required": false,
            "schema": {
              "description": "Filter configuration for incident events",
              "properties": {
                "contextualLabels": {
                  "additionalProperties": {
                    "$ref": "#/components/schemas/ContextualLabelValues"
                  },
                  "description": "The contextual labels of the incident",
                  "type": "object"
                },
                "displayLabels": {
                  "additionalProperties": {
                    "$ref": "#/components/schemas/DisplayLabelValues"
                  },
                  "description": "The display labels of the incident",
                  "type": "object"
                },
                "isMuted": {
                  "description": "Indicates if the incident is muted",
                  "type": "boolean"
                },
                "labels": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/LabelsFilter"
                    }
                  ],
                  "description": "The labels of the incident"
                },
                "name": {
                  "description": "The name of the incident",
                  "maxLength": 500,
                  "minLength": 1,
                  "pattern": "^[\\s\\S]*$",
                  "type": "string"
                },
                "severity": {
                  "description": "The severity of the incident",
                  "items": {
                    "$ref": "#/components/schemas/IncidentSeverity"
                  },
                  "maxItems": 1000,
                  "minItems": 0,
                  "type": "array"
                },
                "status": {
                  "description": "The status of the incident",
                  "items": {
                    "$ref": "#/components/schemas/IncidentStatus"
                  },
                  "maxItems": 1000,
                  "minItems": 0,
                  "type": "array"
                },
                "timestamp": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/v1.TimeRange"
                    }
                  ],
                  "description": "The time range of the incident"
                }
              },
              "title": "Incident event query filter",
              "type": "object"
            }
          },
          {
            "description": "Pagination parameters. This request accepts at most 1000 items per page, and defaults to 100 when pageSize is omitted; the shared maximum of 10000 does not apply here.",
            "in": "query",
            "name": "pagination",
            "required": false,
            "schema": {
              "description": "Pagination parameters for list requests",
              "properties": {
                "pageSize": {
                  "description": "Number of items to return per page.",
                  "examples": [
                    10
                  ],
                  "format": "int64",
                  "maximum": 10000,
                  "minimum": 1,
                  "type": "integer"
                },
                "pageToken": {
                  "description": "Token for the next page of results",
                  "examples": [
                    "next_page_token"
                  ],
                  "maxLength": 4096,
                  "minLength": 1,
                  "pattern": "^[\\s\\S]*$",
                  "type": "string"
                }
              },
              "required": [
                "pageSize"
              ],
              "title": "Pagination request",
              "type": "object"
            }
          },
          {
            "description": "Order by fields for incident events",
            "in": "query",
            "name": "order_by",
            "required": false,
            "schema": {
              "properties": {
                "direction": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/v1.OrderByDirection"
                    }
                  ],
                  "description": "Sort direction (ascending or descending)",
                  "examples": [
                    "ORDER_BY_DIRECTION_ASC"
                  ]
                },
                "field": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/IncidentEventOrderByFieldType"
                    }
                  ],
                  "description": "Field to order by",
                  "examples": [
                    "INCIDENT_EVENT_ORDER_BY_FIELD_TYPE_TIMESTAMP_OR_UNSPECIFIED"
                  ]
                }
              },
              "title": "List incident events order by request",
              "type": "object"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListIncidentEventsResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "List incident events with filters",
        "tags": [
          "Incidents service"
        ],
        "x-coralogixPermissions": [
          "incidents:read"
        ]
      }
    },
