                    "minimum": 0,
                    "type": "integer"
                  },
                  "s3": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/S3Config"
                      }
                    ],
                    "description": "AWS S3 storage configuration."
                  }
                },
                "title": "Update Tenant Request",
                "type": "object"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
