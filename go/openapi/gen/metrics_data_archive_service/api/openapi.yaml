      "put": {
        "description": "Updates the metrics storage configuration.",
        "operationId": "MetricsConfiguratorPublicService_Update",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "This data structure is used to update the configuration of a tenant.",
                "oneOf": [
                  {
                    "required": [
                      "ibm"
                    ],
                    "type": "object"
                  },
                  {
                    "required": [
                      "s3"
                    ],
                    "type": "object"
                  },
                  {
                    "required": [
                      "gcs"
                    ],
                    "type": "object"
                  },
                  {
                    "not": {
                      "anyOf": [
                        {
                          "required": [
                            "ibm"
                          ],
                          "type": "object"
                        },
                        {
                          "required": [
                            "s3"
                          ],
                          "type": "object"
                        },
                        {
                          "required": [
                            "gcs"
                          ],
                          "type": "object"
                        }
                      ]
