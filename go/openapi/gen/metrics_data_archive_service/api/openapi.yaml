  "components": {
    "schemas": {
      "Error": {
        "type": "object",
        "properties": {
          "code": {
            "maximum": 599,
            "minimum": 100,
            "type": "integer",
            "description": "HTTP status code of the error (for example 400, 404, 500).",
            "format": "int32"
          },
          "message": {
            "maxLength": 4096,
            "minLength": 0,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "Human-readable description of the error."
          }
        },
        "description": "Standard error response body returned for a failed request."
      },
      "FilterPathAndValues": {
        "title": "FilterPathAndValues",
        "required": [
          "path"
        ],
        "type": "object",
        "oneOf": [
          {
            "required": [
              "multipleValues"
            ],
            "type": "object"
          },
          {
            "required": [
              "filters"
            ],
            "type": "object"
          }
        ],
        "properties": {
          "filters": {
            "allOf": [
              {
                "$ref": "#/components/schemas/Filters"
              }
            ],
            "description": "The filters."
          },
          "multipleValues": {
            "$ref": "#/components/schemas/MultipleValues"
          },
          "path": {
            "minLength": 0,
            "type": "string",
            "examples": [
              "test"
            ]
          }
        },
        "description": "This data structure represents a filter path and values",
        "externalDocs": {
          "url": ""
        }
      },
      "Filters": {
        "title": "Filters",
        "required": [
          "pathAndValues"
        ],
        "type": "object",
        "properties": {
          "operator": {
            "allOf": [
              {
                "$ref": "#/components/schemas/v3.FilterOperator"
              }
            ],
            "examples": [
              "FILTER_OPERATOR_OR"
            ]
          },
          "pathAndValues": {
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/FilterPathAndValues"
            }
          }
        },
        "description": "This data structure represents a filter",
        "externalDocs": {
          "url": ""
        }
      },
      "GcsConfig": {
        "title": "GCS Configuration",
        "type": "object",
        "properties": {
          "bucket": {
            "minLength": 0,
            "type": "string",
            "description": "Bucket name."
          }
        },
        "description": "This data structure represents the GCS configuration for a tenant.",
        "externalDocs": {
          "description": "Find out more about metrics cost optimization",
          "url": "https://coralogix.com/docs/user-guides/account-management/payment-and-billing/metrics-optimization/"
        }
      },
      "GetTenantConfigResponseV2": {
        "type": "object",
        "properties": {
          "tenantConfig": {
            "$ref": "#/components/schemas/TenantConfigV2"
          }
        },
        "description": "Response containing the current metrics tenant configuration.",
        "externalDocs": {
          "url": ""
        }
      },
      "IbmConfigV2": {
        "title": "IBM Bucket Configuration",
        "type": "object",
        "properties": {
          "crn": {
            "minLength": 0,
            "type": "string",
            "description": "The crn.",
            "examples": [
              "crn:v1:bluemix:public:cloud-object-storage:global:a/1234567890abcdef1234567890abcdef:12345678-1234-1234-1234-1234567890ab::"
            ]
          },
          "endpoint": {
            "minLength": 0,
            "type": "string",
            "description": "Endpoint.",
            "examples": [
              "s3.us-south.cloud-object-storage.appdomain.cloud"
            ]
          },
          "serviceCrn": {
            "minLength": 0,
            "type": "string",
            "description": "The service crn.",
            "examples": [
              "crn:v1:bluemix:public:cloud-object-storage:global:a/1234567890abcdef1234567890abcdef:12345678-1234-1234-1234-1234567890ab::"
            ]
          }
        },
        "description": "This data structure is used to configure an IBM bucket.",
        "externalDocs": {
          "description": "Find out more about metrics cost optimization",
          "url": "https://coralogix.com/docs/user-guides/account-management/payment-and-billing/metrics-optimization/"
        }
      },
      "MultipleValues": {
        "type": "object",
        "properties": {
          "matcher": {
            "$ref": "#/components/schemas/events.v3.FilterMatcher"
          },
          "values": {
            "minItems": 0,
            "type": "array",
            "items": {
              "minLength": 0,
              "type": "string"
            }
          }
        }
      },
      "RetentionPolicyRequest": {
        "title": "Retenion Policy Request",
        "type": "object",
        "properties": {
          "fiveMinutesResolution": {
            "minimum": 0,
            "type": "integer",
            "description": "The five minutes resolution.",
            "format": "int64",
            "examples": [
              2
            ]
          },
          "oneHourResolution": {
            "minimum": 0,
            "type": "integer",
            "description": "The one hour resolution.",
            "format": "int64",
            "examples": [
              3
            ]
          },
          "rawResolution": {
            "minimum": 0,
            "type": "integer",
            "description": "The raw resolution.",
            "format": "int64",
            "examples": [
              1
            ]
          }
        },
        "description": "This data structure is used to set the retention policy for a tenant.",
        "externalDocs": {
          "description": "Find out more about metrics cost optimization",
          "url": "https://coralogix.com/docs/user-guides/account-management/payment-and-billing/metrics-optimization/"
        }
      },
      "S3Config": {
        "title": "S3 Configuration",
        "type": "object",
        "properties": {
          "bucket": {
            "minLength": 0,
            "type": "string",
            "description": "Bucket name."
          },
          "region": {
            "minLength": 0,
            "type": "string",
            "description": "Region."
          }
        },
        "description": "This data structure represents the S3 configuration for a tenant.",
        "externalDocs": {
          "description": "Find out more about metrics cost optimization",
          "url": "https://coralogix.com/docs/user-guides/account-management/payment-and-billing/metrics-optimization/"
        }
      },
      "TenantConfigV2": {
        "type": "object",
        "oneOf": [
          {
            "required": [
              "ibm"
            ],
            "type": "object"
          },
          {
            "required": [
              "s3"
            ],
            "type": "object"
          },
          {
            "required": [
              "gcs"
            ],
            "type": "object"
          },
          {
            "type": "object",
            "not": {
              "anyOf": [
                {
                  "required": [
                    "ibm"
                  ],
                  "type": "object"
                },
                {
                  "required": [
                    "s3"
                  ],
                  "type": "object"
                },
                {
                  "required": [
                    "gcs"
                  ],
                  "type": "object"
                }
              ]
            }
          }
        ],
        "properties": {
          "disabled": {
            "type": "boolean",
            "description": "Whether metrics archiving is disabled for this tenant."
          },
          "gcs": {
            "allOf": [
              {
                "$ref": "#/components/schemas/GcsConfig"
              }
            ],
            "description": "Google Cloud Storage configuration."
          },
          "ibm": {
            "allOf": [
              {
                "$ref": "#/components/schemas/IbmConfigV2"
              }
            ],
            "description": "IBM Cloud Object Storage configuration."
          },
          "prefix": {
            "minLength": 0,
            "type": "string",
            "description": "Storage path prefix applied to all archived objects."
          },
          "retentionPolicy": {
            "$ref": "#/components/schemas/RetentionPolicyRequest"
          },
          "s3": {
            "allOf": [
              {
                "$ref": "#/components/schemas/S3Config"
              }
            ],
            "description": "AWS S3 storage configuration."
          },
          "tenantId": {
            "minimum": 0,
            "type": "integer",
            "description": "Tenant identifier.",
            "format": "int64"
          }
        },
        "description": "Tenant config v2.",
        "externalDocs": {
          "url": ""
        }
      },
      "events.v3.FilterMatcher": {
        "enum": [
          "FILTER_MATCHER_TEXT_OR_UNSPECIFIED",
          "FILTER_MATCHER_REGEXP"
        ],
        "type": "string"
      },
      "v3.FilterOperator": {
        "enum": [
          "FILTER_OPERATOR_AND_OR_UNSPECIFIED",
          "FILTER_OPERATOR_OR"
        ],
        "type": "string",
        "description": "Filter operator."
      }
    }
  }
}