          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Configure Tenant",
        "tags": [
          "Metrics Data Archive Service"
        ]
      }
    },
