      "patch": {
        "description": "Updates the fields listed in update_mask. Other fields are unchanged. A listed field that is omitted from the body is cleared or reset to its default. The last write wins, and version increases by 1. Returns the stored funnel. Returns 412 (FAILED_PRECONDITION) with \"Product Analytics is not enabled for this team. A team admin can enable it in Coralogix.\" when Product Analytics is off for the team.\n\nRequires the following permissions:\n- `product-analytics:Manage`",
        "operationId": "FunnelsService_UpdateSavedFunnel",
        "parameters": [
          {
            "description": "Comma-separated JSON paths of the fields to update: name, definition, filters, timeRange, breakdown. snake_case names are also accepted. definition is replaced as a whole. A listed field that is omitted from the body is cleared: breakdown is removed and filters becomes empty; name, definition, and timeRange cannot be cleared: listing one without a value returns 400. Nested paths such as definition.steps, unknown, immutable, and server-generated paths, and *, return 400. A listed field is replaced as a whole, a oneOf arm included.",
            "in": "query",
            "name": "update_mask",
            "required": true,
            "schema": {
              "description": "Comma-separated JSON paths of the fields to update: name, definition, filters, timeRange, breakdown. snake_case names are also accepted. definition is replaced as a whole. A listed field that is omitted from the body is cleared: breakdown is removed and filters becomes empty; name, definition, and timeRange cannot be cleared: listing one without a value returns 400. Nested paths such as definition.steps, unknown, immutable, and server-generated paths, and *, return 400. A listed field is replaced as a whole, a oneOf arm included.",
              "maxLength": 512,
              "minLength": 1,
              "pattern": "^[A-Za-z_][A-Za-z0-9_]*(,[A-Za-z_][A-Za-z0-9_]*)*$",
              "type": "string",
              "x-coralogix-presence": true
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "Funnel field values for an update. Only fields listed in update_mask are applied.",
                "properties": {
                  "breakdown": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/FunnelBreakdown"
                      }
                    ],
                    "description": "Breakdown of the funnel by a session dimension. Clearing it removes the breakdown."
                  },
                  "definition": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/FunnelDefinition"
                      }
                    ],
                    "description": "Mode, conversion window, and steps of the funnel. Replaces the whole definition: an omitted conversionWindow removes the window. Cannot be cleared."
                  },
                  "filters": {
                    "description": "Session filters applied to every step. Replaces the whole list.",
                    "items": {
                      "$ref": "#/components/schemas/ViewFilter"
                    },
                    "maxItems": 100,
                    "minItems": 0,
                    "type": "array",
                    "x-coralogix-collection": "set"
                  },
                  "name": {
                    "description": "Display name of the funnel. Must not be empty. Cannot be cleared.",
                    "maxLength": 1024,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string"
                  },
                  "timeRange": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/ViewTimeRange"
                      }
                    ],
                    "description": "Time range of the funnel. Cannot be cleared."
                  }
                },
                "type": "object"
              }
            }
          }
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "example": {
                  "appName": "web-shop",
                  "createdAt": "2026-11-16T10:00:00.000Z",
                  "definition": {
                    "conversionWindow": "3600s",
                    "mode": "FUNNEL_MODE_USERS",
                    "steps": [
                      {
                        "conditions": [
                          {
                            "view": {
                              "filters": [],
                              "name": {
                                "operator": "STRING_CONDITION_OPERATOR_EQUAL",
                                "values": [
                                  "/cart"
                                ]
                              }
                            }
                          }
                        ],
                        "label": "Viewed cart",
                        "stepId": "s1"
                      },
                      {
                        "conditions": [
                          {
                            "action": {
                              "element": {
                                "operator": "STRING_CONDITION_OPERATOR_EQUAL",
                                "values": [
                                  "pay-now-button"
                                ]
                              },
                              "event": {
                                "operator": "STRING_CONDITION_OPERATOR_EQUAL",
                                "values": [
                                  "click"
                                ]
                              },
                              "filters": []
                            }
                          }
                        ],
                        "label": "Clicked pay",
                        "stepId": "s2"
                      }
                    ]
                  },
                  "filters": [],
                  "id": "42",
                  "name": "Checkout funnel",
                  "owner": "dana@example.com",
                  "timeRange": {
                    "relativeMinutes": "1440"
                  },
                  "updatedAt": "2026-11-16T11:00:00.000Z",
                  "version": 2
                },
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/SavedFunnel"
                    }
                  ],
                  "description": "The updated funnel."
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "404": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Funnel not found"
          },
          "412": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Product Analytics is not enabled for this team"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Update funnel",
        "tags": [
          "Product Analytics Funnels Service"
        ],
        "x-coralogixPermissions": [
          "product-analytics:Manage"
        ]
      },
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "description": "Funnel ID, a decimal number.",
          "required": true,
          "schema": {
            "maxLength": 19,
            "minLength": 1,
            "pattern": "^[1-9][0-9]{0,18}$",
            "type": "string",
            "description": "Funnel ID, a decimal number."
          }
        }
      ]
    }
  },
  "components": {
    "schemas": {
      "ActionCondition": {
        "type": "object",
        "properties": {
          "element": {
            "allOf": [
              {
                "$ref": "#/components/schemas/StringCondition"
              }
            ],
            "description": "Condition on the target element. Requires event: element without event returns 400."
          },
          "event": {
            "allOf": [
              {
                "$ref": "#/components/schemas/StringCondition"
              }
            ],
            "description": "Condition on the event name. Absent matches any event."
          },
          "filters": {
            "description": "Filters that narrow this action condition only. Empty when not set.",
            "items": {
              "$ref": "#/components/schemas/ActionFilter"
            },
            "maxItems": 100,
            "minItems": 0,
            "type": "array",
            "x-coralogix-collection": "set"
          }
        },
        "description": "User action matcher of a funnel step, such as a click. With neither event nor element it matches any action, with event only a specific event, and with both that event on that element."
      },
      "ActionFilter": {
        "type": "object",
        "oneOf": [
          {
            "required": [
              "stringFilter"
            ],
            "type": "object"
          },
          {
            "required": [
              "numericFilter"
            ],
            "type": "object"
          },
          {
            "required": [
              "boolFilter"
            ],
            "type": "object"
          }
        ],
        "properties": {
          "boolFilter": {
            "allOf": [
              {
                "$ref": "#/components/schemas/BoolFilter"
              }
            ],
            "description": "A boolean field with the value the action must have."
          },
          "numericFilter": {
            "allOf": [
              {
                "$ref": "#/components/schemas/ActionNumericFilter"
              }
            ],
