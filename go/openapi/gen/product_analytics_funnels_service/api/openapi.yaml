{
  "openapi": "3.1.0",
  "info": {
    "title": "",
    "version": "1.0.0"
  },
  "paths": {
    "/product-analytics/funnels/v1": {
      "get": {
        "description": "Lists saved funnels, one page at a time, ordered by updatedAt descending, then by id descending. totalSize is the exact number of funnels that match app_names. Returns 412 (FAILED_PRECONDITION) with \"Product Analytics is not enabled for this team. A team admin can enable it in Coralogix.\" when Product Analytics is off for the team.\n\nRequires the following permissions:\n- `product-analytics:Read`",
        "operationId": "FunnelsService_ListSavedFunnels",
        "parameters": [
          {
            "description": "Maximum number of funnels to return. 0 uses the default of 20. A value above 500 is lowered to 500. A negative value returns 400.",
            "in": "query",
            "name": "page_size",
            "required": false,
            "schema": {
              "description": "Maximum number of funnels to return. 0 uses the default of 20. A value above 500 is lowered to 500. A negative value returns 400.",
              "format": "int32",
              "maximum": 2147483647,
              "minimum": 0,
              "type": "integer"
            }
          },
          {
            "description": "The nextPageToken of the previous response. Empty for the first page. The token is opaque, valid for 15 minutes, and tied to the app_names of the request that returned it. A token that is expired, from another query, or malformed returns 400: \"pageToken belongs to a different query or has expired. Send the request again without pageToken.\"",
            "in": "query",
            "name": "page_token",
            "required": false,
            "schema": {
              "description": "The nextPageToken of the previous response. Empty for the first page. The token is opaque, valid for 15 minutes, and tied to the app_names of the request that returned it. A token that is expired, from another query, or malformed returns 400: \"pageToken belongs to a different query or has expired. Send the request again without pageToken.\"",
              "maxLength": 1024,
              "minLength": 0,
              "pattern": "^[\\s\\S]*$",
              "type": "string"
            }
          },
          {
            "description": "Returns only funnels of these RUM applications. Repeat the parameter for each application, for example app_names=web-shop&app_names=docs. Omit to return funnels of every application.",
            "in": "query",
            "name": "app_names",
            "required": false,
            "schema": {
              "description": "Returns only funnels of these RUM applications. Repeat the parameter for each application, for example app_names=web-shop&app_names=docs. Omit to return funnels of every application.",
              "items": {
                "description": "Returns only funnels of these RUM applications. Repeat the parameter for each application, for example app_names=web-shop&app_names=docs. Omit to return funnels of every application.",
                "maxLength": 1024,
                "minLength": 1,
                "pattern": "^[\\s\\S]*$",
                "type": "string"
              },
              "maxItems": 100,
              "minItems": 0,
              "type": "array"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "example": {
                  "funnels": [
                    {
                      "appName": "web-shop",
                      "createdAt": "2026-11-16T10:00:00.000Z",
                      "definition": {
                        "conversionWindow": "3600s",
                        "mode": "FUNNEL_MODE_USERS",
                        "steps": [
                          {
                            "conditions": [
                              {
                                "view": {
                                  "filters": [],
                                  "name": {
                                    "operator": "STRING_CONDITION_OPERATOR_EQUAL",
                                    "values": [
                                      "/cart"
                                    ]
                                  }
                                }
                              }
                            ],
                            "label": "Viewed cart",
                            "stepId": "s1"
                          },
                          {
                            "conditions": [
                              {
                                "action": {
                                  "element": {
                                    "operator": "STRING_CONDITION_OPERATOR_EQUAL",
                                    "values": [
                                      "pay-now-button"
                                    ]
                                  },
                                  "event": {
                                    "operator": "STRING_CONDITION_OPERATOR_EQUAL",
                                    "values": [
                                      "click"
                                    ]
                                  },
                                  "filters": []
                                }
                              }
                            ],
                            "label": "Clicked pay",
                            "stepId": "s2"
                          }
                        ]
                      },
                      "filters": [],
                      "id": "42",
                      "name": "Checkout funnel",
                      "owner": "dana@example.com",
                      "timeRange": {
                        "relativeMinutes": "1440"
                      },
                      "updatedAt": "2026-11-16T10:00:00.000Z",
                      "version": 1
                    }
                  ],
                  "nextPageToken": "",
                  "totalSize": 1
                },
                "schema": {
                  "$ref": "#/components/schemas/ListSavedFunnelsResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "412": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Product Analytics is not enabled for this team"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "List funnels",
        "tags": [
          "Product Analytics Funnels Service"
        ],
        "x-coralogixPermissions": [
          "product-analytics:Read"
        ]
      },
      "post": {
        "description": "Creates a saved funnel and returns the stored funnel, with version 1. Returns 412 (FAILED_PRECONDITION) with \"Product Analytics is not enabled for this team. A team admin can enable it in Coralogix.\" when Product Analytics is off for the team.\n\nRequires the following permissions:\n- `product-analytics:Manage`",
        "operationId": "FunnelsService_CreateSavedFunnel",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "description": "Funnel field values for a create.",
                "properties": {
                  "appName": {
                    "description": "RUM application the funnel belongs to. Cannot be changed after creation.",
                    "maxLength": 1024,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string"
                  },
                  "breakdown": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/FunnelBreakdown"
                      }
                    ],
                    "description": "Breakdown of the funnel by a session dimension. Omit for no breakdown."
                  },
                  "definition": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/FunnelDefinition"
                      }
                    ],
                    "description": "Mode, conversion window, and steps of the funnel. Omit conversionWindow for no window."
                  },
                  "filters": {
                    "description": "Session filters applied to every step.",
                    "items": {
                      "$ref": "#/components/schemas/ViewFilter"
                    },
                    "maxItems": 100,
                    "minItems": 0,
                    "type": "array",
                    "x-coralogix-collection": "set"
                  },
                  "name": {
                    "description": "Display name of the funnel. Must not be empty. Does not have to be unique.",
                    "maxLength": 1024,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*$",
                    "type": "string"
                  },
                  "timeRange": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/ViewTimeRange"
                      }
                    ],
                    "description": "Time range of the funnel."
                  }
                },
                "required": [
                  "appName",
                  "name",
                  "definition",
                  "timeRange"
                ],
                "type": "object"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "example": {
                  "appName": "web-shop",
                  "createdAt": "2026-11-16T10:00:00.000Z",
                  "definition": {
                    "conversionWindow": "3600s",
                    "mode": "FUNNEL_MODE_USERS",
                    "steps": [
                      {
                        "conditions": [
                          {
                            "view": {
                              "filters": [],
                              "name": {
                                "operator": "STRING_CONDITION_OPERATOR_EQUAL",
                                "values": [
                                  "/cart"
                                ]
                              }
                            }
                          }
                        ],
                        "label": "Viewed cart",
                        "stepId": "s1"
                      },
                      {
                        "conditions": [
                          {
                            "action": {
                              "element": {
                                "operator": "STRING_CONDITION_OPERATOR_EQUAL",
                                "values": [
                                  "pay-now-button"
                                ]
                              },
                              "event": {
                                "operator": "STRING_CONDITION_OPERATOR_EQUAL",
                                "values": [
                                  "click"
                                ]
                              },
                              "filters": []
                            }
                          }
                        ],
                        "label": "Clicked pay",
                        "stepId": "s2"
                      }
                    ]
                  },
                  "filters": [],
                  "id": "42",
                  "name": "Checkout funnel",
                  "owner": "dana@example.com",
                  "timeRange": {
                    "relativeMinutes": "1440"
                  },
                  "updatedAt": "2026-11-16T10:00:00.000Z",
                  "version": 1
                },
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/SavedFunnel"
                    }
                  ],
                  "description": "The created funnel."
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "412": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Product Analytics is not enabled for this team"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Create funnel",
        "tags": [
          "Product Analytics Funnels Service"
        ],
        "x-coralogixPermissions": [
          "product-analytics:Manage"
        ]
      }
    },
