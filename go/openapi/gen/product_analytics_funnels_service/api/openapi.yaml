        "operationId": "FunnelsService_DeleteSavedFunnel",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "example": {},
                "schema": {
                  "$ref": "#/components/schemas/DeleteSavedFunnelResponse"
                }
              }
            },
            "description": ""
          },
