{
  "openapi": "3.1.0",
  "info": {
    "title": "",
    "version": "1.0.0"
  },
  "paths": {
    "/notifications/notification-center/v1/entity-types": {
      "get": {
        "description": "Returns all available notification entity types.",
        "operationId": "EntitiesService_ListEntityTypes",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListEntityTypesResponse"
                }
              }
            },
            "description": ""
          }
        },
        "summary": "List Entity Types",
        "tags": [
          "Entities service"
        ]
      }
    },
    "/notifications/notification-center/v1/entity-types/{entity_type}/attachment-types": {
      "get": {
        "description": "Returns all supported attachment types for the specified entity type.",
        "operationId": "EntitiesService_ListEntityTypeAttachmentTypes",
        "parameters": [
          {
            "description": "Entity type whose supported attachment types to list.",
            "in": "path",
            "name": "entity_type",
            "required": true,
            "schema": {
              "allOf": [
                {
                  "$ref": "#/components/schemas/notification_center.EntityType"
                }
              ],
              "description": "Entity type whose supported attachment types to list."
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "example": {
                  "supportedAttachmentTypes": [
                    {
                      "defaultEnabled": true,
                      "name": "alert_graph"
                    },
                    {
                      "defaultEnabled": false,
                      "name": "log_example"
                    }
                  ]
                },
                "schema": {
                  "$ref": "#/components/schemas/ListEntityTypeAttachmentTypesResponse"
                }
              }
            },
            "description": ""
          }
        },
        "summary": "List Entity Type Attachment Types",
        "tags": [
          "Entities service"
        ]
      }
    },
    "/notifications/notification-center/v1/entity-types/{entity_type}/entity-subtypes": {
      "get": {
        "description": "Returns all sub-types for the specified entity type.",
        "operationId": "EntitiesService_ListEntitySubTypes",
        "parameters": [
          {
            "description": "Entity type whose sub-types to list.",
            "in": "path",
            "name": "entity_type",
            "required": true,
            "schema": {
              "allOf": [
                {
                  "$ref": "#/components/schemas/notification_center.EntityType"
                }
              ],
              "description": "Entity type whose sub-types to list."
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListEntitySubTypesResponse"
                }
              }
            },
            "description": ""
          }
        },
        "summary": "List Entity Subtypes",
        "tags": [
          "Entities service"
        ]
      }
    }
  },
  "components": {
    "schemas": {
      "EntityTypeAttachmentType": {
        "type": "object",
        "properties": {
          "defaultEnabled": {
            "type": "boolean",
            "description": "Whether this attachment type is included by default when policy is Auto.",
            "examples": [
              true
            ]
          },
          "name": {
            "maxLength": 100,
            "minLength": 0,
            "pattern": "^[\\s\\S]*$",
            "type": "string",
            "description": "Attachment type identifier (e.g. 'alert_graph', 'log_example').",
            "examples": [
              "alert_graph"
            ]
          }
        },
        "description": "Supported attachment type with its default enabled state."
      },
      "FilterPathAndValues": {
        "title": "FilterPathAndValues",
        "required": [
          "path"
        ],
        "type": "object",
        "oneOf": [
          {
            "required": [
              "multipleValues"
            ],
            "type": "object"
          },
          {
            "required": [
              "filters"
            ],
            "type": "object"
          }
        ],
        "properties": {
          "filters": {
            "allOf": [
              {
                "$ref": "#/components/schemas/Filters"
              }
            ],
            "description": "The filters."
          },
          "multipleValues": {
            "$ref": "#/components/schemas/MultipleValues"
          },
          "path": {
            "minLength": 0,
            "type": "string",
            "examples": [
              "test"
            ]
          }
        },
        "description": "This data structure represents a filter path and values"
      },
      "Filters": {
        "title": "Filters",
        "required": [
          "pathAndValues"
        ],
        "type": "object",
        "properties": {
          "operator": {
            "allOf": [
              {
                "$ref": "#/components/schemas/v3.FilterOperator"
              }
            ],
            "examples": [
              "FILTER_OPERATOR_OR"
            ]
          },
          "pathAndValues": {
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/FilterPathAndValues"
            }
          }
        },
        "description": "This data structure represents a filter"
      },
      "ListEntitySubTypesResponse": {
        "type": "object",
        "properties": {
          "entitySubTypes": {
            "maxItems": 100,
            "minItems": 0,
            "type": "array",
            "items": {
              "minLength": 0,
              "type": "string",
              "description": "The entity sub types."
            },
            "description": "The entity sub types."
          }
        },
        "description": "Response containing a list of notification entity sub-types."
      },
      "ListEntityTypeAttachmentTypesResponse": {
        "type": "object",
        "properties": {
          "supportedAttachmentTypes": {
            "maxItems": 100,
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/EntityTypeAttachmentType"
            },
            "description": "The supported attachment types."
          }
        },
        "description": "Response containing a list of supported attachment types for the entity type."
      },
      "ListEntityTypesResponse": {
        "type": "object",
        "properties": {
          "entityTypes": {
            "maxItems": 100,
            "minItems": 0,
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/notification_center.EntityType"
            },
            "description": "The supported payload types."
          }
        },
        "description": "Response containing a list of notification entity types."
      },
      "MultipleValues": {
        "type": "object",
        "properties": {
          "matcher": {
            "$ref": "#/components/schemas/events.v3.FilterMatcher"
          },
          "values": {
            "minItems": 0,
            "type": "array",
            "items": {
              "minLength": 0,
              "type": "string"
            }
          }
        }
      },
      "events.v3.FilterMatcher": {
        "enum": [
          "FILTER_MATCHER_TEXT_OR_UNSPECIFIED",
          "FILTER_MATCHER_REGEXP"
        ],
        "type": "string"
      },
      "notification_center.EntityType": {
        "enum": [
          "ENTITY_TYPE_UNSPECIFIED",
          "ALERTS",
          "TEST_NOTIFICATIONS",
          "CASES",
          "OLLY_SCHEDULED_TASKS"
        ],
        "type": "string",
        "description": "Entity type."
      },
      "v3.FilterOperator": {
        "enum": [
          "FILTER_OPERATOR_AND_OR_UNSPECIFIED",
          "FILTER_OPERATOR_OR"
        ],
        "type": "string",
        "description": "Filter operator."
      }
    }
  }
}