                "description": "A filter for SLOs, consisting of a field and a predicate",
                "externalDocs": {
                  "url": ""
                },
                "properties": {
                  "field": {
                    "description": "Field used for filtering SLOs",
                    "externalDocs": {
                      "url": ""
                    },
                    "oneOf": [
                      {
                        "required": [
                          "constFilter"
                        ],
                        "type": "object"
                      },
                      {
                        "required": [
                          "labelName"
                        ],
                        "type": "object"
                      },
                      {
                        "required": [
                          "sloType"
                        ],
                        "type": "object"
                      },
                      {
                        "required": [
                          "productType"
                        ],
                        "type": "object"
                      },
                      {
                        "required": [
                          "serviceName"
                        ],
                        "type": "object"
                      },
                      {
                        "required": [
                          "ownershipServiceValues"
                        ],
                        "type": "object"
                      },
                      {
                        "required": [
                          "ownershipEnvironmentValues"
                        ],
                        "type": "object"
                      },
                      {
                        "required": [
                          "ownershipTeamValues"
                        ],
