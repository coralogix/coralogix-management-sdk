                      "A brief description of my SLO"
                    ],
                    "minLength": 0,
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "grouping": {
                    "$ref": "#/components/schemas/v1.Grouping"
                  },
                  "id": {
                    "description": "Unique identifier of the SLO.",
                    "examples": [
                      "b11919d5-ef85-4bb1-8655-02640dbe94d9"
                    ],
                    "minLength": 0,
                    "type": "string",
                    "x-coralogix-presence": true
                  },
                  "labels": {
                    "additionalProperties": {
                      "minLength": 0,
                      "type": "string"
                    },
                    "description": "List of labels.",
                    "type": "object"
                  },
                  "name": {
                    "description": "Human-readable display name for the SLO.",
                    "examples": [
                      "Example Slo Name"
                    ],
                    "minLength": 0,
                    "type": "string"
                  },
                  "ownershipTags": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/SloOwnershipTags"
                      }
