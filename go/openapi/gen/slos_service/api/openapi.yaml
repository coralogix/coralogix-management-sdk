        "description": "Returns SLOs matching the given criteria.",
        "operationId": "SlosService_ListSlos",
        "parameters": [
          {
            "description": "The filters.",
            "in": "query",
            "name": "filters",
            "required": false,
            "schema": {
              "description": "The filters.",
              "items": {
                "description": "A filter for SLOs, consisting of a field and a predicate",
                "properties": {
                  "field": {
                    "description": "Field used for filtering SLOs",
                    "oneOf": [
                      {
                        "required": [
                          "constFilter"
                        ],
                        "type": "object"
                      },
                      {
                        "required": [
                          "labelName"
                        ],
                        "type": "object"
                      },
                      {
                        "required": [
                          "sloType"
                        ],
                        "type": "object"
                      },
                      {
                        "required": [
                          "productType"
                        ],
                        "type": "object"
                      },
                      {
                        "required": [
                          "serviceName"
                        ],
                        "type": "object"
                      },
                      {
                        "required": [
                          "ownershipServiceValues"
                        ],
                        "type": "object"
                      },
                      {
                        "required": [
                          "ownershipEnvironmentValues"
                        ],
                        "type": "object"
                      },
                      {
                        "required": [
                          "ownershipTeamValues"
                        ],
                        "type": "object"
                      },
                      {
                        "not": {
                          "anyOf": [
                            {
                              "required": [
                                "constFilter"
                              ],
                              "type": "object"
                            },
                            {
                              "required": [
                                "labelName"
                              ],
                              "type": "object"
                            },
                            {
                              "required": [
                                "sloType"
                              ],
                              "type": "object"
                            },
                            {
                              "required": [
                                "productType"
                              ],
                              "type": "object"
                            },
                            {
                              "required": [
                                "serviceName"
                              ],
                              "type": "object"
                            },
                            {
                              "required": [
                                "ownershipServiceValues"
                              ],
                              "type": "object"
                            },
                            {
                              "required": [
                                "ownershipEnvironmentValues"
                              ],
                              "type": "object"
                            },
                            {
                              "required": [
                                "ownershipTeamValues"
                              ],
                              "type": "object"
                            }
                          ]
                        },
                        "type": "object"
                      }
                    ],
                    "properties": {
                      "constFilter": {
                        "$ref": "#/components/schemas/SloConstantFilterField"
                      },
                      "labelName": {
                        "description": "Filter by a specific SLO label key.",
                        "examples": [
                          "environment"
                        ],
                        "minLength": 0,
                        "type": "string"
                      },
                      "ownershipEnvironmentValues": {
                        "allOf": [
                          {
                            "$ref": "#/components/schemas/StringValues"
                          }
                        ],
                        "description": "Filter by the SLO ownership environment tag (static or resolved). IN semantics: match if the value equals any of the given strings. Applies whenever the SLO has ownership configured for environment; not limited to a specific product type."
                      },
                      "ownershipServiceValues": {
                        "allOf": [
                          {
                            "$ref": "#/components/schemas/StringValues"
                          }
                        ],
                        "description": "Filter by the SLO ownership service tag (static or resolved). IN semantics: match if the value equals any of the given strings. Applies whenever the SLO has ownership configured for service; not limited to a specific product type."
                      },
                      "ownershipTeamValues": {
                        "allOf": [
                          {
                            "$ref": "#/components/schemas/StringValues"
                          }
                        ],
                        "description": "Filter by the SLO ownership team tag (static or resolved). IN semantics: match if the value equals any of the given strings. Applies whenever the SLO has ownership configured for team; not limited to a specific product type."
                      },
                      "productType": {
                        "description": "Filter discriminator for SLO product type values.",
                        "type": "boolean"
                      },
                      "serviceName": {
                        "description": "Filter by service name from the APM SLI services list (not ownership tags). Only valid for APM product SLOs. MUST be used together with a product_type filter that includes APM; the server may reject the request otherwise. To filter by configured ownership service on any SLO type, use ownership_service_values instead.",
                        "examples": [
                          "payment-service"
                        ],
                        "minLength": 0,
                        "type": "string"
                      },
                      "sloType": {
                        "description": "Filter discriminator for SLO type values.",
                        "type": "boolean"
                      }
                    },
                    "title": "SloFilterField",
                    "type": "object"
                  },
                  "predicate": {
                    "description": "Predicate used for filtering SLOs",
                    "properties": {
                      "is": {
                        "description": "Predicate for SLO filters that checks if a field is equal to one of multiple values",
                        "oneOf": [
                          {
                            "required": [
                              "stringValues"
                            ],
                            "type": "object"
                          },
                          {
                            "required": [
                              "typeValues"
                            ],
                            "type": "object"
                          },
                          {
                            "required": [
                              "productTypeValues"
                            ],
                            "type": "object"
                          },
                          {
                            "not": {
                              "anyOf": [
                                {
                                  "required": [
                                    "stringValues"
                                  ],
                                  "type": "object"
                                },
                                {
                                  "required": [
                                    "typeValues"
                                  ],
                                  "type": "object"
                                },
                                {
                                  "required": [
                                    "productTypeValues"
                                  ],
                                  "type": "object"
                                }
                              ]
                            },
                            "type": "object"
                          }
                        ],
                        "properties": {
                          "productTypeValues": {
                            "$ref": "#/components/schemas/ProductTypeValues"
                          },
                          "stringValues": {
                            "$ref": "#/components/schemas/StringValues"
                          },
                          "typeValues": {
                            "$ref": "#/components/schemas/TypeValues"
                          }
                        },
                        "title": "IsFilterPredicate",
                        "type": "object"
                      }
                    },
                    "title": "SloFilterPredicate",
                    "type": "object"
                  }
                },
                "title": "SloFilter",
                "type": "object"
              },
              "minItems": 0,
              "type": "array"
            }
          }
        ],
