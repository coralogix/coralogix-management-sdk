                    "description": "Service, environment, and team ownership configuration for the SLO group and its permutations."
                  },
                  "productType": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/SloProductType"
                      }
                    ],
                    "description": "Product type: APM for application performance monitoring SLOs, UNSPECIFIED for manual/custom SLOs",
                    "examples": [
                      "SLO_PRODUCT_TYPE_APM"
                    ],
                    "x-coralogix-presence": true
                  },
                  "requestBasedMetricSli": {
                    "$ref": "#/components/schemas/RequestBasedMetricSli"
                  },
                  "revision": {
                    "$ref": "#/components/schemas/v1.Revision"
                  },
                  "sloTimeFrame": {
                    "$ref": "#/components/schemas/SloTimeFrame"
                  },
                  "sloType": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/SloType"
                      }
                    ],
                    "examples": [
                      "SLO_TYPE_REQUEST"
                    ],
                    "x-coralogix-presence": true
                  },
                  "targetThresholdPercentage": {
                    "description": "Target compliance percentage threshold for the SLO (e.g., 99.9 for three nines).",
                    "examples": [
                      99.999
                    ],
                    "format": "float",
                    "type": "number"
                  },
                  "type": {
                    "deprecated": true,
                    "description": "Deprecated: SLO type string. Use slo_type instead.",
                    "examples": [
                      "request"
                    ],
                    "minLength": 0,
                    "type": "string",
                    "x-coralogix-presence": true
