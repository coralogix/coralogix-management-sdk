    "/slo/slos/v1/{id}/status": {
      "get": {
        "description": "Returns lowest compliance and remaining error budget (0-1 ratios) for an SLO grouping slice over a time window.",
        "operationId": "SlosService_GetSloStatus",
        "parameters": [
          {
            "description": "Unique identifier of the SLO.",
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "description": "Unique identifier of the SLO.",
              "maxLength": 256,
              "minLength": 1,
              "pattern": "^[\\s\\S]*$",
              "type": "string"
            }
          },
          {
            "description": "Grouping label pairs that identify the slice to evaluate, passed as repeated query values. Each entry is one pair: the substring before the first comma is the label name (must not contain a comma), and the remainder of the entry (which may contain commas, or be empty) is the label value. Example: grouping_key_value=service,api&grouping_key_value=region,eu-west-1 or grouping_key_value=service, for an empty value. When omitted or empty, every permutation is considered. When provided, each label name must appear at most once and must be one of the SLO configured grouping labels; the slice includes every atomic permutation whose labels match the given pairs (a proper subset of grouping dimensions matches all permutations that agree on those labels). `lowestCompliance` and `lowestRemainingErrorBudget` are the minimum ratio across those matching permutations, not ratios recomputed from summed events across omitted dimensions.",
            "in": "query",
            "name": "grouping_key_value",
            "required": false,
            "schema": {
              "description": "Grouping label pairs that identify the slice to evaluate, passed as repeated query values. Each entry is one pair: the substring before the first comma is the label name (must not contain a comma), and the remainder of the entry (which may contain commas, or be empty) is the label value. Example: grouping_key_value=service,api&grouping_key_value=region,eu-west-1 or grouping_key_value=service, for an empty value. When omitted or empty, every permutation is considered. When provided, each label name must appear at most once and must be one of the SLO configured grouping labels; the slice includes every atomic permutation whose labels match the given pairs (a proper subset of grouping dimensions matches all permutations that agree on those labels). `lowestCompliance` and `lowestRemainingErrorBudget` are the minimum ratio across those matching permutations, not ratios recomputed from summed events across omitted dimensions.",
              "items": {
                "description": "Grouping label pairs that identify the slice to evaluate, passed as repeated query values. Each entry is one pair: the substring before the first comma is the label name (must not contain a comma), and the remainder of the entry (which may contain commas, or be empty) is the label value. Example: grouping_key_value=service,api&grouping_key_value=region,eu-west-1 or grouping_key_value=service, for an empty value. When omitted or empty, every permutation is considered. When provided, each label name must appear at most once and must be one of the SLO configured grouping labels; the slice includes every atomic permutation whose labels match the given pairs (a proper subset of grouping dimensions matches all permutations that agree on those labels). `lowestCompliance` and `lowestRemainingErrorBudget` are the minimum ratio across those matching permutations, not ratios recomputed from summed events across omitted dimensions.",
                "maxLength": 769,
                "minLength": 2,
                "pattern": "^[^,]+,.*$",
                "type": "string"
              },
              "maxItems": 50,
              "minItems": 0,
              "type": "array"
            }
          },
          {
            "description": "Inclusive lower bound of the evaluation window. When omitted, defaults to the start of the SLO configured rolling time frame ending at the effective upper bound. RFC 3339 UTC date-time on a whole-minute instant (suffix `Z`, seconds `00`, no fractional seconds).",
            "in": "query",
            "name": "from",
            "required": false,
            "schema": {
              "description": "Inclusive lower bound of the evaluation window. When omitted, defaults to the start of the SLO configured rolling time frame ending at the effective upper bound. RFC 3339 UTC date-time on a whole-minute instant (suffix `Z`, seconds `00`, no fractional seconds).",
              "format": "date-time",
              "maxLength": 20,
              "minLength": 20,
              "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:00Z$",
              "type": "string",
              "x-coralogix-presence": true
            }
          },
          {
            "description": "Exclusive upper bound of the evaluation window. When omitted, defaults to the current time with sub-minute precision truncated toward zero to the preceding whole UTC minute (for example 12:30:37Z becomes 12:30:00Z). When set, RFC 3339 UTC date-time on a whole-minute instant (suffix `Z`, seconds `00`, no fractional seconds).",
            "in": "query",
            "name": "to",
            "required": false,
            "schema": {
              "description": "Exclusive upper bound of the evaluation window. When omitted, defaults to the current time with sub-minute precision truncated toward zero to the preceding whole UTC minute (for example 12:30:37Z becomes 12:30:00Z). When set, RFC 3339 UTC date-time on a whole-minute instant (suffix `Z`, seconds `00`, no fractional seconds).",
              "format": "date-time",
              "maxLength": 20,
              "minLength": 20,
              "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:00Z$",
              "type": "string",
              "x-coralogix-presence": true
            }
          },
          {
            "description": "Optional override of the target threshold percentage for this evaluation, in the range 0-100. When omitted, the target threshold percentage configured on the SLO is used.",
            "in": "query",
            "name": "target_threshold_percentage",
            "required": false,
            "schema": {
              "description": "Optional override of the target threshold percentage for this evaluation, in the range 0-100. When omitted, the target threshold percentage configured on the SLO is used.",
              "format": "float",
              "maximum": 100,
              "minimum": 0,
              "type": "number",
              "x-coralogix-presence": true
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "example": {
                  "computedAt": "2026-06-30T12:30:00.000Z",
                  "effectiveFrom": "2026-06-01T00:00:00.000Z",
                  "effectiveTo": "2026-06-30T12:30:00.000Z",
                  "effectiveWindowCompleteData": true,
                  "lowestCompliance": 0.995,
                  "lowestRemainingErrorBudget": 0.42
                },
                "schema": {
                  "$ref": "#/components/schemas/GetSloStatusResponse"
                }
              }
            },
            "description": ""
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bad Request (for example invalid grouping slice, an evaluation window wider than 28 days after applying defaults for `from` and/or `to`, or `from` and `to` that normalize to an empty window with `effectiveFrom` >= `effectiveTo`)."
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unauthorized request"
          },
          "404": {
            "content": {
