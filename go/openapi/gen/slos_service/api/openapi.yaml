      "GetSloStatusResponse": {
        "title": "GetSloStatusResponse",
        "required": [
          "computedAt",
          "effectiveFrom",
          "effectiveTo",
          "lowestCompliance",
          "lowestRemainingErrorBudget",
          "effectiveWindowCompleteData"
        ],
        "type": "object",
        "properties": {
          "computedAt": {
            "description": "Time at which the evaluation was performed, as an RFC 3339 UTC timestamp on a whole-minute instant (suffix `Z`, no fractional seconds).",
            "format": "date-time",
            "maxLength": 20,
            "minLength": 20,
            "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:00Z$",
            "type": "string",
            "x-coralogix-presence": true
          },
          "effectiveFrom": {
            "description": "Inclusive lower bound of the evaluation window that was applied, after defaults, as an RFC 3339 UTC whole-minute instant (suffix `Z`).",
            "format": "date-time",
            "maxLength": 20,
            "minLength": 20,
            "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:00Z$",
            "type": "string",
            "x-coralogix-presence": true
          },
          "effectiveTo": {
            "description": "Exclusive upper bound of the evaluation window that was applied, after defaults, as an RFC 3339 UTC whole-minute instant (suffix `Z`).",
            "format": "date-time",
            "maxLength": 20,
            "minLength": 20,
            "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:00Z$",
            "type": "string",
            "x-coralogix-presence": true
          },
          "effectiveWindowCompleteData": {
            "type": "boolean",
            "description": "When true, recorded source metrics for the evaluated grouping slice fully cover the applied evaluation window between `effectiveFrom` and `effectiveTo`, so `lowestCompliance` and `lowestRemainingErrorBudget` may be treated as final for that window. When false, the evaluation used partial data within that window. Completeness is determined only from `effectiveFrom` and `effectiveTo` (including after request defaults); it is independent of whether the SLO configured rolling time frame has matured since creation or last revision. For example, a short, fully recorded custom window may report true here while permutations in the configured rolling window still have incomplete historical coverage."
          },
          "lowestCompliance": {
            "maximum": 1,
            "minimum": 0,
            "type": "number",
            "description": "Lowest compliance ratio among atomic permutations that match the evaluated grouping slice for the applied evaluation window, in the range 0-1 (minimum of per-permutation compliance ratios, not compliance from pooled good/total counts). When the slice is a single atomic permutation, this equals that permutation's compliance. When there are no events in the window, the value is 0.",
            "format": "float"
          },
          "lowestRemainingErrorBudget": {
            "maximum": 1,
            "minimum": 0,
            "type": "number",
            "description": "Lowest remaining error budget ratio among atomic permutations that match the evaluated grouping slice for the applied evaluation window, in the range 0-1 (minimum of per-permutation remaining error budget ratios). When the slice is a single atomic permutation, this equals that permutation's remaining error budget. When there are no events in the window, the value is 0.",
            "format": "float"
          }
        },
        "description": "Lowest compliance and remaining error budget over the atomic permutations that match the requested grouping slice (minimum of each permutation's ratio, not a recomputed ratio from pooled event counts), for the applied evaluation window (`effectiveFrom` inclusive, `effectiveTo` exclusive). Values are normalized ratios in the range 0-1."
      },
