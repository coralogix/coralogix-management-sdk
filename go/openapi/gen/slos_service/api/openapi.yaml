                }
              }
            },
            "description": "SLO not found"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Get Slo Status",
        "tags": [
          "Slos Service"
        ]
      }
    },
