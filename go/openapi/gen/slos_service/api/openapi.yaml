                      },
                      {
                        "not": {
                          "anyOf": [
                            {
                              "required": [
                                "constFilter"
                              ],
                              "type": "object"
                            },
                            {
                              "required": [
                                "labelName"
                              ],
                              "type": "object"
                            },
                            {
                              "required": [
                                "sloType"
                              ],
                              "type": "object"
                            },
                            {
                              "required": [
                                "productType"
                              ],
                              "type": "object"
                            },
                            {
                              "required": [
                                "serviceName"
                              ],
                              "type": "object"
                            },
                            {
                              "required": [
                                "ownershipServiceValues"
                              ],
                              "type": "object"
                            },
                            {
                              "required": [
                                "ownershipEnvironmentValues"
                              ],
                              "type": "object"
                            },
                            {
                              "required": [
                                "ownershipTeamValues"
                              ],
                              "type": "object"
                            }
                          ]
                        },
                        "type": "object"
                      }
                    ],
                    "properties": {
                      "constFilter": {
                        "$ref": "#/components/schemas/SloConstantFilterField"
                      },
                      "labelName": {
                        "description": "Filter by a specific SLO label key.",
                        "examples": [
                          "environment"
                        ],
                        "minLength": 0,
                        "type": "string"
                      },
                      "ownershipEnvironmentValues": {
                        "allOf": [
                          {
                            "$ref": "#/components/schemas/StringValues"
                          }
                        ],
                        "description": "Filter by the SLO ownership environment tag (static or resolved). IN semantics: match if the value equals any of the given strings. Applies whenever the SLO has ownership configured for environment; not limited to a specific product type."
                      },
                      "ownershipServiceValues": {
                        "allOf": [
                          {
                            "$ref": "#/components/schemas/StringValues"
                          }
                        ],
                        "description": "Filter by the SLO ownership service tag (static or resolved). IN semantics: match if the value equals any of the given strings. Applies whenever the SLO has ownership configured for service; not limited to a specific product type."
                      },
                      "ownershipTeamValues": {
                        "allOf": [
                          {
                            "$ref": "#/components/schemas/StringValues"
                          }
                        ],
                        "description": "Filter by the SLO ownership team tag (static or resolved). IN semantics: match if the value equals any of the given strings. Applies whenever the SLO has ownership configured for team; not limited to a specific product type."
                      },
                      "productType": {
                        "description": "Filter discriminator for SLO product type values.",
                        "type": "boolean"
                      },
                      "serviceName": {
                        "description": "Filter by service name from the APM SLI services list (not ownership tags). Only valid for APM product SLOs. MUST be used together with a product_type filter that includes APM; the server may reject the request otherwise. To filter by configured ownership service on any SLO type, use ownership_service_values instead.",
