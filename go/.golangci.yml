version: "2"

linters:
  default: standard
  enable:
    - revive
  disable:
    - staticcheck
  settings:
    errcheck:
      exclude-functions:
        - (*google.golang.org/grpc.ClientConn).Close
        - (net/http.Response).Body.Close
    revive:
      rules:
        - name: package-comments
          disabled: true
